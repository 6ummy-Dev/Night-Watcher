  - heading "2 DC Animated Universe 0 of 10" [level=2]:
    - button "2 DC Animated Universe 0 of 10" [expanded]
  - paragraph: "Bruce Timm’s world, Kevin Conroy’s voice — the foundation everything after gets measured against. The full weave: the two-minute pitch reel first, then The Animated Series, dropping Mask of the Phantasm in around season two and SubZero after it. Then The New Batman Adventures, detouring into Superman’s ‘World’s Finest’ and ‘Knight Time’, and finishing with Mystery of the Batwoman and Chase Me — the Gotham Girls shorts sit alongside these, and Batman and Harley Quinn was made two decades later but belongs here too. Static Shock is its own show with three crossings into Batman’s, which is why it is filed in the middle. Then Batman Beyond, Zeta and Return of the Joker — fifty years on, and they run before Justice League, because JLU’s ‘Epilogue’ is Beyond’s ending rather than its trailer. Justice League and Unlimited close the weave, with Batman and Harley Quinn filed last as the late coda it is."
  - button "Mark The Dark Knight’s First Night watched"
  - button "The Dark Knight’s First Night 1991 · Short OPTIONAL SHORT Rated NR" [expanded]:
    - text: The Dark Knight’s First Night 1991 · Short OPTIONAL SHORT
    - img "Rated NR": NR
  - paragraph: "The two-minute reel Bruce Timm and Eric Radomski made to sell Fox on the series: Batman against three jewel thieves on a rooftop, gone before Gordon arrives. The style is already all there; the soundtrack was lost, so it ships with the show’s theme over it."
