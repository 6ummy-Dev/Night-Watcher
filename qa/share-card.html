<!DOCTYPE html>
<!-- The share card layout. Filled and rendered by qa/make-share-card.mjs;
     every face, color and mark below is the app's own. {{ROOT}} becomes a
     file:// URL to the repository root, {{BAT}} a data URL of the bat
     silhouette extracted from docs/icon.png, and the three counts come from
     PATH itself — the card cannot say something the catalogue does not. -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"Limelight";src:url("{{ROOT}}/docs/fonts/limelight-latin-400-normal.woff2") format("woff2");}
@font-face{font-family:"Anton";src:url("{{ROOT}}/docs/fonts/anton-latin-400-normal.woff2") format("woff2");}
@font-face{font-family:"IBM Plex Sans";src:url("{{ROOT}}/docs/fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2");font-weight:400;}
@font-face{font-family:"IBM Plex Mono";src:url("{{ROOT}}/docs/fonts/ibm-plex-mono-latin-400-normal.woff2") format("woff2");font-weight:400;}
@font-face{font-family:"IBM Plex Mono";src:url("{{ROOT}}/docs/fonts/ibm-plex-mono-latin-600-normal.woff2") format("woff2");font-weight:600;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;}
#card{width:1200px;height:630px;position:relative;overflow:hidden;
  background:radial-gradient(ellipse 1000px 760px at 50% 8%, #111a2d 0%, #05070C 60%);}
#card .ghost{position:absolute;right:-70px;top:110px;width:600px;opacity:.06;}
#card .top{position:absolute;top:58px;left:0;width:100%;text-align:center;}
#card .top img{width:78px;display:block;margin:0 auto 14px;}
#card .top .w{font-family:"Limelight";color:#E7E9F0;font-size:44px;text-transform:uppercase;letter-spacing:.04em;}
#card .stats{position:absolute;top:238px;left:0;width:100%;display:flex;justify-content:center;}
#card .st{padding:0 60px;text-align:center;}
#card .st + .st{border-left:1px solid #252E42;}
#card .st .n{font-family:"Anton";color:#FFCF1F;font-size:154px;line-height:1;text-shadow:0 0 60px rgba(255,207,31,.18);}
#card .st .l{font-family:"IBM Plex Mono";font-weight:400;color:#93A0B8;font-size:23px;letter-spacing:.22em;text-transform:uppercase;margin-top:12px;}
#card .tag{position:absolute;bottom:104px;width:100%;text-align:center;font-family:"IBM Plex Sans";font-weight:400;color:#93A0B8;font-size:28px;}
#card .site{position:absolute;bottom:36px;width:100%;text-align:center;font-family:"IBM Plex Mono";font-weight:400;color:#5f6b84;font-size:20px;letter-spacing:.08em;}
#card .strip{position:absolute;bottom:0;left:0;width:100%;height:8px;display:flex;gap:3px;}
#card .strip i{flex:1;background:#FFCF1F;opacity:.22;}
#card .strip i:nth-child(5n){opacity:.5;}
</style></head><body>
<div id="card">
  <img class="ghost" src="{{BAT}}">
  <div class="top"><img src="{{BAT}}"><div class="w">Night Watcher</div></div>
  <div class="stats">
    <div class="st"><div class="n">{{FILMS}}</div><div class="l">Films</div></div>
    <div class="st"><div class="n">{{SEASONS}}</div><div class="l">Seasons</div></div>
    <div class="st"><div class="n">{{CONTINUITIES}}</div><div class="l">Continuities</div></div>
  </div>
  <div class="tag">Batman watch orders. No spoilers.</div>
  <div class="site">nightwatcher.life</div>
  <div class="strip">{{TICKS}}</div>
</div>
</body></html>
