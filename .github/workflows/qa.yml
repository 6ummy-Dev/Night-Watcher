# Runs every suite on every push and pull request, and again nightly.
#
# This is the tamper detector. index.html carries several independent tripwires —
# the CSP script hash, the frozen-ID snapshot, the changelog/BUILD/sw.js version
# lock, the README size figure, and the third-party origin allowlist — and any
# edit that is not deliberate trips at least one of them. They were only ever
# run by hand before this existed, which meant they protected nothing between
# commits.
name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly, 03:17 UTC. Not for the tree, which does not change on its own, but
  # for everything around it: a runner image that moves, a Node 22 patch, an npm
  # registry that resolves differently. A suite that only runs when someone
  # pushes cannot tell you it broke while you were not looking.
  schedule:
    - cron: "17 3 * * *"

# Read-only. Nothing here needs to write to the repository.
permissions:
  contents: read

# Two uploads in quick succession used to queue, so the second waited out the
# first run of a suite whose result it was about to supersede. The newest commit
# on a ref is the only one whose answer matters.
#
# event_name is in the group because the nightly run exists to fire when nobody
# is pushing. Without it a 03:17 run and a late push share a group and can cancel
# each other, which costs the one run that was not triggered by a human.
concurrency:
  group: qa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # engines pins ^22.22.2 and .npmrc says engine-strict, so a runner
          # image whose cached Node 22 lags the patch hard-fails at npm ci;
          # check-latest asks for the newest 22 instead of the cached one.
          check-latest: true
          cache: npm

      # ci, not install: the lockfile is committed so that what runs here is
      # what was reviewed, not whatever the version ranges resolve to today.
      - run: npm ci

      - run: npm test

  # The negative suites. Each fixture breaks one thing on purpose in a throwaway
  # copy of the tree and asserts the guards go red for the right reason — the
  # only evidence that any of them protects anything. They run on every push,
  # not only on pull requests: releases here are direct commits to main, so a
  # PR-gated job never runs (it did not, for a long time — NOTES.md).
  #
  # Cost: 1138 fixtures, of which 1072 run guards.js and 66 run smoke.js — most
  # of those scoped to one phase by SMOKE_ONLY. The split is guarded in this
  # file the same as the README's counts, so the next drift fails the build.
  # run-all.sh dispatches longest-first; this job shards 4-way on top, packed
  # by fixture weight (a smoke fixture costs about forty guards fixtures), so
  # the wall clock is a quarter-shard, not the tail of one runner. The
  # fixture-count guard runs per shard off the full checkout, so every shard
  # still verifies the totals against all suites on disk. The packing is
  # greedy by weight, heaviest suite into the lightest shard (4.9.0 — the
  # hand-packed lists had drifted to 1042 / 807 / 855 / 804, one shard 30%
  # over the others); repack when a suite lands. Guard 113 measures the
  # balance on every run, so the weights live nowhere in prose.
  negative:
    runs-on: ubuntu-latest
    # Room for a shard's serial worst case, short enough that a fixture wedged
    # in an infinite loop fails instead of burning the six-hour default.
    timeout-minutes: 15
    strategy:
      # One shard failing is one answer; the other three finishing is three
      # more. A red run should show every red suite, not the first.
      fail-fast: false
      matrix:
        include:
          - shard: "1"
            pick: 'negtest(177|180|182|273|300|340|380|410|450|476|478|520|580|630|640)\.sh'
          - shard: "2"
            pick: 'negtest(161|166|175|181|185|186|200|250|252|271|330|370|390|440|470|480|500|560|610)\.sh'
          - shard: "3"
            pick: 'negtest(162|163|165|171|172|187|190|220|270|272|320|350|430|460|475|510|530|590|600)\.sh'
          - shard: "4"
            pick: 'negtest(131|164|170|176|183|195|210|251|260|310|360|400|420|490|540|550|570|620)\.sh|negtest\.sh'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # engines pins ^22.22.2 and .npmrc says engine-strict, so a runner
          # image whose cached Node 22 lags the patch hard-fails at npm ci;
          # check-latest asks for the newest 22 instead of the cached one.
          check-latest: true
          cache: npm

      - run: npm ci

      # The union check. The shard lists above are prose, and prose drifts —
      # a suite added to qa/negative/ but not to a pick pattern would silently
      # never run in CI. Every shard asserts the union covers every suite on
      # disk, reading the patterns out of this file rather than restating them
      # (a restated copy drifted, and failed loudly about the wrong thing
      # while quietly skipping the work — NOTES.md). It asserts it read four,
      # because a check that reads zero calls every suite uncovered and one
      # that reads three waves a whole missing shard through.
      - name: every suite lands in some shard
        run: |
          PATTERNS=$(sed -n "s/^ *pick: '\(.*\)'$/\1/p" .github/workflows/qa.yml)
          COUNT=$(printf '%s\n' "$PATTERNS" | grep -c .)
          if [ "$COUNT" -ne 4 ]; then
            echo "read $COUNT shard patterns out of qa.yml, expected 4 —"
            echo "the matrix changed shape, or the pick lines stopped being readable"
            exit 1
          fi
          MISSED=0
          for f in qa/negative/negtest*.sh; do
            HIT=0
            while IFS= read -r p; do
              [ -n "$p" ] && echo "$f" | grep -Eq "$p" && HIT=1
            done <<< "$PATTERNS"
            [ "$HIT" -eq 1 ] || { echo "no shard runs $f"; MISSED=1; }
          done
          exit $MISSED

      - run: bash qa/negative/run-all.sh '${{ matrix.pick }}'

  # The behavioral instrument. browser-check.mjs is the only tool that can
  # observe scroll restore, focus restore, belt park/drop rendering, sticky
  # offsets, the service worker's offline promise, CSP console violations and
  # the axe passes — precisely the defect classes with this project's worst
  # shipping history. It runs on every push and nightly like everything else:
  # the workflow exists so that no suite's evidence is produced only by hand
  # on the release machine. Two engines, one job: iOS is where the clip-path
  # ornaments actually ship, and a WebKit-only red is exactly the finding the
  # second engine exists to produce. The two are independent (fail-fast off).
  browser:
    # Pinned, not latest: `playwright install --with-deps` runs apt with a
    # package list the pinned Playwright must know, and every time GitHub
    # advances ubuntu-latest this job dies at ~40s until the pin catches up.
    # Playwright 1.62 (package-lock.json) supports 24.04; re-check the
    # supported images whenever the Playwright pin moves, and move this one
    # only then.
    runs-on: ubuntu-24.04
    # The check itself takes ~1 minute; the browser download dominates.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # engines pins ^22.22.2 and .npmrc says engine-strict, so a runner
          # image whose cached Node 22 lags the patch hard-fails at npm ci;
          # check-latest asks for the newest 22 instead of the cached one.
          check-latest: true
          cache: npm

      - run: npm ci

      # ~150 MB re-downloaded on every run was this job's dominant cost. The
      # key carries the lockfile hash, so a Playwright bump invalidates it and
      # nothing else does.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.engine }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install ${{ matrix.engine }} --with-deps

      # A served copy, not file:// — sw.js registration and the CSP only
      # behave like production over HTTP. The port is browser-check's default.
      # The loop waits for the server to bind: a fixed sleep is a bet that a
      # loaded runner loses, and the loss reads as a browser bug.
      - run: |
          python3 -m http.server 8099 --directory docs &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8099/index.html && break
            sleep 0.5
          done
          NW_ENGINE=${{ matrix.engine }} npm run browser

      # The screenshots browser-check writes are the evidence a red run
      # leaves behind; a green run's are noise. Kept for a week.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-shots-${{ matrix.engine }}
          path: qa/.shots/
          if-no-files-found: ignore
          retention-days: 7
