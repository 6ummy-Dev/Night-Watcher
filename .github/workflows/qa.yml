# Runs every suite on every push and pull request, and again nightly.
#
# This is the tamper detector. index.html carries several independent tripwires —
# the CSP script hash, the frozen-ID snapshot, the changelog/BUILD/sw.js version
# lock, the README size figure, and the third-party origin allowlist — and any
# edit that is not deliberate trips at least one of them. They were only ever
# run by hand before this existed, which meant they protected nothing between
# commits.
name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly, 03:17 UTC. Not for the tree, which does not change on its own, but
  # for everything around it: a runner image that moves, a Node 22 patch, an npm
  # registry that resolves differently. A suite that only runs when someone
  # pushes cannot tell you it broke while you were not looking.
  schedule:
    - cron: "17 3 * * *"

# Read-only. Nothing here needs to write to the repository.
permissions:
  contents: read

# Two uploads in quick succession used to queue, so the second waited out the
# first run of a suite whose result it was about to supersede. The newest commit
# on a ref is the only one whose answer matters.
#
# event_name is in the group because the nightly run exists to fire when nobody
# is pushing. Without it a 03:17 run and a late push share a group and can cancel
# each other, which costs the one run that was not triggered by a human.
concurrency:
  group: qa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 6.3.0. An issue pull request runs the paper's checks, not the app's. The
  # drafting agent can only change the paper (nocturne-fence.yml holds that),
  # so a pull request whose every changed path is inside the fence cannot
  # touch the app: it runs every guard (a second's work) and the paper half
  # of the browser check, and skips smoke, the negative shards and the app
  # half of the browser check. Anything outside the fence gets everything.
  # Skipped as steps, never as a paths filter, so a required check still
  # reports. Every push to main and the nightly run everything, so a merge
  # that slipped past goes red on main. Guard 163 holds this job's shape.
  scope:
    runs-on: ubuntu-latest
    outputs:
      paper: ${{ steps.scope.outputs.paper }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: scope
        name: an issue pull request runs the paper's checks
        run: |
          PAPER=false
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --no-renames --name-only HEAD^1 HEAD)
            if [ -n "$CHANGED" ] && ! printf '%s\n' "$CHANGED" | grep -Ev '^(nocturne/issues/|nocturne/NOTEBOOK\.md$|docs/nocturne/|docs/sitemap\.xml$)' >/dev/null; then
              PAPER=true
            fi
          fi
          echo "paper=$PAPER" >> "$GITHUB_OUTPUT"
          echo "paper only: $PAPER"

  test:
    needs: scope
    runs-on: ubuntu-latest
    strategy:
      # engines advertises ^22 || ^24 || >=26 and until 5.3.0 CI only ever
      # ran 22 — the QA's point: nightly would catch a 22 patch and never a
      # 24 break. The fast job runs both advertised LTS lines; the negative
      # wall and the browser job stay on 22, where the cost lives. 6.5.1: and
      # 26, the third line engines advertises (LTS from October).
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: ${{ matrix.node }}
          # engines pins ^22.22.2 / ^24.15.0 and .npmrc says engine-strict, so
          # a runner image whose cached Node lags the patch hard-fails at
          # npm ci; check-latest asks for the newest of the line instead of
          # the cached one.
          check-latest: true
          cache: npm

      # ci, not install: the lockfile is committed so that what runs here is
      # what was reviewed, not whatever the version ranges resolve to today.
      - run: npm ci

      - if: needs.scope.outputs.paper != 'true'
        run: npm test

      - if: needs.scope.outputs.paper == 'true'
        name: the paper's checks (an issue pull request)
        run: node qa/guards.js

  # The negative suites. Each fixture breaks one thing on purpose in a throwaway
  # copy of the tree and asserts the guards go red for the right reason — the
  # only evidence that any of them protects anything. They run on the pull
  # request (the gate), again on the push to main (a merge publishes), and
  # on the nightly cron. Direct commits are what the ruleset is there to
  # refuse. The job also runs on push because, for a long time, a PR-gated
  # job never ran (NOTES-history.md ("Where the served and config files'
  # histories went")).
  #
  # Cost: 1836 fixtures, of which 1719 run guards.js and 117 run smoke.js — most
  # of those scoped to one phase by SMOKE_ONLY. The split is guarded in this
  # file the same as the README's counts, so the next drift fails the build.
  # run-all.sh dispatches longest-first; this job shards 4-way on top, packed
  # by fixture weight (a smoke fixture costs about forty guards fixtures), so
  # the wall clock is a quarter-shard, not the tail of one runner. The
  # fixture-count guard runs per shard off the full checkout, so every shard
  # still verifies the totals against all suites on disk. The packing is
  # greedy by weight, heaviest suite into the lightest shard (4.9.0 — the
  # hand-packed lists had drifted to 1042 / 807 / 855 / 804, one shard 30%
  # over the others); repack when a suite lands. Guard 113 measures the
  # balance on every run, so the weights live nowhere in prose.
  negative:
    needs: scope
    runs-on: ubuntu-latest
    # Room for a shard's serial worst case, short enough that a fixture wedged
    # in an infinite loop fails instead of burning the six-hour default.
    timeout-minutes: 15
    strategy:
      # One shard failing is one answer; the other three finishing is three
      # more. A red run should show every red suite, not the first.
      fail-fast: false
      matrix:
        include:
          - shard: "1"
            pick: 'negtest(162|165|186|190|260|300|310|340|360|370|440|540|550|560|570|590|610|660|680|681|790|810|870)\.sh|negtest\.sh'
          - shard: "2"
            pick: 'negtest(163|166|172|177|180|183|185|187|200|210|271|330|420|475|478|500|510|520|640|690|700|730|780|850)\.sh'
          - shard: "3"
            pick: 'negtest(131|161|164|171|175|176|220|251|270|350|390|410|460|490|530|620|630|710|740|770|800|820|830|840|860)\.sh'
          - shard: "4"
            pick: 'negtest(170|181|182|195|250|252|272|273|320|380|400|430|450|470|476|480|580|600|650|670|720|750|760|880)\.sh'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # engines pins ^22.22.2 and .npmrc says engine-strict, so a runner
          # image whose cached Node 22 lags the patch hard-fails at npm ci;
          # check-latest asks for the newest 22 instead of the cached one.
          check-latest: true
          cache: npm

      - if: needs.scope.outputs.paper != 'true'
        run: npm ci

      # The union check. The shard lists above are prose, and prose drifts —
      # a suite added to qa/negative/ but not to a pick pattern would silently
      # never run in CI. Every shard asserts the union covers every suite on
      # disk, reading the patterns out of this file rather than restating them
      # (a restated copy drifted, and failed loudly about the wrong thing
      # while quietly skipping the work — NOTES-history.md ("Where the served
      # and config files' histories went")). It asserts it read four,
      # because a check that reads zero calls every suite uncovered and one
      # that reads three waves a whole missing shard through.
      - name: every suite lands in some shard
        if: needs.scope.outputs.paper != 'true'
        run: |
          PATTERNS=$(sed -n "s/^ *pick: '\(.*\)'$/\1/p" .github/workflows/qa.yml)
          COUNT=$(printf '%s\n' "$PATTERNS" | grep -c .)
          if [ "$COUNT" -ne 4 ]; then
            echo "read $COUNT shard patterns out of qa.yml, expected 4 —"
            echo "the matrix changed shape, or the pick lines stopped being readable"
            exit 1
          fi
          MISSED=0
          for f in qa/negative/negtest*.sh; do
            HIT=0
            while IFS= read -r p; do
              [ -n "$p" ] && echo "$f" | grep -Eq "$p" && HIT=1
            done <<< "$PATTERNS"
            [ "$HIT" -eq 1 ] || { echo "no shard runs $f"; MISSED=1; }
          done
          exit $MISSED

      - if: needs.scope.outputs.paper != 'true'
        run: bash qa/negative/run-all.sh '${{ matrix.pick }}'

  # 6.2.3: the fence around the drafting agent moved to its own workflow,
  # nocturne-fence.yml, on pull_request_target, so a pull request cannot
  # rewrite the check that judges it. Guard 163 holds that file's shape and
  # that this one no longer carries a copy.

  # The behavioral instrument. browser-check.mjs is the only tool that can
  # observe scroll restore, focus restore, belt park/drop rendering, sticky
  # offsets, the service worker's offline promise, CSP console violations and
  # the axe passes — precisely the defect classes with this project's worst
  # shipping history. It runs on every push and nightly like everything else:
  # the workflow exists so that no suite's evidence is produced only by hand
  # on the release machine. Two engines, one job: iOS is where the clip-path
  # ornaments actually ship, and a WebKit-only red is exactly the finding the
  # second engine exists to produce. The two are independent (fail-fast off).
  browser:
    needs: scope
    # Pinned, not latest: `playwright install --with-deps` runs apt with a
    # package list the pinned Playwright must know, and every time GitHub
    # advances ubuntu-latest this job dies at ~40s until the pin catches up.
    # Playwright 1.62 (package-lock.json) supports 24.04; re-check the
    # supported images whenever the Playwright pin moves, and move this one
    # only then.
    runs-on: ubuntu-24.04
    # The check itself takes ~1 minute; the browser download dominates.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # engines pins ^22.22.2 and .npmrc says engine-strict, so a runner
          # image whose cached Node 22 lags the patch hard-fails at npm ci;
          # check-latest asks for the newest 22 instead of the cached one.
          check-latest: true
          cache: npm

      - run: npm ci

      # ~150 MB re-downloaded on every run was this job's dominant cost. The
      # key carries the installed Playwright version (5.3.1 — it carried the
      # whole lockfile's hash before, so a jsdom bump re-downloaded a browser
      # for nothing), so a Playwright bump invalidates it and nothing else does.
      - id: pwv
        run: echo "v=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.engine }}-${{ runner.os }}-${{ steps.pwv.outputs.v }}

      - run: npx playwright install ${{ matrix.engine }} --with-deps

      # A served copy, not file:// — sw.js registration and the CSP only
      # behave like production over HTTP. The port is browser-check's default.
      # qa/hdr-server.mjs applies docs/_headers. python's http.server does not,
      # so the paper's CSP and the /* set would never be what this job saw.
      # The loop waits for the server to bind: a fixed sleep is a bet that a
      # loaded runner loses, and the loss reads as a browser bug.
      - run: |
          node qa/hdr-server.mjs docs 8099 &
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://127.0.0.1:8099/index.html && break
            sleep 0.5
          done
          NW_ENGINE=${{ matrix.engine }} NW_ONLY=${{ needs.scope.outputs.paper == 'true' && 'paper' || 'all' }} npm run browser

      # The screenshots browser-check writes are the evidence a red run
      # leaves behind; a green run's are noise. Kept for a week.
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-shots-${{ matrix.engine }}
          path: qa/.shots/
          if-no-files-found: ignore
          retention-days: 7

  # 6.8.0. The ping. A merge to main publishes the site (Cloudflare builds
  # from Git) and until now nothing told anyone: a search engine found a new
  # issue on its next crawl, a feed reader on its next poll. This job runs on
  # the push to main only, after the three suites are green, waits for the
  # live sitemap to become the one in the tree (the deploy is not this
  # workflow's, so it is watched, not assumed), then submits the paper's
  # changed URLs and the root to IndexNow under the key docs/ already serves
  # (3.4.0), and tells the feed's WebSub hub the feed moved. Both calls are
  # one POST each, with nothing secret in them: the key is public by design.
  # Guard 181 holds this job's shape. It does not wait on scope — guard 163
  # counts the three jobs that do — and a pull request never runs it.
  ping:
    needs: [test, negative, browser]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: the live sitemap is the tree's
        run: |
          for i in $(seq 1 90); do
            if curl -sf https://nightwatcher.life/sitemap.xml -o /tmp/live-sitemap.xml && cmp -s /tmp/live-sitemap.xml docs/sitemap.xml; then
              echo "live after $i poll(s)"; exit 0
            fi
            sleep 10
          done
          echo "the live sitemap did not become the tree's within 15 minutes — the deploy did not land, so nothing is announced"
          exit 1

      - name: IndexNow, the root and the paper's URLs that changed
        run: |
          KEY=3e6082eed9f040d5bc8ab07531bf58b9
          BLOCK=$(sed -n '/nocturne:begin/,/nocturne:end/p' docs/sitemap.xml)
          NEWEST=$(printf '%s\n' "$BLOCK" | grep -m1 -o '<lastmod>[^<]*' | cut -c10-)
          URLS=$(printf '%s\n' "$BLOCK" | awk -v d="$NEWEST" '/<loc>/{gsub(/.*<loc>|<\/loc>.*/,""); loc=$0} /<lastmod>/{gsub(/.*<lastmod>|<\/lastmod>.*/,""); if($0==d) print loc}')
          printf '%s\n' "https://nightwatcher.life/" $URLS | jq -R . | jq -s --arg key "$KEY" \
            '{host: "nightwatcher.life", key: $key, keyLocation: ("https://nightwatcher.life/" + $key + ".txt"), urlList: .}' > /tmp/indexnow.json
          cat /tmp/indexnow.json
          CODE=$(curl -sS -o /tmp/indexnow.out -w '%{http_code}' -X POST -H 'Content-Type: application/json; charset=utf-8' --data @/tmp/indexnow.json https://api.indexnow.org/indexnow)
          echo "IndexNow answered $CODE"; cat /tmp/indexnow.out || true
          case "$CODE" in 200|202) ;; *) exit 1 ;; esac

      - name: WebSub, the feed moved
        run: |
          CODE=$(curl -sS -o /dev/null -w '%{http_code}' -d hub.mode=publish -d hub.url=https://nightwatcher.life/nocturne/feed.xml https://pubsubhubbub.appspot.com/)
          echo "the hub answered $CODE"
          case "$CODE" in 200|202|204) ;; *) exit 1 ;; esac
