# Runs every suite on every push and pull request, and again nightly.
#
# This is the tamper detector. index.html carries several independent tripwires —
# the CSP script hash, the frozen-ID snapshot, the changelog/BUILD/sw.js version
# lock, the README size figure, and the third-party origin allowlist — and any
# edit that is not deliberate trips at least one of them. They were only ever
# run by hand before this existed, which meant they protected nothing between
# commits.
name: QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly, 03:17 UTC. Not for the tree, which does not change on its own, but
  # for everything around it: a runner image that moves, a Node 22 patch, an npm
  # registry that resolves differently. A suite that only runs when someone
  # pushes cannot tell you it broke while you were not looking.
  schedule:
    - cron: "17 3 * * *"

# Read-only. Nothing here needs to write to the repository.
permissions:
  contents: read

# Two uploads in quick succession used to queue, so the second waited out the
# first run of a suite whose result it was about to supersede. The newest commit
# on a ref is the only one whose answer matters.
#
# event_name is in the group because the nightly run exists to fire when nobody
# is pushing. Without it a 03:17 run and a late push share a group and can cancel
# each other, which costs the one run that was not triggered by a human.
concurrency:
  group: qa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # ci, not install: the lockfile is committed so that what runs here is
      # what was reviewed, not whatever the version ranges resolve to today.
      - run: npm ci

      - run: npm test

  # The negative suites. Each fixture breaks one thing on purpose in a throwaway
  # copy of the tree and asserts the guards go red for the right reason — the
  # only evidence that any of them protects anything.
  #
  # These were gated behind `if: github.event_name == 'pull_request'` until
  # 1.8.3, on the reasoning that they are slow. The reasoning was sound and the
  # conclusion was wrong: releases here ship by uploading the tree, which is a
  # direct commit to main, so pull requests essentially never happen and this
  # job had almost certainly never run in CI at all. The evidence that the
  # guards work was produced only on the release machine, by hand — which is the
  # exact situation this workflow was created to end.
  #
  # Cost, measured rather than averaged: 646 fixtures, of which 579 run guards.js
  # at about 0.26s each (halved 6 Aug by memoising idHash) and 32 run smoke.js — most of those scoped to one phase
  # by SMOKE_ONLY (2.2.0, report §5.4) at 2–10s instead of the full run's ~14s.
  # run-all.sh runs the suites concurrently and dispatches longest-first
  # (report §5.1); this job shards them 4-way on top (report §5.2), balanced by
  # smoke-fixture weight, so the wall clock is a quarter-shard, not the tail of
  # one runner. The fixture-count guard runs per shard off the full checkout,
  # so every shard still verifies the totals against all suites on disk.
  negative:
    runs-on: ubuntu-latest
    # Room for a shard's serial worst case, short enough that a fixture wedged
    # in an infinite loop fails instead of burning the six-hour default.
    timeout-minutes: 15
    strategy:
      # One shard failing is one answer; the other three finishing is three
      # more. A red run should show every red suite, not the first.
      fail-fast: false
      matrix:
        include:
          - shard: "1"
            pick: 'negtest(175|164|190|195|200|250|251|273|320|350|380)\.sh'
          - shard: "2"
            pick: 'negtest(183|171|166|161|162|252|270|310|330|360|131)\.sh'
          - shard: "3"
            pick: 'negtest(165|170|172|187|163|210|260|271|340|370)\.sh'
          - shard: "4"
            pick: 'negtest(300|185|182|186|180|176|177|181|220|272)\.sh|negtest\.sh'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The union check. The shard lists above are prose, and prose drifts —
      # a suite added to qa/negative/ but not to a pick pattern would silently
      # never run in CI. Every shard asserts the union covers every suite on
      # disk, so the drift fails the build the same day it happens.
      #
      # It used to carry a FIFTH copy of the shard lists, hand-maintained, with
      # a comment asking whoever edited the matrix to keep the two in step.
      # Nobody did: negtest252 was added to shard 2 in the 2.5.2 round and
      # negtest260 to shard 3 in 2.6.0, and neither reached the copy. Both
      # uploads went red on this step — and because it runs BEFORE run-all.sh,
      # the negative suites did not run in CI at all for two releases. The
      # check written to catch pick-pattern drift drifted, and it failed loudly
      # about the wrong thing while quietly skipping the work.
      #
      # It now reads the patterns out of this file instead of restating them,
      # so there is one source and no copy to forget. It also asserts it read
      # four of them, because a check that silently reads zero patterns would
      # call every suite uncovered, and one that reads three would wave a whole
      # missing shard through.
      - name: every suite lands in some shard
        run: |
          PATTERNS=$(sed -n "s/^ *pick: '\(.*\)'$/\1/p" .github/workflows/qa.yml)
          COUNT=$(printf '%s\n' "$PATTERNS" | grep -c .)
          if [ "$COUNT" -ne 4 ]; then
            echo "read $COUNT shard patterns out of qa.yml, expected 4 —"
            echo "the matrix changed shape, or the pick lines stopped being readable"
            exit 1
          fi
          MISSED=0
          for f in qa/negative/negtest*.sh; do
            HIT=0
            while IFS= read -r p; do
              [ -n "$p" ] && echo "$f" | grep -Eq "$p" && HIT=1
            done <<< "$PATTERNS"
            [ "$HIT" -eq 1 ] || { echo "no shard runs $f"; MISSED=1; }
          done
          exit $MISSED

      - run: bash qa/negative/run-all.sh '${{ matrix.pick }}'
