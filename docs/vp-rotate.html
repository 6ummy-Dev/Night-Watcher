<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NW probe">
<meta name="theme-color" content="#0A0C11">
<title>Night Watcher — rotation probe</title>
<style>
:root{ --ink:#08090F; --hdr:#0A0C11; --line:#252E42; --bone:#E7E9F0; --dim:#8B97B1; --signal:#FFCF1F; --crimson:#C43A30; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{background:var(--hdr);color:var(--bone);font:12px/1.35 ui-monospace,"SF Mono",Menlo,monospace;}
/* The app's frame, copied shape-for-shape from docs/index.html. */
#app{background:var(--ink);display:flex;flex-direction:column;height:100%;height:100svh;height:100dvh;overflow:hidden;}
@media (display-mode: standalone){#app{height:100%;max-height:100dvh;}}
header{position:sticky;top:0;z-index:30;background:var(--hdr);border-bottom:1px solid var(--line);
       padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;}
header b{color:var(--signal);letter-spacing:.14em;text-transform:uppercase;font-size:11px;}
main{flex:1;min-height:0;overflow-y:auto;padding:10px 14px 20px;}
#tabs{flex:none;display:flex;justify-content:center;align-items:center;height:58px;
      border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);color:var(--dim);letter-spacing:.14em;font-size:10px;}
.probe{position:absolute;top:0;left:-9999px;width:1px;}
.probe i{display:block;width:1px;}
.p100vh{height:100vh;}.p100svh{height:100svh;}.p100lvh{height:100lvh;}.p100dvh{height:100dvh;}
.pTop{height:env(safe-area-inset-top);}.pBot{height:env(safe-area-inset-bottom);}
table{border-collapse:collapse;width:100%;margin:0 0 14px;}
th,td{text-align:left;padding:3px 6px 3px 0;vertical-align:top;border-bottom:1px solid #161d2e;white-space:nowrap;}
th{color:var(--dim);font-weight:400;}
td.n{text-align:right;font-variant-numeric:tabular-nums;}
td.bad{color:var(--crimson);font-weight:700;}
td.good{color:var(--signal);}
h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--signal);margin:16px 0 6px;}
p.note{color:var(--dim);margin:0 0 12px;line-height:1.5;}
button{font:inherit;color:var(--ink);background:var(--signal);border:0;padding:9px 14px;letter-spacing:.1em;text-transform:uppercase;}
</style>
</head>
<body>
<div class="probe"><i class="p100vh"></i><i class="p100svh"></i><i class="p100lvh"></i><i class="p100dvh"></i><i class="pTop"></i><i class="pBot"></i></div>
<div id="app">
  <header><b>NW rotation probe</b> &nbsp;<span id="mode"></span></header>
  <main>
    <p class="note">Rotate to landscape, then back to portrait. Each state is captured
    automatically. Screenshot this page once all three columns are filled.
    <b>P0</b> is portrait at load, <b>L</b> landscape, <b>P1</b> portrait after coming back.
    A row is marked red when P1 differs from P0.</p>
    <div id="out"></div>
    <button id="reset">Clear and start again</button>
  </main>
  <div id="tabs">tab bar</div>
</div>
<script>
(function(){
  var ROWS = [
    ["standalone",   function(){ return matchMedia("(display-mode: standalone)").matches ? 1 : 0; }],
    ["screen.w",     function(){ return screen.width; }],
    ["screen.h",     function(){ return screen.height; }],
    ["inner.w",      function(){ return innerWidth; }],
    ["inner.h",      function(){ return innerHeight; }],
    ["visualVP.h",   function(){ return visualViewport ? Math.round(visualViewport.height) : -1; }],
    ["visualVP.top", function(){ return visualViewport ? Math.round(visualViewport.offsetTop) : -1; }],
    ["docEl.client.h", function(){ return document.documentElement.clientHeight; }],
    ["100vh",        function(){ return px(".p100vh"); }],
    ["100svh",       function(){ return px(".p100svh"); }],
    ["100lvh",       function(){ return px(".p100lvh"); }],
    ["100dvh",       function(){ return px(".p100dvh"); }],
    ["safe top",     function(){ return px(".pTop"); }],
    ["safe bottom",  function(){ return px(".pBot"); }],
    ["#app top",     function(){ return rect("#app").top; }],
    ["#app height",  function(){ return rect("#app").height; }],
    ["header top",   function(){ return rect("header").top; }],
    ["header height",function(){ return rect("header").height; }],
    ["tabs top",     function(){ return rect("#tabs").top; }],
    ["tabs bottom",  function(){ return rect("#tabs").bottom; }],
    ["doc scrollTop",function(){ var d = document.scrollingElement || document.documentElement; return d ? d.scrollTop : -1; }],
    ["#app scrollTop",function(){ return document.getElementById("app").scrollTop; }],
    ["body scrollTop",function(){ return document.body.scrollTop; }]
  ];
  function px(sel){ var e = document.querySelector(sel); return e ? Math.round(e.getBoundingClientRect().height) : -1; }
  function rect(sel){
    var r = document.querySelector(sel).getBoundingClientRect();
    return {top: Math.round(r.top), height: Math.round(r.height), bottom: Math.round(r.bottom)};
  }
  function snap(){
    var o = {};
    ROWS.forEach(function(r){ try{ o[r[0]] = r[1](); }catch(e){ o[r[0]] = "ERR"; } });
    o["__when"] = new Date().toLocaleTimeString();
    return o;
  }
  var state = {P0:null, L:null, P1:null};
  try{ state = JSON.parse(sessionStorage.getItem("nwrot")) || state; }catch(e){}
  function save(){ try{ sessionStorage.setItem("nwrot", JSON.stringify(state)); }catch(e){} }
  function portrait(){ return innerHeight >= innerWidth; }
  function capture(){
    var s = snap();
    if(!state.P0){ state.P0 = s; }
    else if(!portrait()){ state.L = s; }
    else if(state.L){ state.P1 = s; }
    else { state.P0 = s; }
    save(); draw();
  }
  function draw(){
    document.getElementById("mode").textContent =
      (matchMedia("(display-mode: standalone)").matches ? "installed" : "in a browser tab") +
      " · " + (portrait() ? "portrait" : "landscape");
    var h = '<h2>readings</h2><table><tr><th>&nbsp;</th><th>P0</th><th>L</th><th>P1</th></tr>';
    ROWS.forEach(function(r){
      var k = r[0], a = state.P0 ? state.P0[k] : "", b = state.L ? state.L[k] : "",
          c = state.P1 ? state.P1[k] : "";
      var cls = (state.P1 && state.P0 && c !== a) ? "n bad" : "n";
      h += '<tr><th>' + k + '</th><td class="n">' + fmt(a) + '</td><td class="n">' +
           fmt(b) + '</td><td class="' + cls + '">' + fmt(c) + '</td></tr>';
    });
    h += '</table>';
    if(state.P1 && state.P0){
      var drift = ROWS.filter(function(r){ return state.P1[r[0]] !== state.P0[r[0]]; })
                      .map(function(r){ return r[0]; });
      h += '<h2>verdict</h2><p class="note">' + (drift.length
        ? 'After coming back to portrait, <b>' + drift.length + '</b> reading(s) differ from the start: <b>' +
          drift.join(", ") + '</b>.'
        : 'Every reading came back to its starting value.') + '</p>';
    }
    document.getElementById("out").innerHTML = h;
  }
  function fmt(v){ return (v === "" || v === undefined || v === null) ? "·" : String(v); }
  document.getElementById("reset").addEventListener("click", function(){
    state = {P0:null, L:null, P1:null}; save(); capture();
  });
  addEventListener("orientationchange", function(){ setTimeout(capture, 320); setTimeout(capture, 1000); });
  if(visualViewport) visualViewport.addEventListener("resize", function(){ setTimeout(capture, 320); });
  addEventListener("resize", function(){ setTimeout(capture, 320); });
  setTimeout(capture, 250);
  draw();
})();
</script>
</body>
</html>
