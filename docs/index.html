<!-- Fonts: Limelight & Anton via Google Fonts, both SIL Open Font License (free for any use).
     Palette: original hex values styled after the classic black / blue-grey / belt-yellow scheme.
     No trademarked logos, symbols, or proprietary lettering are used anywhere in this file.
     The favicon is an original bat-animal silhouette drawn for this project; it is not a DC mark. -->
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Canon skin: Dark Deco. Single source of truth. Themes are [data-theme]
     blocks overriding surfaces only; guards measure the contrast of each. */
  --ink:#08090F; --sunk:#0C111C; --card:#141B2C; --card2:#1B2438;
  --line:#252E42; --line2:#33405C;
  --bone:#E7E9F0; --dust:#93A0B8; --dim:#78849E;
  --signal:#FFCF1F;      /* utility-belt yellow */
  --steel:#5B84C4;       /* cape blue-grey */
  --crimson:#C43A30;     /* animated-sky red, AA-adjusted */
  --moss:#7FA98B;        /* interactive badge */
  --deco:"Limelight","Big Shoulders Display",serif;
  --disp:"Anton","Haettenschweiler","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --hdr:rgba(10,12,17,.9);
  --tabbg:rgba(14,17,25,.94);
  --tab-h:58px;
}
/* AMOLED variant. Surfaces only, so contrast can only rise from here. */
:root[data-theme="darker"]{
  --ink:#000000; --sunk:#05070C; --card:#0B101B; --card2:#111826;
  --line:#1B2233; --line2:#2C3853;
  --hdr:rgba(0,0,0,.92);
  --tabbg:rgba(4,6,10,.95);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--ink);color:var(--bone);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior:none;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:4px;}

#app{display:flex;flex-direction:column;min-height:100%;}
header{position:sticky;top:0;z-index:30;background:var(--hdr);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;}
.hrow{display:flex;align-items:center;gap:14px;max-width:760px;margin:0 auto;}
/* A blocked store used to fail silently. Signal, not crimson: crimson on
   --sunk is 3.59:1 and would fail AA inside the accessibility warning. */
#nosave{max-width:760px;margin:11px auto 0;padding:8px 12px;border:1px solid var(--signal);border-radius:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;line-height:1.55;color:var(--signal);text-align:center;}
#nosave[hidden]{display:none;}
.mark{width:46px;flex:none;padding:0;color:var(--signal);display:flex;justify-content:center;align-items:center;}
.mark svg{display:block;width:32px;height:auto;}
.mark:active{opacity:.7;}
.wordmark{flex:1;min-width:0;text-align:center;}
.wordmark h1{font-family:var(--deco);font-weight:400;letter-spacing:.02em;text-transform:uppercase;font-size:21px;line-height:.95;margin:0;}
.wordmark h1 button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;}
.wordmark p{font-family:var(--mono);font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);margin:4px 0 0;}
.ring{width:46px;height:46px;flex:none;position:relative;padding:0;border:0;background:none;cursor:pointer;}
.ring:active{opacity:.7;}
.pies{display:flex;gap:10px;margin-bottom:18px;}
.pie{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--sunk);padding:13px 8px 11px;}
.pietitle{font-family:var(--mono);font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dust);margin:0 0 9px;text-align:center;}
.pie svg{width:100%;max-width:148px;height:auto;display:block;margin:0 auto;}
.pie svg g[data-seg]{cursor:pointer;}
.piesub{font-family:var(--mono);font-size:8.5px;color:var(--dim);margin:9px 0 0;letter-spacing:.05em;text-align:center;line-height:1.5;}
.pcent{font-family:var(--disp);font-size:19px;fill:var(--bone);}
.plab{font-family:var(--mono);font-size:6px;fill:var(--dim);letter-spacing:.14em;}
.ring svg{transform:rotate(-90deg);display:block;}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:600;}
main{flex:1;padding:18px 18px calc(var(--tab-h) + env(safe-area-inset-bottom) + 28px);max-width:760px;margin:0 auto;width:100%;}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--tabbg);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
#tabs button{flex:1;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);transition:color .15s;}
/* Fixed box, fixed grid: every icon occupies exactly 20x20 regardless of the
   shape inside it, so all four labels and all four icons share one baseline. */
#tabs button svg{display:block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;}
#tabs button[aria-current]{color:var(--signal);}

.pathcard{border:1px solid var(--line);border-radius:16px;background:linear-gradient(175deg,var(--card2),var(--card) 60%);padding:16px 18px 18px;margin-bottom:20px;}
.pathtop{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
.pathkick{font-family:var(--mono);font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--signal);margin:0;}
.pathchg{font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--steel);text-transform:uppercase;}
.pathname{font-family:var(--deco);font-weight:400;letter-spacing:.02em;text-transform:uppercase;font-size:clamp(21px,5.4vw,29px);line-height:1;margin:9px 0 0;}
.pathrow{display:flex;align-items:center;gap:13px;margin-top:14px;}
.pathrow b{font-family:var(--disp);font-size:22px;line-height:1;display:block;}
.pathrow span{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--dust);text-transform:uppercase;display:block;margin-top:4px;}
.pathring{flex:none;}
.pathring circle{fill:none;stroke-width:4;}
.chooser{margin-bottom:22px;}
.pick{display:block;width:100%;text-align:left;border:1px solid var(--line2);border-radius:12px;background:var(--card);padding:14px 16px;margin-bottom:10px;min-height:44px;}
.pick b{font-family:var(--disp);font-weight:400;letter-spacing:.025em;text-transform:uppercase;font-size:19px;line-height:1.05;display:block;}
.pick span{display:block;font-size:13.5px;color:var(--dust);margin-top:6px;line-height:1.45;}
.picknote{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--dim);margin:2px 0 0;line-height:1.6;}
.viewing{border:1px solid var(--steel);border-radius:10px;padding:10px 13px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.viewing p{margin:0;flex:1;min-width:150px;font-size:13px;color:var(--dust);line-height:1.4;}
.viewing button{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);background:var(--signal);border-radius:8px;padding:9px 12px;min-height:40px;font-weight:600;}
.viewing button.ghost{background:none;color:var(--steel);border:1px solid var(--line2);font-weight:400;}
/* The only preference. No heading, no card, last row on the last screen. */
.prefrow{margin:26px 0 0;}
.pathtitle{font-family:var(--deco);font-weight:400;letter-spacing:.02em;text-transform:uppercase;font-size:clamp(20px,5.2vw,27px);line-height:1;margin:0 0 10px;}
.modes{display:flex;gap:0;border:1px solid var(--line2);border-radius:10px;overflow:hidden;margin-bottom:10px;}
.modes button{flex:1;padding:11px 6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dust);border-right:1px solid var(--line2);min-height:42px;}
.modes button:last-child{border-right:0;}
.modes button[aria-pressed="true"]{background:var(--bone);color:var(--ink);font-weight:600;}
.modenote{font-size:12.5px;color:var(--dim);margin:0 0 14px;line-height:1.45;}

.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.allrow{display:flex;justify-content:flex-end;margin:-4px 0 12px;}
.allbtn{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:9px 13px;border:1px solid var(--line2);border-radius:100px;color:var(--dust);min-height:34px;white-space:nowrap;}
.allbtn:active{background:var(--card2);}
.chip{flex:none;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:9px 13px;border:1px solid var(--line2);border-radius:100px;color:var(--dust);min-height:34px;white-space:nowrap;}
.chip[aria-pressed="true"]{background:var(--bone);color:var(--ink);border-color:var(--bone);font-weight:600;}
.search{width:100%;background:var(--card);border:1px solid var(--line);color:var(--bone);border-radius:10px;padding:12px 14px;font-family:var(--body);font-size:15px;margin-bottom:12px;-webkit-appearance:none;appearance:none;}
.search::placeholder{color:var(--dim);}

.group{margin:0 0 14px;border:1px solid var(--line);border-radius:14px;background:var(--sunk);}
.ghwrap{margin:0;font:inherit;border-radius:inherit;
  position:sticky;top:calc(env(safe-area-inset-top) + 70px);z-index:2;}
.ghead{display:flex;align-items:center;gap:12px;width:100%;padding:15px;text-align:left;min-height:56px;
  background:var(--sunk);border-radius:inherit;}
.group.open .ghead{border-radius:13px 13px 0 0;box-shadow:0 1px 0 var(--line);}
.gnum{font-family:var(--mono);font-size:10px;color:var(--signal);border:1px solid rgba(255,207,31,.4);border-radius:5px;padding:4px 6px;flex:none;}
.gname{flex:1;min-width:0;}
.gname .gtitle{display:block;font-family:var(--deco);font-weight:400;letter-spacing:.02em;text-transform:uppercase;font-size:17px;line-height:1.02;margin:0;}
.gname .meta{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--dim);margin-top:4px;text-transform:uppercase;display:block;}
.gbar{height:3px;border-radius:2px;background:var(--line2);margin-top:7px;overflow:hidden;display:block;}
.gbar i{display:block;height:100%;background:var(--signal);transition:width .3s;}
.caret{font-size:13px;color:var(--dim);flex:none;transition:transform .2s;}
.group.open .caret{transform:rotate(90deg);}
.gbody{display:none;padding:0 15px 6px;}
.group.open .gbody{display:block;}
.gnote{font-size:13.5px;color:var(--dust);margin:0 0 10px;line-height:1.45;}

.film{border-top:1px solid var(--line);}
.frow{display:flex;align-items:flex-start;gap:12px;padding:12px 0;}
.tick{width:30px;height:30px;flex:none;margin-top:1px;border-radius:50%;border:1.5px solid var(--dim);display:grid;place-items:center;font-size:13px;color:transparent;transition:.18s;}
.tick::after{content:"\2713";font-weight:700;}
.film.done .tick{background:var(--bone);border-color:var(--bone);color:var(--ink);}
.film.skip .tick{border-color:var(--line2);color:var(--dim);}
.film.skip .tick::after{content:"\2013";}
.fmain{flex:1;min-width:0;text-align:left;padding:2px 0;}
.ftitle{display:block;font-family:var(--disp);font-weight:400;letter-spacing:.025em;text-transform:uppercase;font-size:17.5px;line-height:1.06;margin:0;}
.fmeta{display:block;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:5px;letter-spacing:.05em;}
.film.done .ftitle{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--line2);}
.film.skip .ftitle{color:var(--dim);}
.badges{display:inline-flex;gap:5px;margin-left:7px;vertical-align:2px;flex-wrap:wrap;}
.bd{font-family:var(--mono);font-size:8px;letter-spacing:.12em;padding:2px 5px;border-radius:3px;border:1px solid currentColor;font-weight:600;}
.bd.e{color:var(--signal);} .bd.m{color:var(--crimson);} .bd.u{color:var(--steel);}
.bd.o{color:var(--dim);} .bd.c{color:var(--moss);} .bd.s{color:var(--dim);} .bd.k{color:var(--dust);}
.fdetail{display:none;padding:0 0 14px 42px;}
.film.open .fdetail{display:block;}
.fdetail p{font-size:14px;color:var(--dust);margin:0 0 12px;line-height:1.5;}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.act{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;color:var(--dust);min-height:38px;}
.act.primary{background:var(--bone);color:var(--ink);border-color:var(--bone);font-weight:600;}
/* 36x44 target. Width carries the gap so neighbours tile rather than
   overlap; height comes from the pseudo-element so rows do not grow. */
.stars{display:flex;gap:0;margin-left:auto;}
.stars button{position:relative;width:36px;height:34px;font-size:16px;color:var(--line2);}
.stars button::before{content:"";position:absolute;left:0;right:0;top:50%;height:44px;transform:translateY(-50%);}
.stars button.on{color:var(--signal);}
.lnk{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;color:var(--steel);min-height:38px;display:inline-flex;align-items:center;text-decoration:none;}
.lnk:active{background:var(--card2);}
.linkrow{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:10px;}

.hero{border:1px solid var(--line);border-radius:16px;background:linear-gradient(175deg,var(--card2),var(--card) 60%);padding:22px 20px 20px;}
.hero .kick{font-family:var(--mono);font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--signal);margin:0 0 12px;}
/* ONE hero size. Home and Next up render the same title; inline overrides
   grew it by 15% on one of them. Change it here, not at the call site. */
.hero h2{font-family:var(--deco);font-weight:400;letter-spacing:.02em;text-transform:uppercase;font-size:clamp(24px,6.5vw,36px);line-height:.94;margin:0;}
.hero .yr{font-family:var(--mono);font-size:12px;color:var(--dust);margin:10px 0 0;letter-spacing:.06em;}
.hero .blurb{font-size:15px;color:var(--dust);margin:16px 0 0;line-height:1.5;}
.heroacts{display:flex;gap:9px;margin-top:20px;}
.heroacts button{flex:1;min-height:50px;border-radius:11px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;}
.heroacts .go{background:var(--bone);color:var(--ink);}
.heroacts .no{border:1px solid var(--line2);color:var(--dust);flex:0 0 38%;}
.queue{margin-top:26px;}
.qhead{font-family:var(--mono);font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);margin:0 0 12px;}
.qitem{display:flex;gap:12px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line);}
/* Activity is history, not queue. It is a bordered surface with taller rows so
   it does not read as another step in the list above it. */
.activity{margin-top:26px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:4px 16px 8px;}
.activity .qhead{margin:14px 0 2px;}
.arow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:13px 0;border-top:1px solid var(--line);}
.arow:first-of-type{border-top:0;}
.arow .at{flex:1;min-width:130px;font-size:14px;color:var(--bone);line-height:1.35;}
.arow .ad{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);}
.arow .stars{margin-left:auto;}
.qn{font-family:var(--mono);font-size:10px;color:var(--dim);flex:none;width:18px;}
.qt{font-family:var(--disp);font-weight:400;letter-spacing:.025em;text-transform:uppercase;font-size:15px;line-height:1.1;flex:1;color:var(--dust);}
.qy{font-family:var(--mono);font-size:10px;color:var(--dim);flex:none;}

.bigstat{display:flex;gap:10px;margin-bottom:20px;}
.bigstat div{flex:1;border:1px solid var(--line);border-radius:12px;padding:15px 13px;background:var(--sunk);}
.bigstat b{display:block;font-family:var(--disp);font-weight:400;letter-spacing:.025em;font-size:32px;line-height:1;}
.bigstat span{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:block;margin-top:7px;}
.srow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);}
.srow .sn{flex:1;font-family:var(--disp);font-weight:400;letter-spacing:.025em;text-transform:uppercase;font-size:15px;line-height:1.1;min-width:0;}
.srow .sb{flex:0 0 80px;height:5px;border-radius:3px;background:var(--line2);overflow:hidden;}
.srow .sb i{display:block;height:100%;background:var(--signal);transition:width .3s;}
.srow .sc{font-family:var(--mono);font-size:10px;color:var(--dim);flex:none;width:42px;text-align:right;}
.danger{margin-top:28px;width:100%;border:1px solid rgba(176,58,58,.5);color:var(--crimson);border-radius:10px;padding:14px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;min-height:46px;}
.note{font-size:12.5px;color:var(--dim);margin-top:16px;line-height:1.5;}
.empty{text-align:center;padding:60px 20px;color:var(--dim);}
.empty .big{font-family:var(--deco);font-weight:400;letter-spacing:.02em;text-transform:uppercase;font-size:26px;color:var(--dust);margin-bottom:8px;}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:4px 0 18px;}
.legend span{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);}
.legend i{font-style:normal;font-weight:600;}
.ugrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.ucard{border:1px solid var(--line);border-radius:12px;background:var(--sunk);padding:13px 12px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:98px;}
.ucard:active{background:var(--card);}
.ucard.full{border-color:rgba(255,207,31,.55);}
.unum{font-family:var(--mono);font-size:9.5px;color:var(--signal);letter-spacing:.08em;}
.ucard.full .unum::after{content:" \2713";}
.uname{font-family:var(--disp);font-weight:400;letter-spacing:.025em;text-transform:uppercase;font-size:14.5px;line-height:1.05;flex:1;}
.ubar{height:3px;border-radius:2px;background:var(--line2);overflow:hidden;}
.ubar i{display:block;height:100%;background:var(--signal);}
.ucount{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:.08em;}
.scope{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden;margin:16px 0 0;}
.scope button{flex:1;padding:12px 6px;font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--dust);border-right:1px solid var(--line2);min-height:44px;}
.scope button:last-child{border-right:0;}
.scope button[aria-pressed="true"]{background:var(--bone);color:var(--ink);font-weight:600;}
.scopenote{font-size:12px;color:var(--dim);margin:9px 2px 0;line-height:1.5;}
.bk{margin-top:26px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);padding:16px 15px;}
.bk h3{font-family:var(--mono);font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--signal);margin:0 0 10px;font-weight:600;}
.bk p{font-size:13px;color:var(--dust);margin:0 0 13px;line-height:1.5;}
.bk .warn{color:var(--dim);font-size:12px;}
.bkbtns{display:flex;flex-wrap:wrap;gap:8px;}
.bkbtn{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;border:1px solid var(--line2);border-radius:9px;padding:12px 14px;color:var(--dust);min-height:44px;flex:1;}
.bkbtn.primary{background:var(--bone);color:var(--ink);border-color:var(--bone);font-weight:600;}
.code{width:100%;background:var(--ink);border:1px solid var(--line2);border-radius:8px;color:var(--bone);
  font-family:var(--mono);font-size:11px;line-height:1.6;padding:11px;margin:12px 0 10px;
  word-break:break-all;max-height:96px;overflow:auto;-webkit-user-select:all;user-select:all;resize:none;}
.bkin{width:100%;background:var(--ink);border:1px solid var(--line2);border-radius:8px;color:var(--bone);
  font-family:var(--mono);font-size:11px;padding:11px;margin:0 0 9px;min-height:62px;resize:vertical;-webkit-appearance:none;}
.bkhr{border:0;border-top:1px solid var(--line);margin:18px 0;}
.tiers{margin:14px 0 22px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);overflow:hidden;}
.trow{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;min-height:52px;text-align:left;border-top:1px solid var(--line);}
.trow:first-child{border-top:0;}
.trow:active{background:var(--card);}
.tlab{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;flex:0 0 86px;}
.tbar{flex:1;height:6px;border-radius:3px;background:var(--line2);overflow:hidden;}
.tbar i{display:block;height:100%;}
.tcount{font-family:var(--mono);font-size:10px;color:var(--dim);flex:none;width:48px;text-align:right;}
.tchev{color:var(--dim);font-size:12px;flex:none;}
.segs{display:flex;gap:3px;flex:1;}
.segs i{flex:1;height:8px;border-radius:2px;background:var(--line2);}
.segs i.on{background:var(--signal);}
.toast{position:fixed;left:50%;transform:translate(-50%,80px);bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px);background:var(--bone);color:var(--ink);border-radius:100px;padding:11px 20px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;z-index:60;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;}
.toast.show{opacity:1;transform:translate(-50%,0);}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}

/* Canon skin: Dark Deco. ADDITIVE only — restating a token here leaves its
   real value 180 lines from its declaration. */
::selection{background:var(--signal);color:var(--ink);}
/* Reserves the scrollbar width even with nothing to scroll. Without it Next
   up, the one view that fits a desktop screen, slides the centred column
   7.5px sideways. Overlay scrollbars have no gutter, so mobile is unaffected. */
html{scrollbar-color:var(--line2) transparent;scrollbar-gutter:stable;}
.intro{border:1px solid var(--line);border-left:3px solid var(--signal);border-radius:12px;background:var(--sunk);padding:18px 18px 16px;margin-bottom:16px;}
.ikick{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--signal);margin:0 0 10px;}
.ititle{font-family:var(--deco);font-weight:400;text-transform:uppercase;font-size:clamp(21px,5.5vw,28px);line-height:1.05;margin:0 0 10px;letter-spacing:.02em;}
.ibody{font-size:14.5px;color:var(--dust);line-height:1.55;margin:0 0 14px;}
.istats{display:flex;gap:18px;padding-top:12px;border-top:1px solid var(--line);font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);flex-wrap:wrap;}
.istats b{color:var(--bone);font-weight:600;margin-right:4px;}
.homefoot{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:center;margin:30px 0 4px;line-height:1.8;}
/* Reads the same tokens as every other track (.gbar / .ubar / .tbar / .segs). */
#ringTrack{stroke:var(--line2);}
#ringArc{stroke:var(--signal);}

</style>
</head>

<script>
"use strict";

/* e = story era for the composite timeline. 0 = no place in one Bruce's life. */
var PATH = [
{n:"01",name:"DC Animated Universe",
 note:"Bruce Timm's world, Kevin Conroy's voice \u2014 the foundation everything after gets measured against. The full weave: run The Animated Series, dropping Mask of the Phantasm in around season two and SubZero after it. Then The New Batman Adventures, detouring into Superman's 'World\u2019s Finest' and 'Knight Time', and finishing with Mystery of the Batwoman and Chase Me. Justice League and Unlimited follow \u2014 but JLU's 'Epilogue' spoils Batman Beyond, so save Beyond, Zeta and Return of the Joker for the very end.",
 films:[
 {i:"batman-the-animated-series-season-1-1992",t:"Batman: The Animated Series",sub:"Season 1",y:1992,ep:65,k:"tv",e:3,d:"Where all of it starts. Sixty-five episodes of Dark Deco noir that redefined the character for a generation, invented Harley Quinn and rewrote Mr. Freeze.",b:["e"],o:1},
 {i:"batman-the-animated-series-season-2-1994",t:"Batman: The Animated Series",sub:"Season 2",y:1994,ep:20,k:"tv",e:3,d:"The back half, running to 1995. Fewer episodes, but it holds some of the sharpest writing of the run.",o:1},
 {i:"batman-mask-of-the-phantasm-1993",t:"Batman: Mask of the Phantasm",y:1993,e:2,d:"The best place to begin. A mob hit, a masked killer, and the love that nearly stopped Bruce becoming Batman.",b:["e"]},
 {i:"batman-mr-freeze-subzero-1998",t:"Batman & Mr. Freeze: SubZero",y:1998,e:3,d:"Quieter and warmer. Freeze at his most sympathetic, chasing a cure rather than a grudge."},
 {i:"superman-the-animated-series-season-1-1996",t:"Superman: The Animated Series",sub:"Season 1",y:1996,ep:13,k:"tv",e:7,d:"No Batman yet, but this is the show that turns the DCAU into a shared universe.",o:1},
 {i:"superman-the-animated-series-season-2-1997",t:"Superman: The Animated Series",sub:"Season 2",y:1997,ep:28,k:"tv",e:7,d:"Contains the 'World's Finest' three-parter, the first Batman crossover.",o:1},
 {i:"the-batman-superman-movie-world-s-finest-1997",t:"The Batman Superman Movie: World's Finest",y:1997,e:7,d:"The 'World's Finest' three-parter cut into a feature. Batman and Superman meet for the first time while Joker and Luthor team up.",b:["s"],o:1},
 {i:"the-new-batman-adventures-season-1-1997",t:"The New Batman Adventures",sub:"Season 1",y:1997,ep:13,k:"tv",e:5,d:"Redesigned, sharper, and more interested in the wider Bat-family. Tim Drake is Robin, Dick is Nightwing.",o:1},
 {i:"the-new-batman-adventures-season-2-1998",t:"The New Batman Adventures",sub:"Season 2",y:1998,ep:11,k:"tv",e:5,d:"Includes 'Mad Love', the Harley Quinn origin that won an Emmy.",b:["e"],o:1},
 {i:"superman-the-animated-series-season-3-1999",t:"Superman: The Animated Series",sub:"Season 3",y:1999,ep:13,k:"tv",e:7,d:"Includes 'Knight Time', in which Superman impersonates a missing Batman, and 'The Demon Reborn'.",o:1},
 {i:"batman-mystery-of-the-batwoman-2003",t:"Batman: Mystery of the Batwoman",y:2003,e:5,d:"Late-era TAS. A straight whodunit \u2014 three suspects, one new mask in Gotham."},
 {i:"chase-me-2003",t:"Chase Me",y:2003,e:3,d:"A wordless seven-minute Batman and Catwoman chase, scored like a jazz number. Packaged with Mystery of the Batwoman.",b:["s"],o:1},
 {i:"static-shock-seasons-1-4-2000",t:"Static Shock",sub:"Seasons 1\u20134",y:2000,ep:52,k:"tv",e:7,d:"Virgil Hawkins in Dakota. Three episodes cross into Batman's world: 'The Big Leagues', 'Hard as Nails' and 'Future Shock'.",o:1},
 {i:"justice-league-season-1-2001",t:"Justice League",sub:"Season 1",y:2001,ep:26,k:"tv",e:7,d:"The seven founders. Batman as the one without powers, and the one everyone quietly defers to.",b:["e"],o:1},
 {i:"justice-league-season-2-2003",t:"Justice League",sub:"Season 2",y:2003,ep:26,k:"tv",e:7,d:"Includes 'A Better World' and the 'Starcrossed' finale that breaks and remakes the team.",o:1},
 {i:"justice-league-unlimited-season-1-2004",t:"Justice League Unlimited",sub:"Season 1",y:2004,ep:13,k:"tv",e:7,d:"The roster explodes to dozens of heroes. Batman anchors the Cadmus arc.",o:1},
 {i:"justice-league-unlimited-season-2-2005",t:"Justice League Unlimited",sub:"Season 2",y:2005,ep:13,k:"tv",e:7,d:"The Cadmus conspiracy pays off, and Batman's paranoia turns out to be justified.",o:1},
 {i:"justice-league-unlimited-season-3-2006",t:"Justice League Unlimited",sub:"Season 3",y:2006,ep:13,k:"tv",e:7,d:"The end of the DCAU. 'Epilogue' lives here and it spoils Batman Beyond \u2014 so take Beyond after this.",b:["e"],o:1},
 {i:"batman-and-harley-quinn-2017",t:"Batman and Harley Quinn",y:2017,e:5,d:"A loose comic reunion made years later. Same world, much lighter touch."},
 {i:"batman-beyond-the-movie-1999",t:"Batman Beyond: The Movie",y:1999,e:10,d:"The Beyond pilot cut together as a feature. Bruce is old, Terry takes the suit. Really two episodes, but it shipped as a film.",b:["s"],o:1},
 {i:"batman-beyond-season-1-1999",t:"Batman Beyond",sub:"Season 1",y:1999,ep:13,k:"tv",e:10,d:"Fifty years on. Terry McGinnis takes the suit from an old, bitter Bruce who never learned to stop.",b:["e"],o:1},
 {i:"batman-beyond-season-2-2000",t:"Batman Beyond",sub:"Season 2",y:2000,ep:26,k:"tv",e:10,d:"The strongest run \u2014 Ten, Curare, Inque and the Royal Flush Gang.",o:1},
 {i:"batman-beyond-season-3-2000",t:"Batman Beyond",sub:"Season 3",y:2000,ep:13,k:"tv",e:10,d:"The last stretch, running into 2001.",o:1},
 {i:"the-zeta-project-seasons-1-2-2001",t:"The Zeta Project",sub:"Seasons 1\u20132",y:2001,ep:26,k:"tv",e:10,d:"A Beyond spin-off about a runaway infiltration android. Batman appears sparingly.",o:1},
 {i:"batman-beyond-return-of-the-joker-2000",t:"Batman Beyond: Return of the Joker",y:2000,e:10,d:"Fifty years on, Terry McGinnis in the suit. Find the uncut version \u2014 the theatrical edit was censored. This is the end of Bruce's story.",b:["e"]}
 ]},

{n:"02",name:"The Comic Canon",
 note:"Unconnected films that happen to line up into one whole life. Nobody planned this arc, but in this order it runs from Bruce's first night on the roof to his last stand at fifty-five.",

{n:"03",name:"Superman / Batman",

 films:[

 {i:"superman-batman-apocalypse-2010",t:"Superman/Batman: Apocalypse",y:2010,e:7,d:"Supergirl arrives on Earth and Darkseid wants her. Batman plays the sceptic."}]},

{n:"04",name:"Justice League One-Offs",
 note:"Standalone League films where Batman is a lead rather than a guest. Doom in particular is a Batman story wearing a Justice League jacket \u2014 the plot is his own contingency plans turned against the team.",
 films:[
 {i:"justice-league-the-new-frontier-2008",t:"Justice League: The New Frontier",y:2008,e:7,d:"Darwyn Cooke's 1950s DC. Batman starts as a paranoid urban legend and grows into something else. Jeremy Sisto in the cowl."},
 {i:"justice-league-crisis-on-two-earths-2010",t:"Justice League: Crisis on Two Earths",y:2010,e:7,d:"A parallel Earth where the League are criminals. The villain is Owlman \u2014 Batman's counterpart, and the best thing in it."},

{n:"07",name:"Knightfall Trilogy",

 continuity:"Grouped by universe, each in its own story order. The safest way through \u2014 nothing spoils anything ahead of it.",
 life:"One composite life, stitched from every continuity. These are different Bruces from different realities, so this is an interpretation, not a canon \u2014 but it is as chronological as the material allows. Films with no place in a single lifetime are collected at the end.",
 release:"Straight release order, {span}. The only ordering that is objectively complete \u2014 it just jumps between universes constantly."
};

/* IDs in i:"..." are FROZEN. Titles are display text — rename freely. Adding
   is safe; changing or removing an i breaks saved progress for real people. */
function idHash(id){
  var h = 2166136261, i;
  for(i = 0; i < id.length; i++){ h ^= id.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ("0000" + (h >>> 0).toString(36)).slice(-5);
}

var FILMS = [];
PATH.forEach(function(g, gi){
  g.films.forEach(function(f, fx){
    FILMS.push({id:f.i, gi:gi, ix:fx, gn:g.n, gname:g.name,
                t:f.t, sub:f.sub||"", ep:f.ep||0, tv:(f.k==="tv"),
                y:f.y, d:f.d, e:(f.e||0), b:f.b||[], o:!!f.o});
  });
});

/* path is the locked choice, mode is what is on screen. Only path is
   persisted — that is what makes a shared deep link a view, not a takeover. */
var S = {tab:"home", scope:"movies", path:"", mode:"continuity", filter:"all", q:"", code:"",
         theme:"dark", watched:{}, skipped:{}, rated:{}, open:{}, groupOpen:{}, log:[]};
var PATHS = [["continuity","By universe"], ["life","Bruce\u2019s life"], ["release","Release order"]];
var PATHBLURB = {
  continuity:"Each continuity intact, in its own story order. The safest first watch \u2014 nothing spoils anything ahead of it.",
  life:"One composite lifetime stitched across every continuity, from before the cowl to Beyond. An interpretation, not a canon.",
  release:"Straight release order, 1968 to 2028. The only ordering that is objectively complete \u2014 it just jumps between universes."
};
var PATHCODE = {continuity:"c", life:"l", release:"r"};
var CODEPATH = {c:"continuity", l:"life", r:"release"};
function isPath(id){ return !!PATHCODE[id]; }
function pathName(id){
  for(var i = 0; i < PATHS.length; i++){ if(PATHS[i][0] === id) return PATHS[i][1]; }
  return "";
}
/* Semver, mapping 1:1 onto CHANGELOG.md. Bump for every shipped change; sw.js
   VERSION and the changelog must agree or guards fail the build. KEY is
   separate: bump it ONLY for a breaking storage shape. */
var BUILD = "1.3.5";
var KEY = "batwatch-v3";
var SITE = "https://6ummy-dev.github.io/Night-Watcher/";
var canSave = true;

/* On file:// location.origin is the string "null". Fall back to the published
   copy — the link exists to reach a different device either way. */
function restoreLink(code){
  var http = (location.protocol === "http:" || location.protocol === "https:");
  return (http ? location.origin + location.pathname : SITE) + "#nw=" + code;
}

/* Storage adapter: window.storage inside Claude artifacts; localStorage on the
   open web (GitHub Pages etc.); memory-only if neither is available. */
var store = (function(){
  if (typeof window.storage === "object" && window.storage &&
      typeof window.storage.get === "function") {
    return {
      get: function(k){
        return Promise.resolve(window.storage.get(k)).then(function(r){ return r ? r.value : null; });
      },
      set: function(k, v){ return Promise.resolve(window.storage.set(k, v)); }
    };
  }
  try {
    var t = "__nw_probe__";
    window.localStorage.setItem(t, "1");
    window.localStorage.removeItem(t);
    return {
      get: function(k){ return Promise.resolve(window.localStorage.getItem(k)); },
      set: function(k, v){ window.localStorage.setItem(k, v); return Promise.resolve(); }
    };
  } catch(e){ return null; }
})();
if(!store) canSave = false;

function flagSave(){
  var el = document.getElementById("nosave");
  if(el) el.hidden = canSave;
}
/* CSS cannot reach the system status bar; the meta tag has to follow. */
var THEMEBAR = {dark:"#0C111C", darker:"#000000"};
function applyTheme(){
  document.documentElement.setAttribute("data-theme", S.theme);
  var m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", THEMEBAR[S.theme] || THEMEBAR.dark);
}
/* One entry per id, earliest timestamp wins \u2014 that is when it was actually
   watched. Enforced where saved data is read rather than where it is written,
   because a payload can also arrive hand-edited or from a build that is not
   this one. Ratings are not reconciled here: they live in S.rated keyed by id,
   so there is only ever one. */
function dedupeLog(log){
  var seen = Object.create(null), out = [];
  log.forEach(function(e){
    if(!e || !e.id) return;
    var prev = seen[e.id];
    if(prev){ if(e.ts < prev.ts) prev.ts = e.ts; return; }
    seen[e.id] = e; out.push(e);
  });
  return out;
}
function persist(){
  if(!canSave || !store) return;
  /* mode mirrors path, for a 1.1.0 downgrade. Never S.mode: with no path
     chosen that wrote a real ordering, which the next load adopted as one. */
  var payload = JSON.stringify({watched:S.watched, skipped:S.skipped, rated:S.rated,
                                path:S.path, mode:S.path, theme:S.theme,
                                scope:S.scope, log:S.log, groupOpen:S.groupOpen});
  try{
    var p = store.set(KEY, payload);
    if(p && p.catch) p.catch(function(){ canSave = false; flagSave(); });
  }catch(e){ canSave = false; flagSave(); }
}
function restore(done){
  var finish = function(raw){
    if(raw){
      try{
        var o = JSON.parse(raw);
        S.watched = o.watched || {}; S.skipped = o.skipped || {};
        S.rated = o.rated || {};
        S.log = dedupeLog(Array.isArray(o.log) ? o.log : []);
        /* Upgrading from 1.1.0: their saved mode is a question already answered. */
        if(isPath(o.path)) S.path = o.path;
        else if(isPath(o.mode)) S.path = o.mode;
        if(S.path) S.mode = S.path;
        if(o.theme === "darker" || o.theme === "dark") S.theme = o.theme;
        if(o.scope) S.scope = o.scope;
        /* Only false is meaningful \u2014 open is the default and absent keys read as
           open, so anything else in here is noise from a hand-edited payload. */
        if(o.groupOpen && typeof o.groupOpen === "object"){
          var gk; for(gk in o.groupOpen){ if(o.groupOpen[gk] === false) S.groupOpen[gk] = false; }
        }
      }catch(e){}
    }
    done();
  };
  if(!store){ finish(null); return; }
  try{
    store.get(KEY).then(finish, function(){ finish(null); });
  }catch(e){ canSave = false; finish(null); }
}

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* ---- ordering ---- */
function visible(f){ return S.scope === "all" || !f.tv; }

/* The span depends on scope: films start 1993, series reach back to 1968. */
function yearSpan(){
  var p = FILMS.filter(visible), lo, hi, i;
  if(!p.length) return "";
  lo = hi = p[0].y;
  for(i = 1; i < p.length; i++){
    if(p[i].y < lo) lo = p[i].y;
    if(p[i].y > hi) hi = p[i].y;
  }
  return lo + " to " + hi;
}
function modeNote(){
  var n = MODENOTE[S.mode] || "";
  return n.replace("{span}", yearSpan());
}
/* Cached on mode|scope — the only two things membership depends on. Never on
   watched/skipped/rated, so nothing needs to clear it and a new key simply
   misses. If membership ever depends on progress, this cache is wrong. */
var groupCache = null, groupCacheKey = "";
function groupsKey(){ return S.mode + "|" + S.scope; }
function buildGroups(){
  var key = groupsKey();
  if(groupCache && groupCacheKey === key) return groupCache.groups;
  var out = [];
  if(S.mode === "continuity"){
    PATH.forEach(function(g, gi){
      out.push({key:"c"+gi, tag:g.n, name:g.name, note:g.note,
                films:FILMS.filter(function(f){ return f.gi === gi && visible(f); })});
    });
  } else if(S.mode === "life"){
    ERAS.forEach(function(era, i){
      var fs = FILMS.filter(function(f){ return f.e === era.k && visible(f); });
      fs.sort(function(a,b){ return (a.gi - b.gi) || (a.ix - b.ix); });
      out.push({key:"e"+era.k, tag:(era.k === 0 ? "\u2014" : String(i+1)),
                name:era.name, note:era.note, films:fs});
    });
  } else {
    DECADES.forEach(function(dec, i){
      var fs = FILMS.filter(function(f){ return visible(f) && f.y >= dec.k && f.y < dec.k + 10; });
      fs.sort(function(a,b){ return (a.y - b.y) || a.t.localeCompare(b.t); });
      out.push({key:"d"+dec.k, tag:String(i+1), name:dec.name, note:dec.note, films:fs});
    });
  }
  out = out.filter(function(g){ return g.films.length; });
  var flat = [];
  out.forEach(function(g){ flat = flat.concat(g.films); });
  groupCacheKey = key;
  groupCache = {groups:out, pool:flat};
  return out;
}
/* Absent reads as open, so "any open" is not simply Object.keys().length. */
function anyOpen(){
  var gs = buildGroups(), i;
  for(i = 0; i < gs.length; i++){ if(S.groupOpen[gs[i].key] !== false) return true; }
  return false;
}
function setAllGroups(open){
  S.groupOpen = {};
  if(!open) buildGroups().forEach(function(g){ S.groupOpen[g.key] = false; });
}
/* The hero's group opens when you arrive at The Path, so the thing you are
   actually up to is never hidden behind a header you have to find. A deliberate
   collapse-all is left alone \u2014 re-opening it on every visit would make the
   control useless. */
function revealHero(){
  if(!anyOpen()) return;
  var f = upNext(); if(!f) return;
  var gs = buildGroups(), i, j;
  for(i = 0; i < gs.length; i++){
    for(j = 0; j < gs[i].films.length; j++){
      if(gs[i].films[j].id === f.id){ delete S.groupOpen[gs[i].key]; return; }
    }
  }
}
function pool(){
  var key = groupsKey();
  if(!groupCache || groupCacheKey !== key) buildGroups();
  return groupCache.pool;
}
function isDone(f){ return !!S.watched[f.id]; }
function isSkip(f){ return !!S.skipped[f.id]; }
function counts(){
  var p = pool(), done = 0, skip = 0;
  p.forEach(function(f){ if(isDone(f)) done++; else if(isSkip(f)) skip++; });
  return {total:p.length, done:done, skip:skip, left:p.length - done - skip};
}
function upNext(){
  /* Preference order: never-skipped first. Only when everything left has been
     skipped do we resurface skipped titles, and the hero labels that state. */
  var p = pool(), i;
  for(i=0;i<p.length;i++){ if(!isDone(p[i]) && !isSkip(p[i])) return p[i]; }
  for(i=0;i<p.length;i++){ if(!isDone(p[i])) return p[i]; }
  return null;
}
function metaOf(f, withUniverse){
  var bits = [];
  if(f.sub) bits.push(f.sub);
  bits.push(String(f.y));
  if(f.ep) bits.push(f.ep + (f.ep === 1 ? " episode" : " episodes"));
  if(withUniverse) bits.push(f.gname);
  return bits.join(" \u00b7 ");
}
/* Tier membership is EXCLUSIVE: Essential > Optional > Core. The raw o:1 flag
   is a ROUTE marker, not a tier — every TV season carries it. Always resolve
   through tierOf(); testing f.o directly drops an essential season from Core
   AND Optional, leaving it in no bucket at all. */
function tierOf(f){ return f.b.indexOf("e") >= 0 ? "e" : (f.o ? "o" : "k"); }
function badges(f){
  var tier = tierOf(f);
  var out = ['<span class="bd '+tier+'">'+BADGE[tier]+'</span>'];
  f.b.forEach(function(k){
    if(k === "e") return;
    out.push('<span class="bd '+k+'">'+BADGE[k]+'</span>');
  });
  return '<span class="badges">'+out.join("")+'</span>';
}
/* A search engine instead of an aggregator. One URL shape everywhere: no
   country in the path, no localised segment, nothing to verify per market and
   nothing that can 404. Three attempts at building an aggregator URL shipped or
   staged broken before this. */
function watchUrl(title){
  return "https://search.brave.com/search?q=" +
         encodeURIComponent("where to watch " + title);
}
/* One star row, shared by the detail panel and Next up. */
function starRow(f){
  var out = "", s;
  for(s = 1; s <= 5; s++){
    out += '<button data-act="rate" data-id="'+f.id+'" data-n="'+s+'" class="'+
           (clampRating(S.rated[f.id]) >= s ? "on" : "")+'" aria-label="Rate '+s+'">\u2605</button>';
  }
  return '<div class="stars">'+out+'</div>';
}
/* Activity: the last five ticks, newest first, with the stars you gave them.
   Rating from here cannot move the hero \u2014 rate() calls markWatched(), which is
   a no-op on something already watched, and nothing here touches watched or
   skipped. Scope is deliberately ignored: this is a record of what you did, and
   hiding a series you logged because the toggle now says films would be a lie
   about your own history. */
var ACTIVITYMAX = 5;
function activityBlock(){
  if(!S.log.length) return "";
  var rows = "", n = 0, i, j, f;
  for(i = S.log.length - 1; i >= 0 && n < ACTIVITYMAX; i--){
    f = null;
    for(j = 0; j < FILMS.length; j++){ if(FILMS[j].id === S.log[i].id){ f = FILMS[j]; break; } }
    if(!f) continue;                      /* an id from a newer build */
    rows += '<div class="arow"><span class="at">'+esc(f.t)+'</span>'+
            '<span class="ad">'+esc(logDate(S.log[i].ts))+'</span>'+
            starRow(f)+'</div>';
    n++;
  }
  if(!n) return "";
  return '<div class="activity"><p class="qhead">Activity</p>'+rows+'</div>';
}
function logDate(ts){
  var d = new Date(ts);
  if(isNaN(d.getTime())) return "";
  return d.toLocaleDateString(undefined, {day:"numeric", month:"short"});
}
function watchLinks(f){
  return '<a class="lnk" href="'+watchUrl(f.t)+
         '" target="_blank" rel="noopener">Where to watch \u2197</a>';
}
var toastT;
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(function(){ el.classList.remove("show"); }, 1700);
}

function markWatched(id){
  if(S.watched[id]) return;
  S.watched[id] = 1; delete S.skipped[id];
  S.log.push({id:id, ts:Date.now()});
}
function unmarkWatched(id){
  delete S.watched[id];
  S.log = S.log.filter(function(e){ return e.id !== id; });
}
function toggleWatched(id){
  if(S.watched[id]) unmarkWatched(id);
  else markWatched(id);
  persist(); render();
}
function toggleSkip(id){
  if(S.skipped[id]) delete S.skipped[id];
  else { S.skipped[id] = 1; unmarkWatched(id); }
  persist(); render();
}
/* Ratings are integers 1-5. Imported JSON may carry anything, and an
   out-of-range value reaches new Array(n+1) in the star render and throws,
   blanking the view. Every write to S.rated goes through this. */
function clampRating(n){
  n = Math.floor(Number(n));
  return (n >= 1 && n <= 5) ? n : 0;
}
function stars(n){
  n = clampRating(n);
  return n ? new Array(n + 1).join("\u2605") : "";
}
function rate(id, n){
  n = clampRating(n);
  if(!n) return;
  if(S.rated[id] === n) delete S.rated[id]; else S.rated[id] = n;
  markWatched(id);
  persist(); render();
}

function exportCode(){
  var w = [], k = [], r = [];
  FILMS.forEach(function(f){
    var h = idHash(f.id);
    if(S.watched[f.id]) w.push(h);
    if(S.skipped[f.id]) k.push(h);
    if(clampRating(S.rated[f.id])) r.push(h + clampRating(S.rated[f.id]));
  });
  /* NW2 adds the path in a P segment. 1.1.0 skips segments it does not know,
     so it restores everything else. 1.0.0 rejects NW2; sw.js is network-first. */
  return "NW2W" + w.join("") + "S" + k.join("") + "R" + r.join("") +
         (S.path ? "P" + PATHCODE[S.path] : "");
}
/* NW<version> plus segments. Unknown segments and versions are skipped, so a
   code from a newer build still restores what this one understands. Useless
   unless it ships before the first code that needs it. */
function importCode(raw){
  var code = String(raw || "").trim().replace(/\s+/g, "");
  var hit = code.search(/NW\d+[A-Z]/);
  if(hit > 0) code = code.slice(hit);                    /* tolerate a pasted URL */
  if(!/^NW\d+(?:[A-Z][0-9a-z]*)+$/.test(code)) return null;
  var seg = {}, sre = /([A-Z])([0-9a-z]*)/g, sm;
  var body = code.replace(/^NW\d+/, "");
  while((sm = sre.exec(body))){ if(!(sm[1] in seg)) seg[sm[1]] = sm[2]; }
  var m = [null, seg.W || "", seg.S || "", seg.R || ""];
  var map = {}, i, id;
  FILMS.forEach(function(f){ map[idHash(f.id)] = f.id; });
  var res = {watched:{}, skipped:{}, rated:{}, found:0, unknown:0,
             path:CODEPATH[(seg.P || "").charAt(0)] || ""};
  for(i = 0; i + 5 <= m[1].length; i += 5){
    id = map[m[1].substr(i,5)];
    if(id){ res.watched[id] = 1; res.found++; } else res.unknown++;
  }
  for(i = 0; i + 5 <= m[2].length; i += 5){
    id = map[m[2].substr(i,5)];
    if(id){ res.skipped[id] = 1; res.found++; } else res.unknown++;
  }
  for(i = 0; i + 6 <= m[3].length; i += 6){
    id = map[m[3].substr(i,5)];
    var n = clampRating(parseInt(m[3].charAt(i+5), 10));
    /* Count ratings too. Without this a code carrying only ratings restored
       correctly and then reported "Restored 0", which reads as a failure. */
    if(id && n){ res.rated[id] = n; if(!res.watched[id]) res.found++; }
    else if(!id) res.unknown++;
  }
  return res;
}
function download(name, text, mime){
  try{
    var blob = new Blob([text], {type:mime || "text/plain"});
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    return true;
  }catch(e){ return false; }
}
function exportJSON(){
  var str = JSON.stringify({app:"night-watcher", v:2, exported:new Date().toISOString(),
    scope:S.scope, path:S.path, watched:S.watched, skipped:S.skipped, rated:S.rated, log:S.log}, null, 1);
  return str;
}
function doRestore(text){
  text = String(text || "").trim();
  if(text.charAt(0) === "{"){
    var o; try{ o = JSON.parse(text); }catch(e){ return null; }
    if(!o || typeof o !== "object" || (!o.watched && !o.skipped && !o.rated)) return null;
    var res = {watched:o.watched || {}, skipped:o.skipped || {}, rated:o.rated || {}, found:0, unknown:0,
               path:isPath(o.path) ? o.path : ""};
    if(!S.path && res.path){ S.path = S.mode = res.path; }
    var known = {}; FILMS.forEach(function(f){ known[f.id] = 1; });
    var id2;
    for(id2 in res.watched){ known[id2] ? res.found++ : res.unknown++; }
    for(id2 in res.skipped){ known[id2] ? res.found++ : res.unknown++; }
    for(id2 in res.rated){ if(!res.watched[id2]){ known[id2] ? res.found++ : res.unknown++; } }
    var id3;
    for(id3 in res.watched){ if(!S.watched[id3]){ S.watched[id3] = 1; } }
    for(id3 in res.skipped){ if(!S.watched[id3]) S.skipped[id3] = 1; }
    for(id3 in res.rated){ var rv = clampRating(res.rated[id3]); if(rv) S.rated[id3] = rv; }
    if(Array.isArray(o.log)){
      o.log.forEach(function(en){
        if(en && en.id && en.ts && !S.log.some(function(x){ return x.id === en.id; })) S.log.push(en);
      });
      S.log.sort(function(a2,b2){ return a2.ts - b2.ts; });
    } else {
      var id4; for(id4 in res.watched){ if(!S.log.some(function(x){ return x.id === id4; })) S.log.push({id:id4, ts:Date.now()}); }
    }
    persist(); render();
    return res;
  }
  var code = importCode(text);
  if(!code) return null;
  applyImport(code);
  return code;
}
function applyImport(res){
  var id;
  /* Restore merges progress; it must not overwrite a path chosen here. */
  if(!S.path && isPath(res.path)){ S.path = S.mode = res.path; }
  for(id in res.watched){ if(!S.watched[id]){ S.watched[id] = 1; S.log.push({id:id, ts:Date.now()}); } }
  for(id in res.skipped){ if(!S.watched[id]) S.skipped[id] = 1; }
  for(id in res.rated){ var rn = clampRating(res.rated[id]); if(rn) S.rated[id] = rn; }
  persist(); render();
}
function scopeSwitch(compact){
  var nFilm = FILMS.filter(function(f){ return !f.tv; }).length;
  var nTv = FILMS.filter(function(f){ return f.tv; }).length;
  return '<div class="scope"'+(compact ? ' style="margin:0 0 12px"' : '')+'>'+
    '<button data-scope="movies" aria-pressed="'+(S.scope==="movies")+'">Movies</button>'+
    '<button data-scope="all" aria-pressed="'+(S.scope==="all")+'">Movies + Series</button></div>'+
    (compact ? '' : '<p class="scopenote">'+(S.scope==="movies"
      ? nFilm+' films. Switch on the series to add '+nTv+' seasons of television \u2014 every show from 1968 to now.'
      : nFilm+' films and '+nTv+' seasons of television, woven into the same orders.')+'</p>');
}
function viewHome(){
  var c = counts();
  var nxt = upNext();
  var ess = pool().filter(function(f){ return f.b.indexOf("e") >= 0; });
  var essDone = ess.filter(isDone).length;
  var coreFs = pool().filter(function(f){ return tierOf(f) !== "o"; });
  var coreDone = coreFs.filter(isDone).length;
  var optFs = pool().filter(function(f){ return tierOf(f) === "o"; });
  var optDone = optFs.filter(isDone).length;
  var fresh = (c.done === 0);
  var html = "";

  /* No path yet: Home is the chooser. Not a modal — nothing to dismiss, and
     deep links still route, because routing never depends on it. */
  if(!S.path){
    html += '<div class="chooser"><p class="pathkick">Choose your path</p>' +
      '<p class="picknote" style="margin:8px 0 14px">Three honest answers instead of one fake one. ' +
      (c.done ? 'Switching re-sorts what you see \u2014 nothing you have ticked is lost.' : 'You can change it whenever you like.') + '</p>' +
      PATHS.map(function(m){
        return '<button class="pick" data-path="'+m[0]+'"><b>'+m[1]+'</b><span>'+
               esc(PATHBLURB[m[0]])+'</span></button>';
      }).join("") + '</div>';
    return html;
  }

  var pc = counts(), ppct = pc.total ? pc.done / pc.total : 0;

/* All six chips, always. Splicing the tier chip in only while it was active
   left Home as the only route back to Essentials. The row scrolls. */
function chipSet(){
  return [["all","All"],["left","To watch"],["done","Watched"],
          ["ess","Essentials"],["core","Core route"],["opt","Optional"]];
}
function viewWatch(){
  var q = S.q.toLowerCase();
  /* Switcher removed in 1.2.0: chosen once from Home, not re-asked per visit. */
  var viewing = "";
  if(!S.path){
    viewing = '<div class="viewing"><p>You haven\u2019t chosen a path yet. This is '+
      esc(pathName(S.mode))+'.</p><button data-path="'+S.mode+'">Make this my path</button></div>';
  } else if(S.mode !== S.path){
    /* Both directions. Offering only "make this mine" made a view a one-way
       door, since mode is not persisted and only a reload undid it. */
    viewing = '<div class="viewing"><p>Viewing <b>'+esc(pathName(S.mode))+'</b>. Your path is '+
      esc(pathName(S.path))+'.</p>'+
      '<button data-act="mypath">Back to '+esc(pathName(S.path))+'</button>'+
      '<button class="ghost" data-path="'+S.mode+'">Make this my path</button></div>';
  }
  var html = scopeSwitch(true) + viewing +
    '<h2 class="pathtitle">'+esc(pathName(S.mode))+'</h2>'+
    '<p class="modenote">'+modeNote()+'</p>'+
    '<input class="search" id="q" type="search" enterkeyhint="search" aria-label="Search the catalogue" placeholder="'+
      (S.scope === "all" ? "Search films and series" : "Search films")+'" value="'+esc(S.q)+'">'+
    '<div class="chips">'+
    chipSet().map(function(p){
      return '<button class="chip" data-filter="'+p[0]+'" aria-pressed="'+(S.filter===p[0])+'">'+p[1]+'</button>';
    }).join("")+'</div>'+
    '<div class="allrow"><button class="allbtn" data-act="allgroups">'+
      (anyOpen() ? "Collapse all" : "Expand all")+'</button></div>%%COUNT%%';

  var any = false, shownTotal = 0;
  buildGroups().forEach(function(g){
    var rows = "", shown = 0, gdone = 0, gtot = g.films.length;
    g.films.forEach(function(f){
      if(isDone(f)) gdone++;
      if(S.filter === "core" && tierOf(f) === "o") return;
      if(S.filter === "opt" && tierOf(f) !== "o") return;
      if(S.filter === "left" && (isDone(f) || isSkip(f))) return;
      if(S.filter === "done" && !isDone(f)) return;
      if(S.filter === "ess" && f.b.indexOf("e") < 0) return;
      if(q && (f.t+" "+f.sub+" "+f.y+" "+f.gname+" "+f.d).toLowerCase().indexOf(q) < 0) return;
      shown++; shownTotal++;
      var isOpen = !!S.open[f.id];
      var cls = "film" + (isDone(f)?" done":"") + (isSkip(f)?" skip":"") + (isOpen?" open":"");
      var meta = metaOf(f, S.mode !== "continuity");
      /* Built ONLY for the open row. Emitting it for every entry and hiding it was
         ~220 KB of the ~292 KB this view produced, reparsed on every keystroke. */
      var detail = "";
      if(isOpen){
        detail = '<div class="fdetail"><p>'+esc(f.d)+'</p><div class="acts">'+
          '<button class="act'+(isDone(f)?" primary":"")+'" data-act="watched" data-id="'+f.id+'">'+
            (isDone(f)?"Watched":"Mark watched")+'</button>'+
          '<button class="act" data-act="skip" data-id="'+f.id+'">'+(isSkip(f)?"Unskip":"Skip")+'</button>'+
          starRow(f)+
        '</div><div class="linkrow">'+watchLinks(f)+'</div></div>';
      }
      rows += '<div class="'+cls+'"><div class="frow">'+
        '<button class="tick" data-act="watched" data-id="'+f.id+'" aria-label="Mark '+esc(f.t)+' watched" aria-pressed="'+isDone(f)+'"></button>'+
        '<button class="fmain" data-act="expand" data-id="'+f.id+'" aria-expanded="'+isOpen+'">'+
          '<span class="ftitle">'+esc(f.t)+'</span><span class="fmeta">'+esc(meta)+
            (clampRating(S.rated[f.id]) ? ' \u00b7 <span style="color:var(--signal)">'+stars(S.rated[f.id])+'</span>' : '')+'</span>'+badges(f)+
        '</button></div>'+detail+'</div>';
    });
    if(!shown) return;
    any = true;
    var pct = gtot ? Math.round(gdone/gtot*100) : 0;
    var isOpen = S.groupOpen[g.key] !== false;
    var sub = gdone + " of " + gtot;
    html += '<div class="group'+(isOpen?" open":"")+'">'+
      '<h2 class="ghwrap"><button class="ghead" data-act="group" data-gk="'+g.key+'" aria-expanded="'+isOpen+'">'+
        '<span class="gnum">'+g.tag+'</span><span class="gname"><span class="gtitle">'+esc(g.name)+'</span>'+
        '<span class="meta">'+esc(sub)+'</span>'+
        '<span class="gbar"><i style="width:'+pct+'%"></i></span></span>'+
      '<span class="caret" aria-hidden="true">\u25B6</span></button></h2>'+
      '<div class="gbody"><p class="gnote">'+esc(g.note)+'</p>'+
      rows+'</div></div>';
  });
  html = html.replace("%%COUNT%%", q
    ? '<p class="scopenote" style="margin:-4px 2px 10px">'+shownTotal+(shownTotal===1?" match":" matches")+'</p>' : "");
  if(!any){
    var hidden = 0;
    if(S.scope === "movies" && q){
      FILMS.forEach(function(f){
        if(f.tv && (f.t+" "+f.sub+" "+f.y+" "+f.gname+" "+f.d).toLowerCase().indexOf(q) >= 0) hidden++;
      });
    }
    html += '<div class="empty"><div class="big">Nothing here</div>'+
      (hidden
        ? '<p>No films match \u2014 but '+hidden+' series '+(hidden===1?'entry':'entries')+' do.</p>'+
          '<button class="bkbtn primary" data-act="searchall" style="flex:none;padding:12px 18px">Search everything</button>'
        : '<p>Nothing matches that filter.</p>')+'</div>';
  }
  return html;
}

function donut(groups, title, sub){
  var C = 263.89;
  var total = 0, done = 0;
  groups.forEach(function(g){ total += g.films.length; done += g.films.filter(isDone).length; });
  if(!total) return "";
  var acc = 0, segs = "";
  groups.forEach(function(g){
    var span = g.films.length / total;
    var vis = Math.max(span - 0.005, 0.002);
    var frac = g.films.filter(isDone).length / g.films.length;
    var col = (g.key === "e0") ? "var(--steel)" : "var(--signal)";
    var off = (-acc * C).toFixed(2);
    segs += '<g data-seg="'+g.key+'">'+
      '<circle cx="50" cy="50" r="42" fill="none" stroke="var(--line2)" stroke-width="11" '+
      'stroke-dasharray="'+(vis*C).toFixed(2)+' '+(C - vis*C).toFixed(2)+'" stroke-dashoffset="'+off+'"></circle>'+
      (frac > 0 ? '<circle cx="50" cy="50" r="42" fill="none" stroke="'+col+'" stroke-width="11" '+
      'stroke-dasharray="'+(vis*frac*C).toFixed(2)+' '+(C - vis*frac*C).toFixed(2)+'" stroke-dashoffset="'+off+'"></circle>' : '')+
      '</g>';
    acc += span;
  });
  var pct = Math.round(done / total * 100);
  return '<div class="pie"><p class="pietitle">'+title+'</p>'+
    '<svg viewBox="0 0 100 100" role="img" aria-label="'+title+', '+pct+' percent complete">'+
    '<g transform="rotate(-90 50 50)">'+segs+'</g>'+
    '<text class="pcent" x="50" y="52" text-anchor="middle">'+pct+'%</text>'+
    '<text class="plab" x="50" y="62" text-anchor="middle">'+done+' / '+total+'</text></svg>'+
    '<p class="piesub">'+sub+'</p></div>';
}

  html += '<p class="note">'+(canSave

function render(){
  flagSave();
  applyTheme();
  var c = counts(), pct = c.total ? c.done / c.total : 0;
  document.getElementById("ringArc").setAttribute("stroke-dashoffset", (119.4 * (1 - pct)).toFixed(1));
  document.getElementById("ringPct").textContent = Math.round(pct*100) + "%";
  var gWord = S.mode === "life" ? "eras" : S.mode === "release" ? "decades" : "universes";
  document.getElementById("hsub").textContent = S.path
    ? pathName(S.path) + " \u00b7 " + c.done + " of " + c.total
    : c.done + " of " + c.total + " logged \u00b7 " + buildGroups().length + " " + gWord;
  /* Scroll lives on the document, not <main>: <main> has no overflow, so its
     scrollTop is always 0 and every re-render threw the position away. */
  var v = document.getElementById("view");
  var keep = window.pageYOffset || document.documentElement.scrollTop || 0;
  var qPrev = document.getElementById("q");
  var qSel = qPrev ? qPrev.selectionStart : null;
  /* Refocus if the box HELD focus, not if it merely has text — keying off S.q
     shut the keyboard when you deleted the last character. */
  var qWasFocused = !!qPrev && document.activeElement === qPrev;
  var focus = null, ae = document.activeElement;
  if(ae && ae.tagName === "BUTTON" && v.contains(ae) && ae.dataset){
    focus = {}; ["act","id","tf","gk","mode","scope","filter","n"].forEach(function(k){
      if(ae.dataset[k] !== undefined) focus[k] = ae.dataset[k];
    });
    if(!Object.keys(focus).length) focus = null;
  }
  v.innerHTML = S.tab === "home" ? viewHome()
              : S.tab === "next" ? viewNext()
              : S.tab === "watch" ? viewWatch() : viewStats();
  /* aria-current, not aria-selected, which is meaningless on a plain button.
     Removed rather than set false: it has no false state and the CSS matches
     on presence. */
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(b){
    if(b.dataset.tab === S.tab) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
  if(focus){
    var btns = v.querySelectorAll("button"), bi, cand, k2, hit;
    for(bi = 0; bi < btns.length; bi++){
      cand = btns[bi]; hit = true;
      for(k2 in focus){ if(cand.dataset[k2] !== focus[k2]){ hit = false; break; } }
      if(hit){ try{ cand.focus({preventScroll:true}); }catch(e){ cand.focus(); } break; }
    }
  }
  var qi = document.getElementById("q");
  if(qi && qWasFocused){
    qi.focus();
    var pos = (qSel === null || qSel === undefined) ? qi.value.length : Math.min(qSel, qi.value.length);
    qi.setSelectionRange(pos, pos);
  }
  window.scrollTo(0, keep);
}

function goToGroup(jk){
  S.tab = "watch"; S.filter = "all"; S.q = "";
  S.mode = (jk.charAt(0) === "e") ? "life" : "continuity";
  S.groupOpen = {};
  buildGroups().forEach(function(g){ S.groupOpen[g.key] = (g.key === jk); });
  /* groupOpen persists as of 1.3.5; tab, filter, query and mode remain session
     state by design. Jumping is a deliberate act, so its collapse sticks. */
  persist();
  window.scrollTo(0,0); render();
  /* A collapsed group is still a 56px sticky header, so scrolling to the top
     can leave the requested group far below the fold. */
  var target = document.querySelector('.ghead[data-gk="'+jk+'"]');
  if(target && target.scrollIntoView){
    try{ target.scrollIntoView({block:"start", behavior:"smooth"}); }
    catch(e){ target.scrollIntoView(); }
  }
}

document.getElementById("tabs").addEventListener("click", function(e){
  var b = e.target.closest("button[data-tab]");
  if(!b) return;
  if(b.dataset.tab === "watch" && S.path){ S.mode = S.path; revealHero(); }
  S.tab = b.dataset.tab; window.scrollTo(0,0); render();
});

/* The wordmark is the one element on every screen, so it is the natural
   "back to the top" \u2014 scroll lives on the document, not on <main>. */
document.getElementById("topBtn").addEventListener("click", function(){
  try{ window.scrollTo({top:0, behavior:"smooth"}); }
  catch(e){ window.scrollTo(0, 0); }
});
document.getElementById("ringBtn").addEventListener("click", function(){
  S.tab = "stats"; window.scrollTo(0,0); render();
});

document.getElementById("markBtn").addEventListener("click", function(){
  S.tab = "home"; window.scrollTo(0,0); render();
});

document.getElementById("view").addEventListener("click", function(e){
  var seg = e.target.closest ? e.target.closest("g[data-seg]") : null;
  if(seg){ goToGroup(seg.getAttribute("data-seg")); return; }
  var b = e.target.closest("button");
  if(!b) return;
  if(b.dataset.act === "searchall"){ S.scope = "all"; S.filter = "all"; persist(); render(); toast("Series added"); return; }
  if(b.dataset.scope){
    S.scope = b.dataset.scope; S.groupOpen = {}; persist(); render();
    toast(S.scope === "all" ? "Series added" : "Films only");
    return;
  }
  if(b.dataset.path){
    if(!isPath(b.dataset.path)) return;
    var first = !S.path;
    S.path = S.mode = b.dataset.path; S.groupOpen = {}; persist(); render();
    window.scrollTo(0,0);
    toast(first ? pathName(S.path) + " it is" : "Path: " + pathName(S.path));
    return;
  }
  if(b.dataset.theme){
    S.theme = (b.dataset.theme === "darker") ? "darker" : "dark";
    persist(); render();
    return;
  }
  if(b.dataset.filter){ S.filter = b.dataset.filter; render(); return; }
  var act = b.dataset.act, id = b.dataset.id;
  if(act === "mypath"){ S.mode = S.path; S.groupOpen = {}; persist(); window.scrollTo(0,0); render(); }
  else if(act === "repath"){ S.path = ""; window.scrollTo(0,0); persist(); render(); }
  else if(act === "resume"){ S.tab = "next"; window.scrollTo(0,0); render(); }
  else if(act === "tier"){
    S.tab = "watch"; S.filter = b.dataset.tf; S.q = ""; S.groupOpen = {};
    persist(); window.scrollTo(0,0); render();
  }
  else if(act === "jump"){
    goToGroup(b.dataset.gk);
  }
  else if(act === "watched"){ var w = !!S.watched[id]; toggleWatched(id); toast(w ? "Unmarked" : "Logged"); }
  else if(act === "skip"){ var k = !!S.skipped[id]; toggleSkip(id); toast(k ? "Back in the queue" : "Skipped"); }
  else if(act === "rate"){ rate(id, parseInt(b.dataset.n,10)); }
  else if(act === "expand"){ S.open[id] = !S.open[id]; render(); }
  else if(act === "group"){ var gk = b.dataset.gk; S.groupOpen[gk] = (S.groupOpen[gk] === false); persist(); render(); }
  else if(act === "allgroups"){ setAllGroups(!anyOpen()); persist(); render(); window.scrollTo(0,0); }
  else if(act === "mkcode"){ S.code = exportCode(); render(); toast("Code ready"); }
  else if(act === "copylink"){
    var lk = restoreLink(S.code);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(lk).then(function(){ toast("Link copied"); },
                                            function(){ toast("Could not copy \u2014 use Copy code"); });
    } else {
      toast("Could not copy \u2014 use Copy code");
    }
  }
  else if(act === "copy"){
    var box = document.getElementById("codebox");
    if(box){
      box.focus(); box.select();
      var done = false;
      try{ done = document.execCommand("copy"); }catch(e){}
      if(!done && navigator.clipboard){
        navigator.clipboard.writeText(S.code).then(function(){ toast("Copied"); },
                                                   function(){ toast("Select and copy"); });
        return;
      }
      toast(done ? "Copied" : "Select and copy");
    }
  }
  else if(act === "dl"){
    toast(download("night-watcher-backup.txt", S.code + "\n") ? "Downloaded" : "Download unavailable");
  }
  else if(act === "restore"){
    var ta = document.getElementById("restorebox");
    var res = doRestore(ta ? ta.value : "");
    if(!res){ toast("That doesn\u2019t look like a backup"); return; }
    toast("Restored " + res.found + (res.unknown ? " \u00b7 " + res.unknown + " kept for a newer version" : ""));
  }
  else if(act === "dljson"){
    toast(download("night-watcher-full.json", exportJSON(), "application/json")
      ? "Full backup downloaded" : "Download unavailable");
  }
  else if(act === "pickfile"){
    var fi = document.getElementById("restorefile");
    if(fi) fi.click();
  }
  else if(act === "reset"){
    if(!S.confirmReset){
      S.confirmReset = true; render();
      setTimeout(function(){ if(S.confirmReset){ S.confirmReset = false; if(S.tab === "stats") render(); } }, 4000);
      return;
    }
    S.confirmReset = false;
    S.watched = {}; S.skipped = {}; S.rated = {}; S.log = []; S.code = "";
    persist(); render(); toast("Progress cleared");
  }
});

document.getElementById("view").addEventListener("change", function(e){
  if(e.target.id !== "restorefile" || !e.target.files || !e.target.files[0]) return;
  var rd = new FileReader();
  rd.onload = function(){
    var res = doRestore(rd.result);
    toast(res ? "Restored " + res.found + " from file" : "That file isn\u2019t a backup");
  };
  rd.readAsText(e.target.files[0]);
});

var qTimer = null;
document.getElementById("view").addEventListener("input", function(e){
  if(e.target.id !== "q") return;
  var v = e.target.value;
  clearTimeout(qTimer);
  qTimer = setTimeout(function(){ S.q = v; render(); }, 180);
});

restore(function(){
  try{ routeHash(); }catch(e){}
  render();
});

/* Runs on load and on every hashchange, so a shared #life link works in a
   running app, not only on a fresh one. */
function routeHash(){
  var h = location.hash || "";
  if(h.indexOf("#nw=") === 0){
    var res = importCode(decodeURIComponent(h.slice(4)));
    if(res){
      applyImport(res);
      S.tab = "home";
      setTimeout(function(){ toast("Restored " + res.found + " from your backup"); }, 400);
    }
    if(history.replaceState) history.replaceState(null, "", location.pathname);
  } else if(h.length > 1){
    /* shareable views: #life  #release  #universes  #progress  #next
       combine with scope: #life-series  #universes-movies */
    h.slice(1).toLowerCase().split(/[-+]/).forEach(function(tok){
      if(tok === "life"){ S.tab = "watch"; S.mode = "life"; revealHero(); }
      else if(tok === "release"){ S.tab = "watch"; S.mode = "release"; revealHero(); }
      else if(tok === "universes" || tok === "path"){ S.tab = "watch"; S.mode = "continuity"; revealHero(); }
      else if(tok === "progress"){ S.tab = "stats"; }
      else if(tok === "next"){ S.tab = "next"; }
      else if(tok === "series"){ S.scope = "all"; }
      else if(tok === "movies"){ S.scope = "movies"; }
    });
  }
}
window.addEventListener("hashchange", function(){
  try{ routeHash(); }catch(e){}
  render();
});

/* Registration is guarded: service workers need a secure context and file://
   is a supported way to run this. Failure is silent and non-fatal. */
if("serviceWorker" in navigator &&
   (location.protocol === "https:" || location.hostname === "localhost")){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
