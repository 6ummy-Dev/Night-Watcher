  }).filter(function(g){ return g.films.length; });
  var lifeGroups = ERAS.map(function(era){
    return {key:"e"+era.k, films:FILMS.filter(function(f){ return f.e === era.k && visible(f); })};
  }).filter(function(g){ return g.films.length; });

  var html = scopeSwitch(true) + '<div class="pies" style="margin-top:18px">'+
    donut(uniGroups, "The universes", uniGroups.length + " universes \u00b7 tap a slice") +
    donut(lifeGroups, "Bruce\u2019s life", lifeGroups.length + " eras \u00b7 tap a slice") +
    '</div>'+
    '<div class="bigstat">'+
    '<div><b>'+c.done+'</b><span>Watched</span></div>'+
    '<div><b>'+c.left+'</b><span>To go</span></div>'+
    '<div><b>'+essDone+'/'+ess.length+'</b><span>Essentials</span></div></div>'+
    '<div class="legend">'+
      '<span><i style="color:var(--signal)">Essential</i> \u2014 do not skip</span>'+
      '<span><i style="color:var(--dust)">Core</i> \u2014 the main route</span>'+
      '<span><i style="color:var(--dim)">Optional</i> \u2014 side material</span>'+
      '<span><i style="color:var(--crimson)">Mature</i> \u2014 R or close</span>'+
      '<span><i style="color:var(--steel)">Not out yet</i></span>'+
      '<span><i style="color:var(--moss)">Interactive</i></span>'+
      '<span><i>Short</i> \u2014 under 30 min</span></div>';

  html += '<p class="qhead" style="margin:26px 0 0">By universe</p>';
  PATH.forEach(function(g, gi){
    var fs = FILMS.filter(function(f){ return f.gi === gi && visible(f); });
    if(!fs.length) return;
    var d = fs.filter(isDone).length;
    html += '<div class="srow"><span class="sn">'+esc(g.name)+'</span>'+
      '<span class="sb"><i style="width:'+Math.round(d/fs.length*100)+'%"></i></span>'+
      '<span class="sc">'+d+'/'+fs.length+'</span></div>';
  });

  html += '<p class="qhead" style="margin:26px 0 0">By era of Bruce\u2019s life</p>';
  ERAS.forEach(function(era){
    var fs = FILMS.filter(function(f){ return f.e === era.k && visible(f); });
    if(!fs.length) return;
    var d = fs.filter(isDone).length;
    var col = era.k === 0 ? "var(--steel)" : "var(--signal)";
    html += '<div class="srow"><span class="sn">'+esc(era.name)+'</span>'+
      '<span class="sb"><i style="width:'+Math.round(d/fs.length*100)+'%;background:'+col+'"></i></span>'+
      '<span class="sc">'+d+'/'+fs.length+'</span></div>';
  });

  var rated = FILMS.filter(function(f){ return clampRating(S.rated[f.id]); })
                   .sort(function(a,b){ return clampRating(S.rated[b.id]) - clampRating(S.rated[a.id]); });
  if(rated.length){
    html += '<p class="qhead" style="margin:28px 0 4px">Your ratings</p>';
    rated.forEach(function(f){
      html += '<div class="srow"><span class="sn">'+esc(f.t)+'</span>'+
        '<span class="sc" style="width:auto;color:var(--signal)">'+
        stars(S.rated[f.id])+'</span></div>';
    });
  }
  html += '<div class="bk" style="margin-bottom:16px"><h3>Your path</h3>'+
    '<p>The ordering the whole app follows. Switching re-sorts everything \u2014 it never clears a tick, a skip or a rating.</p>'+
    '<div class="modes" style="margin-bottom:0">'+
    PATHS.map(function(m){
      return '<button data-path="'+m[0]+'" aria-pressed="'+(S.path===m[0])+'">'+m[1]+'</button>';
    }).join("")+'</div>'+
    '<hr class="bkhr"><h3>Darker</h3>'+
    '<p>Pure black surfaces for watching in an actually dark room. Nothing else changes.</p>'+
    '<div class="modes" style="margin-bottom:0">'+
    [["dark","Dark deco"],["darker","Darker"]].map(function(m){
      return '<button data-theme="'+m[0]+'" aria-pressed="'+(S.theme===m[0])+'">'+m[1]+'</button>';
    }).join("")+'</div></div>';
  html += '<div class="bk"><h3>Backup &amp; transfer</h3>'+
    '<p>Your progress lives only in this browser \u2014 a new phone, or clearing site data, starts you at zero. '+
    'Make a code and you can carry it anywhere.</p><div class="bkbtns">'+
    '<button class="bkbtn primary" data-act="mkcode">'+(S.code ? "Refresh code" : "Create backup code")+'</button>'+
    (S.code ? '<button class="bkbtn" data-act="dl">Code file</button>' : '')+
    '<button class="bkbtn" data-act="dljson">Full JSON</button>'+
    '</div>';
  if(S.code){
    html += '<textarea class="code" readonly rows="3" id="codebox">'+esc(S.code)+'</textarea>'+
      '<div class="bkbtns"><button class="bkbtn" data-act="copy">Copy code</button></div>';
    var qrOk = false;
    try{
      var link = restoreLink(S.code);
      var q = qrcode(0, "L"); q.addData(link); q.make();
      html += '<p class="qrcap" style="margin-top:16px">Scan with your new phone</p>'+
        '<div class="qrwrap">'+q.createSvgTag({cellSize:3, margin:2, scalable:true})+'</div>'+
        '<p class="warn">Opens Night Watcher on that device and restores everything.</p>';
      qrOk = true;
    }catch(e){}
    if(!qrOk) html += '<p class="warn">Code too long for a QR here \u2014 use Copy or Download.</p>';
  }
  html += '<hr class="bkhr"><h3>Restore</h3>'+
    '<p>Paste a backup code from another device. It merges in \u2014 nothing already ticked is lost.</p>'+
    '<textarea class="bkin" id="restorebox" placeholder="NW2W\u2026 or paste a full JSON backup"></textarea>'+
    '<div class="bkbtns"><button class="bkbtn" data-act="restore">Restore progress</button>'+
    '<button class="bkbtn" data-act="pickfile">Import a file</button></div>'+
    '<input type="file" id="restorefile" accept=".json,.txt" style="display:none"></div>';
  html += S.confirmReset
    ? '<button class="danger" data-act="reset" style="background:var(--crimson);color:#fff;border-color:var(--crimson)">Tap again to erase everything</button>'
    : '<button class="danger" data-act="reset">Clear all progress</button>';
  html += '<p class="note">'+(canSave
    ? "Progress saves automatically on this device and follows you across all three orderings."
    : "Saving is unavailable here, so progress lasts for this session only.")+
    ' Streaming rows rotate monthly, so the "Streaming now" link on each film checks live availability. Knightfall and Dynamic Duo dates are as announced and can move. \u00b7 Build '+BUILD+'</p>';
  return html;
}

function render(){
  flagSave();
  applyTheme();
  var c = counts(), pct = c.total ? c.done / c.total : 0;
  document.getElementById("ringArc").setAttribute("stroke-dashoffset", (119.4 * (1 - pct)).toFixed(1));
  document.getElementById("ringPct").textContent = Math.round(pct*100) + "%";
  /* The sub-line already existed; it now carries the path name. Cheapest
     possible reminder of which ordering you are in — no new chrome, a label
     that was there anyway saying something more useful. */
  var gWord = S.mode === "life" ? "eras" : S.mode === "release" ? "decades" : "universes";
  document.getElementById("hsub").textContent = S.path
    ? pathName(S.path) + " \u00b7 " + c.done + " of " + c.total
    : c.done + " of " + c.total + " logged \u00b7 " + buildGroups().length + " " + gWord;
  /* Scroll lives on the document, not on <main>. This used to read and write
     v.scrollTop — but <main> has no overflow, so it is never a scroll
     container and that value was always 0. Every re-render silently threw the
     scroll position away and it only looked fine because replacing innerHTML
     with content of a similar height leaves the document scroll where it was.
     Tick something near the bottom of a filtered list and it jumped. */
  var v = document.getElementById("view");
  var keep = window.pageYOffset || document.documentElement.scrollTop || 0;
  var qPrev = document.getElementById("q");
  var qSel = qPrev ? qPrev.selectionStart : null;
  /* Refocus the search box if it HELD focus, not merely if it has text.
     Keying off S.q meant deleting the last character dropped focus and shut
     the keyboard mid-edit on mobile. */
  var qWasFocused = !!qPrev && document.activeElement === qPrev;
  var focus = null, ae = document.activeElement;
  if(ae && ae.tagName === "BUTTON" && v.contains(ae) && ae.dataset){
    focus = {}; ["act","id","tf","gk","mode","scope","filter","n"].forEach(function(k){
      if(ae.dataset[k] !== undefined) focus[k] = ae.dataset[k];
    });
    if(!Object.keys(focus).length) focus = null;
  }
  v.innerHTML = S.tab === "home" ? viewHome()
              : S.tab === "next" ? viewNext()
              : S.tab === "watch" ? viewWatch() : viewStats();
  /* aria-current, not aria-selected: aria-selected is only meaningful on a
     role=tab/option/row. These are plain navigation buttons, and a bare
     aria-selected on a button is ignored by screen readers. The attribute is
     REMOVED rather than set to false — aria-current has no false state, and
     the CSS matches on presence. */
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(b){
    if(b.dataset.tab === S.tab) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
  if(focus){
    var btns = v.querySelectorAll("button"), bi, cand, k2, hit;
    for(bi = 0; bi < btns.length; bi++){
      cand = btns[bi]; hit = true;
      for(k2 in focus){ if(cand.dataset[k2] !== focus[k2]){ hit = false; break; } }
      if(hit){ try{ cand.focus({preventScroll:true}); }catch(e){ cand.focus(); } break; }
    }
  }
  var qi = document.getElementById("q");
  if(qi && qWasFocused){
    qi.focus();
    var pos = (qSel === null || qSel === undefined) ? qi.value.length : Math.min(qSel, qi.value.length);
    qi.setSelectionRange(pos, pos);
  }
  window.scrollTo(0, keep);
}

function goToGroup(jk){
  S.tab = "watch"; S.filter = "all"; S.q = "";
  S.mode = (jk.charAt(0) === "e") ? "life" : "continuity";
  S.groupOpen = {};
  buildGroups().forEach(function(g){ S.groupOpen[g.key] = (g.key === jk); });
  window.scrollTo(0,0); persist(); render();
  /* Every other group is collapsed, but "collapsed" is still a 56px sticky
     header — jumping to the top can leave the group you actually asked for
     twenty-odd headers below the fold. Tapping a donut slice is advertised as
     going straight there, so go straight there. */
  var target = document.querySelector('.ghead[data-gk="'+jk+'"]');
  if(target && target.scrollIntoView){
    try{ target.scrollIntoView({block:"start", behavior:"smooth"}); }
    catch(e){ target.scrollIntoView(); }
  }
}

document.getElementById("tabs").addEventListener("click", function(e){
  var b = e.target.closest("button[data-tab]");
  if(!b) return;
  if(b.dataset.tab === "watch" && S.path) S.mode = S.path;
  S.tab = b.dataset.tab; window.scrollTo(0,0); render();
});

document.getElementById("ringBtn").addEventListener("click", function(){
  S.tab = "stats"; window.scrollTo(0,0); render();
});

document.getElementById("markBtn").addEventListener("click", function(){
  S.tab = "home"; window.scrollTo(0,0); render();
});

document.getElementById("view").addEventListener("click", function(e){
  var seg = e.target.closest ? e.target.closest("g[data-seg]") : null;
  if(seg){ goToGroup(seg.getAttribute("data-seg")); return; }
  var b = e.target.closest("button");
  if(!b) return;
  if(b.dataset.act === "searchall"){ S.scope = "all"; S.filter = "all"; persist(); render(); toast("Series added"); return; }
  if(b.dataset.scope){
    S.scope = b.dataset.scope; S.groupOpen = {}; persist(); render();
    toast(S.scope === "all" ? "Series added" : "Films only");
    return;
  }
  if(b.dataset.path){
    if(!isPath(b.dataset.path)) return;
    var first = !S.path;
    S.path = S.mode = b.dataset.path; S.groupOpen = {}; persist(); render();
    window.scrollTo(0,0);
    toast(first ? pathName(S.path) + " it is" : "Path: " + pathName(S.path));
    return;
  }
  if(b.dataset.theme){
    S.theme = (b.dataset.theme === "darker") ? "darker" : "dark";
    persist(); render();
    return;
  }
  if(b.dataset.mode){ S.mode = b.dataset.mode; S.groupOpen = {}; persist(); render(); return; }
  if(b.dataset.filter){ S.filter = b.dataset.filter; render(); return; }
  var act = b.dataset.act, id = b.dataset.id;
  if(act === "mypath"){ S.mode = S.path; S.groupOpen = {}; window.scrollTo(0,0); render(); }
  else if(act === "repath"){ S.path = ""; window.scrollTo(0,0); persist(); render(); }
  else if(act === "resume"){ S.tab = "next"; window.scrollTo(0,0); render(); }
  else if(act === "tier"){
    S.tab = "watch"; S.filter = b.dataset.tf; S.q = ""; S.groupOpen = {};
    window.scrollTo(0,0); render();
  }
  else if(act === "jump"){
    goToGroup(b.dataset.gk);
  }
  else if(act === "watched"){ var w = !!S.watched[id]; toggleWatched(id); toast(w ? "Unmarked" : "Logged"); }
  else if(act === "skip"){ var k = !!S.skipped[id]; toggleSkip(id); toast(k ? "Back in the queue" : "Skipped"); }
  else if(act === "rate"){ rate(id, parseInt(b.dataset.n,10)); }
  else if(act === "expand"){ S.open[id] = !S.open[id]; render(); }
  else if(act === "group"){ var gk = b.dataset.gk; S.groupOpen[gk] = (S.groupOpen[gk] === false); render(); }
  else if(act === "mkcode"){ S.code = exportCode(); render(); toast("Code ready"); }
  else if(act === "copy"){
    var box = document.getElementById("codebox");
    if(box){
      box.focus(); box.select();
      var done = false;
      try{ done = document.execCommand("copy"); }catch(e){}
      if(!done && navigator.clipboard){
        navigator.clipboard.writeText(S.code).then(function(){ toast("Copied"); },
                                                   function(){ toast("Select and copy"); });
        return;
      }
      toast(done ? "Copied" : "Select and copy");
    }
  }
  else if(act === "dl"){
    toast(download("night-watcher-backup.txt", S.code + "\n") ? "Downloaded" : "Download unavailable");
  }
  else if(act === "restore"){
    var ta = document.getElementById("restorebox");
    var res = doRestore(ta ? ta.value : "");
    if(!res){ toast("That doesn\u2019t look like a backup"); return; }
    toast("Restored " + res.found + (res.unknown ? " \u00b7 " + res.unknown + " kept for a newer version" : ""));
  }
  else if(act === "dljson"){
    toast(download("night-watcher-full.json", exportJSON(), "application/json")
      ? "Full backup downloaded" : "Download unavailable");
  }
  else if(act === "pickfile"){
    var fi = document.getElementById("restorefile");
    if(fi) fi.click();
  }
  else if(act === "reset"){
    if(!S.confirmReset){
      S.confirmReset = true; render();
      setTimeout(function(){ if(S.confirmReset){ S.confirmReset = false; if(S.tab === "stats") render(); } }, 4000);
      return;
    }
    S.confirmReset = false;
    S.watched = {}; S.skipped = {}; S.rated = {}; S.log = []; S.code = "";
    persist(); render(); toast("Progress cleared");
  }
});

document.getElementById("view").addEventListener("change", function(e){
  if(e.target.id !== "restorefile" || !e.target.files || !e.target.files[0]) return;
  var rd = new FileReader();
  rd.onload = function(){
    var res = doRestore(rd.result);
    toast(res ? "Restored " + res.found + " from file" : "That file isn\u2019t a backup");
  };
  rd.readAsText(e.target.files[0]);
});

var qTimer = null;
document.getElementById("view").addEventListener("input", function(e){
  if(e.target.id !== "q") return;
  var v = e.target.value;
  clearTimeout(qTimer);
  qTimer = setTimeout(function(){ S.q = v; render(); }, 180);
});

restore(function(){
  try{
    var h = location.hash || "";
    if(h.indexOf("#nw=") === 0){
      var res = importCode(decodeURIComponent(h.slice(4)));
      if(res){
        applyImport(res);
        S.tab = "home";
        setTimeout(function(){ toast("Restored " + res.found + " from your backup"); }, 400);
      }
      if(history.replaceState) history.replaceState(null, "", location.pathname);
    } else if(h.length > 1){
      /* shareable views: #life  #release  #universes  #progress  #next
         combine with scope: #life-series  #universes-movies */
      h.slice(1).toLowerCase().split(/[-+]/).forEach(function(tok){
        if(tok === "life"){ S.tab = "watch"; S.mode = "life"; }
        else if(tok === "release"){ S.tab = "watch"; S.mode = "release"; }
        else if(tok === "universes" || tok === "path"){ S.tab = "watch"; S.mode = "continuity"; }
        else if(tok === "progress"){ S.tab = "stats"; }
        else if(tok === "next"){ S.tab = "next"; }
        else if(tok === "series"){ S.scope = "all"; }
        else if(tok === "movies"){ S.scope = "movies"; }
      });
    }
  }catch(e){}
  render();
});

/* Offline support. Registration is guarded: service workers require a secure
   context, so a file:// open (which is a supported way to run this) would
   throw. Failure is silent and non-fatal — the app is one self-contained file
   and works without it. */
if("serviceWorker" in navigator &&
   (location.protocol === "https:" || location.hostname === "localhost")){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
