@font-face{font-family:"Limelight";src:url("fonts/limelight-latin-400-normal.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:"Anton";src:url("fonts/anton-latin-400-normal.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:"IBM Plex Sans";src:url("fonts/ibm-plex-sans-latin-400-normal.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:"IBM Plex Sans";src:url("fonts/ibm-plex-sans-latin-600-normal.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap;}

:root{
  --ink:#08090F; --sunk:#0C111C; --card:#141B2C; --card2:#1B2438;
  --line:#252E42; --line2:#33405C; --staroff:#63759E;
  --bone:#E7E9F0; --dust:#93A0B8; --dim:#8B97B1;
  --signal:#FFCF1F; --steel:#7295CC; --crimson:#C43A30; --crimson2:#DD7A73; --moss:#7FA98B;
  --signalpress:#E8BC1C; --signalline:rgba(255,207,31,.4); --signaledge:rgba(255,207,31,.55);
  --crimsonline:rgba(176,58,58,.5); --onCrimson:#FFFFFF;
  --deco:"Limelight","Big Shoulders Display",serif;
  --disp:"Anton","Haettenschweiler","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --hdr:rgba(10,12,17,.9);
  --tabbg:rgba(14,17,25,.94);
  --tab-h:58px;
}
:root[data-theme="darker"]{
  --ink:#000000; --sunk:#05070C; --card:#0B101B; --card2:#111826;
  --line:#1B2233; --line2:#2C3853;
  --hdr:rgba(0,0,0,.92);
  --tabbg:rgba(4,6,10,.95);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--ink);color:var(--bone);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior:none;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:4px;}

#app{display:flex;flex-direction:column;min-height:calc(100svh + 1px);}
#view{overflow-anchor:none;}
header{position:sticky;top:0;z-index:30;background:var(--hdr);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;}
.hrow{display:flex;align-items:center;gap:14px;max-width:760px;margin:0 auto;}
#nosave{max-width:760px;margin:11px auto 0;padding:8px 12px;border:1px solid var(--signal);border-radius:8px;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;line-height:1.55;color:var(--signal);text-align:center;}
#nosave[hidden]{display:none;}
.mark{width:46px;flex:none;padding:0;color:var(--signal);display:flex;justify-content:center;align-items:center;}
.mark svg{display:block;width:32px;height:auto;}
.mark:active{opacity:.7;}
.wordmark{flex:1;min-width:0;text-align:center;}
.wordmark h1{font-family:var(--deco);font-weight:400;letter-spacing:.02em;text-transform:uppercase;font-size:21px;line-height:.95;margin:0;}
.wordmark h1 button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;}
.wordmark p{font-family:var(--mono);font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);margin:4px 0 0;}
.ring{width:46px;height:46px;flex:none;position:relative;padding:0;border:0;background:none;cursor:pointer;}
.ring:active{opacity:.7;}
.pies{display:flex;gap:10px;margin-bottom:18px;}
.pie{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--sunk);padding:13px 8px 11px;}
.pietitle{font-family:var(--mono);font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dust);margin:0 0 9px;text-align:center;}
.pie svg{width:100%;max-width:148px;height:auto;display:block;margin:0 auto;}
.pie svg g[data-seg]{cursor:pointer;}
.piesub{font-family:var(--mono);font-size:8.5px;color:var(--dim);margin:9px 0 0;letter-spacing:.05em;text-align:center;line-height:1.5;}
.pcent{font-family:var(--disp);font-size:19px;fill:var(--bone);}
.plab{font-family:var(--mono);font-size:6px;fill:var(--dim);letter-spacing:.14em;}
.ring svg{transform:rotate(-90deg);display:block;}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:600;}
main{flex:1;padding:18px 18px calc(var(--tab-h) + env(safe-area-inset-bottom) + 28px);max-width:760px;margin:0 auto;width:100%;}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:var(--tabbg);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
#tabs button{flex:1;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);transition:color .15s;}
#tabs button svg{display:block;width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;}
#tabs button[aria-current]{color:var(--signal);}

.pathkick{font-family:var(--mono);font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--signal);margin:0;}
.chooser{margin-bottom:22px;}
.pick{display:block;width:100%;text-align:left;border:1px solid var(--line2);border-radius:12px;background:var(--card);padding:14px 16px;margin-bottom:10px;min-height:44px;}
.pick b{font-family:var(--disp);font-weight:400;letter-spacing:.025em;text-transform:uppercase;font-size:19px;line-height:1.05;display:block;}
.pick span{display:block;font-size:13.5px;color:var(--dust);margin-top:6px;line-height:1.45;}
.picknote{font-family:var(--mono);font-size:10px;letter-spacing:.05em;color:var(--dim);margin:2px 0 0;line-height:1.6;}
.viewing{border:1px solid var(--steel);border-radius:10px;padding:10px 13px;margin-bottom:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.viewing p{margin:0;flex:1;min-width:150px;font-size:13px;color:var(--dust);line-height:1.4;}
.viewing button{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink);background:var(--signal);border-radius:8px;padding:9px 12px;min-height:40px;font-weight:600;}
.viewing button.ghost{background:none;color:var(--steel);border:1px solid var(--line2);font-weight:400;}
.prefrow{margin:26px 0 0;}
.pathtitle{font-family:var(--deco);font-weight:400;letter-spacing:.02em;text-transform:uppercase;font-size:clamp(20px,5.2vw,27px);line-height:1;margin:0 0 10px;}
.modes{display:flex;gap:0;border:1px solid var(--line2);border-radius:10px;overflow:hidden;margin-bottom:10px;}
.modes button{flex:1;padding:11px 6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dust);border-right:1px solid var(--line2);min-height:42px;}
.modes button:last-child{border-right:0;}
.modes button[aria-pressed="true"]{background:var(--bone);color:var(--ink);font-weight:600;}
.modenote{font-size:12.5px;color:var(--dim);margin:0 0 14px;line-height:1.45;}

.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.allrow{display:flex;justify-content:flex-end;margin:0 0 12px;}
.allbtn{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:9px 14px;border:1px solid var(--signal);border-radius:100px;color:var(--signal);min-height:44px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;}
.allbtn::after{content:"\25B6";font-size:8px;transform:rotate(90deg);}
.allbtn.shut::after{transform:none;}
.allbtn:active{background:var(--card2);}
.chip{flex:none;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:9px 13px;border:1px solid var(--line2);border-radius:100px;color:var(--dust);min-height:44px;display:inline-flex;align-items:center;white-space:nowrap;}
.chip[aria-pressed="true"]{background:var(--bone);color:var(--ink);border-color:var(--bone);font-weight:600;}
.search{width:100%;background:var(--card);border:1px solid var(--line);color:var(--bone);border-radius:10px;padding:12px 14px;font-family:var(--body);font-size:16px;margin-bottom:12px;-webkit-appearance:none;appearance:none;}
.search::placeholder{color:var(--dim);}

.group{margin:0 0 14px;border:1px solid var(--line);border-radius:14px;background:var(--sunk);}
.ghwrap{margin:0;font:inherit;border-radius:inherit;
  position:sticky;top:var(--ghtop, calc(env(safe-area-inset-top) + 70px));z-index:2;}
.ghead{display:flex;align-items:center;gap:12px;width:100%;padding:15px;text-align:left;min-height:56px;
  background:var(--sunk);border-radius:inherit;}
.group.open .ghead{border-radius:13px 13px 0 0;box-shadow:0 1px 0 var(--line);}
.gnum{font-family:var(--mono);font-size:10px;color:var(--signal);border:1px solid var(--signalline);border-radius:5px;padding:4px 6px;flex:none;min-width:26px;text-align:center;}
.gname{flex:1;min-width:0;}
.gname .gtitle{display:block;font-family:var(--deco);font-weight:400;letter-spacing:.02em;text-transform:uppercase;font-size:17px;line-height:1.02;margin:0;}
.gname .meta{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;color:var(--dim);margin-top:4px;text-transform:uppercase;display:block;}
.gbar{height:3px;border-radius:2px;background:var(--line2);margin-top:7px;overflow:hidden;display:block;}
.gbar i{display:block;height:100%;background:var(--signal);transition:width .3s;}
.caret{font-size:13px;color:var(--dim);flex:none;transition:transform .2s;}
.group.open .caret{transform:rotate(90deg);}
.gbody{display:none;padding:0 15px 6px;}
.group.open .gbody{display:block;}
.gnote{font-size:13.5px;color:var(--dust);margin:0 0 10px;line-height:1.45;}

.film{border-top:1px solid var(--line);}
.frow{display:flex;align-items:flex-start;gap:12px;padding:12px 0;}
.tick{width:30px;height:30px;flex:none;margin-top:1px;border-radius:50%;border:1.5px solid var(--dim);display:grid;place-items:center;font-size:13px;color:transparent;transition:.18s;position:relative;}
.tick::before{content:"";position:absolute;top:-10px;left:-10px;right:-10px;bottom:-10px;}
.tick::after{content:"\2713";font-weight:600;}
.film.done .tick{background:var(--bone);border-color:var(--bone);color:var(--ink);}
.film.skip .tick{border-color:var(--line2);color:var(--dim);}
.film.skip .tick::after{content:"\2013";}
.fmain{flex:1;min-width:0;text-align:left;padding:2px 0;}
.ftitle{display:block;font-family:var(--disp);font-weight:400;letter-spacing:.025em;text-transform:uppercase;font-size:17.5px;line-height:1.06;margin:0;}
.fmeta{display:block;font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:5px;letter-spacing:.05em;}
.film.done .ftitle{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--line2);}
.film.skip .ftitle{color:var(--dim);}
.badges{display:inline-flex;gap:5px;margin-left:7px;vertical-align:2px;flex-wrap:wrap;}
.bd{font-family:var(--mono);font-size:8px;letter-spacing:.12em;padding:2px 5px;border-radius:3px;font-weight:600;border:1px solid transparent;}
.bd.e{background:var(--signal);color:var(--ink);}
.bd.k{background:var(--dust);color:var(--ink);}
.bd.o{color:var(--dim);border:1px solid currentColor;}
.bd.m{color:var(--crimson2);border:1px solid currentColor;}
.bd.u{color:var(--steel);border:1px solid currentColor;}
.bd.c{color:var(--moss);border:1px solid currentColor;}
.bd.s{color:var(--bone);border:1px solid currentColor;opacity:.55;}
.bd.fmanim,.bd.fmlive{color:var(--dim);border:1px dashed currentColor;}
.fdetail{display:none;padding:0 0 14px 42px;}
.film.open .fdetail{display:block;}
.fdetail p{font-size:14px;color:var(--dust);margin:0 0 12px;line-height:1.5;}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.act{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;color:var(--dust);min-height:38px;}
.act.primary{background:var(--bone);color:var(--ink);border-color:var(--bone);font-weight:600;}
.stars{display:flex;gap:0;margin-left:auto;}
.stars button{position:relative;width:36px;height:34px;font-size:16px;color:var(--staroff);}
.stars button::before{content:"";position:absolute;left:0;right:0;top:50%;height:44px;transform:translateY(-50%);}
.stars button.on{color:var(--signal);}
.lnk{font-family:var(--mono);font-size:10px;letter-spacing:.1em;white-space:nowrap;text-transform:uppercase;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;color:var(--steel);min-height:38px;display:inline-flex;align-items:center;text-decoration:none;}
.lnk:active{background:var(--card2);}
.linkrow{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;margin-top:10px;}

.hero{border:1px solid var(--line);border-radius:16px;background:linear-gradient(175deg,var(--card2),var(--card) 60%);padding:18px;}
.hero .kick{font-family:var(--mono);font-size:10px;letter-spacing:.19em;text-transform:uppercase;color:var(--signal);margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hero .hcont{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dust);margin:0 0 12px;}
.hero h2{font-family:var(--deco);font-weight:400;letter-spacing:.02em;text-transform:uppercase;font-size:clamp(24px,6.5vw,36px);line-height:.94;margin:0;}
.hero .yr{font-family:var(--mono);font-size:12px;color:var(--dust);margin:12px 0 0;letter-spacing:.06em;}
.hero .hbadges{margin:6px 0 0;}
.hero .blurb{font-size:15px;color:var(--dust);margin:12px 0 0;line-height:1.5;}
.heroacts{display:flex;gap:9px;margin-top:18px;}
.heroacts button{flex:1;min-height:46px;border-radius:11px;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;}
.heroacts .go{background:var(--bone);color:var(--ink);}
.heroacts .no{border:1px solid var(--line2);color:var(--dust);flex:0 0 38%;}
.queue{margin-top:26px;}
.qhead{font-family:var(--mono);font-size:10px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);margin:0 0 12px;}
.qitem{display:flex;gap:12px;align-items:baseline;padding:11px 0;border-top:1px solid var(--line);width:100%;text-align:left;flex-wrap:wrap;}
.qitem:active{background:var(--card2);}
.qpeek{flex:0 0 100%;display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:8px 0 1px 24px;}
.qpeek .qg{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);}
.activity{margin-top:26px;border:1px solid var(--line);border-radius:12px;background:var(--sunk);padding:0 13px 6px;}
.activity .qhead{margin:13px 0 2px;}
.arow{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line);}
.arow:first-of-type{border-top:0;}

.arow .at{flex:1;min-width:0;font-family:var(--disp);font-weight:400;letter-spacing:.025em;
  text-transform:uppercase;font-size:15px;line-height:1.15;color:var(--dim);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.arow .stars{flex:none;margin:0;}
.arow .stars button{width:20px;height:26px;font-size:13px;}
.arow .tick{width:24px;height:24px;font-size:11px;align-self:start;margin-top:2px;background:var(--bone);border-color:var(--bone);color:var(--ink);}
.herorow{display:flex;align-items:center;gap:9px;margin:13px 0 0;}
.herorow .herorate{flex:1;min-width:0;}
.herorow .linkrow{flex:0 0 38%;justify-content:flex-start;margin-top:0;}
.herorow .lnk{font-size:9px;letter-spacing:.04em;padding:10px 10px;}
@media (max-width:360px){
  .herorow{display:block;}
  .herorow .linkrow{margin-top:10px;justify-content:flex-start;}
}

 films:[
 {i:"batman-year-one-2011",t:"Batman: Year One",y:2011,e:2,lo:1,d:"Frank Miller's origin, adapted almost panel for panel. Half of it is Jim Gordon's story.",b:["e"]},
 {i:"dc-showcase-catwoman-2011",t:"DC Showcase: Catwoman",y:2011,e:0,out:"none",d:"A fifteen-minute Paul Dini short packaged with Year One, picking Selina\u2019s thread back up with Eliza Dushku returning to the role. Batman sits it out entirely.",b:["s"],o:1},
 {i:"batman-the-killing-joke-2016",t:"Batman: The Killing Joke",y:2016,e:3,lo:28,d:"Alan Moore's Joker origin. The 25-minute Batgirl prologue is divisive; the adaptation proper starts after it.",b:["m"]},
 {i:"batman-death-in-the-family-2020",t:"Batman: Death in the Family",y:2020,e:4,lo:1,d:"An interactive branching film that rewinds to Jason Todd's death and lets you choose what happens instead. A direct companion to Under the Red Hood.",b:["c"]},
 {i:"batman-under-the-red-hood-2010",t:"Batman: Under the Red Hood",y:2010,e:4,lo:2,d:"The best of the standalones. A dead Robin, a new player in Gotham, and the one question Bruce cannot answer.",b:["e"]},
 {i:"the-dark-knight-returns-part-one-2012",t:"The Dark Knight Returns \u2014 Part One",y:2012,e:9,lo:1,d:"Bruce at fifty-five, retired a decade, pulling the cowl back on for a Gotham that has rotted through.",b:["e"]},
 {i:"the-dark-knight-returns-part-two-2013",t:"The Dark Knight Returns \u2014 Part Two",y:2013,e:9,lo:2,d:"The Joker wakes up and Superman comes to Gotham. One film in two halves \u2014 watch them back to back.",b:["e","m"]},
 {i:"the-dark-knight-returns-deluxe-edition-2013",t:"The Dark Knight Returns \u2014 Deluxe Edition",y:2013,e:9,lo:3,d:"Both parts recut into one R-rated feature. Only worth it on a rewatch.",b:["m"],o:1}]},

{n:"06",name:"Tomorrowverse",
 note:"A planned ten-film run, 2020\u20132024, closed out by the Crisis trilogy. Jensen Ackles is its Batman from The Long Halloween onward \u2014 he leads that and Warworld, and runs through all of Crisis. The films that open the run have no Batman in them at all; they are here because the run does not make sense without them.",
 films:[
 {i:"superman-man-of-tomorrow-2020",t:"Superman: Man of Tomorrow",y:2020,e:7,lo:36,d:"The run's opener. No Batman \u2014 included so the timeline makes sense.",o:1},
 {i:"justice-society-world-war-ii-2021",t:"Justice Society: World War II",y:2021,e:7,lo:37,d:"A 1940s detour with the JSA. No Batman \u2014 it is here because the run it belongs to is.",o:1},
 {i:"batman-the-long-halloween-part-one-2021",t:"Batman: The Long Halloween \u2014 Part One",y:2021,e:2,lo:13,d:"A killer who only strikes on holidays, working through the Falcone family. Set in Batman's second year, and the best-looking film in the whole line.",b:["e","m"]},
 {i:"batman-the-long-halloween-part-two-2021",t:"Batman: The Long Halloween \u2014 Part Two",y:2021,e:2,lo:14,d:"The solution, and the birth of Two-Face.",b:["e","m"]},
 {i:"the-long-halloween-deluxe-edition-2022",t:"The Long Halloween \u2014 Deluxe Edition",y:2022,e:2,lo:15,d:"Both parts recut into one R-rated feature with restored violence.",b:["m"],o:1},
 {i:"green-lantern-beware-my-power-2022",t:"Green Lantern: Beware My Power",y:2022,e:7,lo:38,d:"John Stewart's introduction to the run. No Batman in it.",o:1},
 {i:"legion-of-super-heroes-2023",t:"Legion of Super-Heroes",y:2023,e:7,lo:39,d:"Supergirl in the 31st century. No Batman in it.",o:1},
 {i:"justice-league-warworld-2023",t:"Justice League: Warworld",y:2023,e:7,lo:40,d:"Batman, Superman and Wonder Woman trapped in a loop of pulp genre worlds \u2014 western, noir, sword and sorcery. Batman is one of the three leads."},
 {i:"crisis-on-infinite-earths-part-one-2024",t:"Crisis on Infinite Earths \u2014 Part One",y:2024,e:7,lo:41,d:"The Anti-Monitor starts erasing realities and the multiverse's heroes are pulled together."},
 {i:"crisis-on-infinite-earths-part-two-2024",t:"Crisis on Infinite Earths \u2014 Part Two",y:2024,e:7,lo:42,d:"The shadow demons arrive. The middle chapter is the weakest of the three."},
 {i:"crisis-on-infinite-earths-part-three-2024",t:"Crisis on Infinite Earths \u2014 Part Three",y:2024,e:7,lo:43,d:"The last stand, and the end of the Tomorrowverse."}]},

{n:"07",name:"Standalone Films",bag:1,
 note:"Self-contained films, each a different answer to the question of what Batman is for. Connected to nothing and to each other \u2014 with one exception, the two RWBY halves, which are one film cut in two. \u2014 no order between these; start anywhere.",
 films:[
 {i:"batman-gotham-knight-2008",t:"Batman: Gotham Knight",y:2008,e:2,lo:3,d:"Six anime shorts by six studios, made to sit between Batman Begins and The Dark Knight. Later contradicted by those films, so treat it as its own thing."},
 {i:"batman-strange-days-2014",t:"Batman: Strange Days",y:2014,e:2,lo:8,d:"A three-minute Bruce Timm short for Batman's 75th, drawn in the 1939 style. Hugo Strange, and almost no dialogue.",b:["s"],o:1},
 {i:"batman-of-shanghai-2012",t:"Batman of Shanghai",sub:"3 shorts",y:2012,e:2,lo:7,d:"Three DC Nation shorts, ink-brush animation, Batman in 1930s Shanghai. Almost no dialogue and none of it needed.",b:["s"],o:1},
 {i:"batman-beyond-2014",t:"Batman Beyond",sub:"DC Nation short",y:2014,e:10,lo:1,d:"Darwyn Cooke\u2019s 75th-anniversary short, made for the same slot as Strange Days. Three minutes of Terry McGinnis drawn the way Cooke drew everything.",b:["s"],o:1},
 {i:"batman-gotham-by-gaslight-2018",t:"Batman: Gotham by Gaslight",y:2018,e:2,lo:6,d:"Victorian Gotham. Batman hunts Jack the Ripper. Bruce Greenwood back in the cowl.",b:["e","m"]},
 {i:"batman-vs-teenage-mutant-ninja-turtles-2019",t:"Batman vs. Teenage Mutant Ninja Turtles",y:2019,e:8,lo:18,d:"Exactly what it says, and far better than it has any right to be."},
 {i:"superman-red-son-2020",t:"Superman: Red Son",y:2020,e:0,out:"who",d:"Superman's rocket lands in Ukraine instead. There is a Batman in it, and he is a Soviet dissident in a ushanka.",o:1},
 {i:"batman-soul-of-the-dragon-2021",t:"Batman: Soul of the Dragon",y:2021,e:2,lo:20,d:"A 1970s martial-arts picture with Batman in it. Built around Bruce's training years under a master sensei.",b:["m"],},
 {i:"injustice-2021",t:"Injustice",y:2021,e:7,lo:35,d:"The Joker kills Lois, Superman turns tyrant, and Batman leads the resistance against him. Anson Mount's first go at the cowl.",b:["m"]},
 {i:"catwoman-hunted-2022",t:"Catwoman: Hunted",y:2022,e:0,out:"none",d:"Anime-styled Selina heist picture. Batwoman is the foil; Batman himself sits this one out.",o:1},
 {i:"battle-of-the-super-sons-2022",t:"Battle of the Super Sons",y:2022,e:8,lo:21,d:"Damian and Jon Kent team up. CG-animated and aimed younger.",o:1},
 {i:"the-doom-that-came-to-gotham-2023",t:"The Doom That Came to Gotham",y:2023,e:3,lo:6,d:"Mignola's Lovecraftian Gotham, 1920s. Bruce returns from an Antarctic expedition with something following him.",b:["m"]},
 {i:"justice-league-x-rwby-part-one-2023",t:"Justice League x RWBY \u2014 Part One",y:2023,e:7,lo:33,d:"The League turned into teenagers in the world of Remnant. A crossover with a very specific audience.",o:1},
 {i:"justice-league-x-rwby-part-two-2024",t:"Justice League x RWBY \u2014 Part Two",y:2024,e:7,lo:34,d:"The second half of that crossover.",o:1},
 {i:"suicide-squad-isekai-complete-series-2024",t:"Suicide Squad Isekai",sub:"Complete series",y:2024,ep:10,k:"tv",e:0,out:"none",d:"Task Force X dropped into a sword-and-sorcery anime world. Batman never appears in it \u2014 Katana takes Harley down in the Gotham prologue \u2014 but the city and its people are where it starts.",b:["m"],o:1},
 {i:"aztec-batman-clash-of-empires-2025",t:"Aztec Batman: Clash of Empires",y:2025,e:0,out:"who",d:"Yohualli Coatl in the Aztec empire under Spanish invasion. A genuine reimagining, not a reskin."},
 {i:"dynamic-duo-2028",t:"Dynamic Duo",y:2028,e:3,lo:1,d:"Theatrical, from Swaybox \u2014 puppetry mixed with CG. The origin of Dick Grayson and Jason Todd, and the friendship that breaks between them. 30 June 2028.",b:["u"]}]},

{n:"08",name:"The Batman (2004)",
 note:"Its own continuity with a younger, more athletic Bruce, a stylised Gotham and radically redesigned rogues. Starts in Batman\u2019s third year and gradually builds the family around him.",
 films:[
 {i:"the-batman-season-1-2004",t:"The Batman",sub:"Season 1",y:2004,ep:13,k:"tv",e:2,lo:21,d:"Year three. Batman still works alone and the police still want him arrested. Rino Romano in the cowl.",o:1},
 {i:"the-batman-season-2-2005",t:"The Batman",sub:"Season 2",y:2005,ep:13,k:"tv",e:2,lo:22,d:"The rogues gallery fills out and Ethan Bennett\u2019s slow turn into Clayface plays out.",o:1},
 {i:"the-batman-season-3-2005",t:"The Batman",sub:"Season 3",y:2005,ep:13,k:"tv",e:3,lo:22,d:"Batgirl arrives and the tone lightens considerably.",o:1},
 {i:"the-batman-vs-dracula-2005",t:"The Batman vs. Dracula",y:2005,e:3,lo:23,d:"The series\u2019 feature-length entry, and startlingly dark for a kids\u2019 tie-in. Dracula is played completely straight."},
 {i:"the-batman-season-4-2006",t:"The Batman",sub:"Season 4",y:2006,ep:13,k:"tv",e:3,lo:24,d:"Robin joins, and the Bat-family finally assembles.",o:1},
 {i:"the-batman-season-5-2007",t:"The Batman",sub:"Season 5",y:2007,ep:13,k:"tv",e:6,lo:20,d:"The Justice League turns up for the final run, into 2008.",o:1}]},

{n:"09",name:"Beware the Batman",
 note:"CG-animated, cancelled early, and quietly one of the most interesting takes \u2014 no Robin, an ex-MI6 Alfred, Katana as the partner, and deep-cut villains instead of the usual rogues.",
 films:[
 {i:"beware-the-batman-complete-series-2013",t:"Beware the Batman",sub:"Complete series",y:2013,ep:26,k:"tv",e:2,lo:9,d:"Early-career Bruce with Anthony Ruivivar in the cowl. Professor Pyg, Anarky and Magpie over Joker and Penguin. Ends on an unresolved note.",o:1}]},

{n:"10",name:"Caped Crusader",
 note:"Bruce Timm returns, with J.J. Abrams and Matt Reeves producing. A 1940s noir reimagining that strips out the gadgets in favour of detective work. Not connected to the DCAU.",
 films:[
 {i:"batman-caped-crusader-season-1-2024",t:"Batman: Caped Crusader",sub:"Season 1",y:2024,ep:10,k:"tv",e:2,lo:4,d:"Batman\u2019s early days in a period-accurate Gotham. Hamish Linklater in the cowl, Minnie Driver as Oswalda Cobblepot.",b:["e"],o:1},
 {i:"batman-caped-crusader-season-2-2026",t:"Batman: Caped Crusader",sub:"Season 2",y:2026,ep:10,k:"tv",e:2,lo:5,d:"The \u2018year one-and-a-half\u2019 phase, introducing the Riddler, Carrie Kelley, Roxy Rocket and this world\u2019s Joker. All ten episodes landed 31 July 2026.",b:[],o:1}]},

{n:"11",name:"The Dark Knight Trilogy",fmt:"live",
 note:"Christopher Nolan's three films, one continuous story told over seven years. Grounded, procedural, and the reason a generation thinks Batman should whisper.",
 films:[
 {i:"batman-begins-2005",t:"Batman Begins",y:2005,e:2,lo:2,d:"The training film. Bruce learns to fight in a mountain prison, comes home, and turns the thing he is afraid of into a costume.",b:["e"]},
 {i:"the-dark-knight-2008",t:"The Dark Knight",y:2008,e:2,lo:16,d:"The one that made everyone else stop trying. A man in makeup sets out to prove the city was always one bad day away from itself.",b:["e","m"]},
 {i:"the-dark-knight-rises-2012",t:"The Dark Knight Rises",y:2012,e:5,lo:4,d:"Eight years off the roof, and a city held hostage. The trilogy closes on the thing it opened with.",b:[]}]},

{n:"12",name:"The Batman Epic Crime Saga",fmt:"live",
 note:"Matt Reeves' Gotham, and the newest live-action continuity. Watch the film first \u2014 the series opens the week it ends.",
 films:[
 {i:"the-batman-2022",t:"The Batman",y:2022,e:2,lo:10,d:"Year two, and he still signs his name Vengeance. Gotham as a rain-soaked crime scene, worked by a detective who is barely holding.",b:["e","m"]},
 {i:"the-penguin-season-1-2024",t:"The Penguin",sub:"Season 1",y:2024,ep:8,k:"tv",e:2,lo:11,d:"One week after the flood, and the underworld has a vacancy. Batman is barely in it \u2014 this is the city's story, told from the bottom of it.",b:["m"]},
 {i:"the-batman-part-ii-2028",t:"The Batman: Part II",y:2028,e:2,lo:12,d:"Year three. Nothing more is known, and nothing more should be.",b:["u"]}]},

{n:"13",name:"The Burton / Schumacher Films",fmt:"live",
 note:"Four films, two directors, one continuity  \u2014  and the tone changes completely halfway through. Keaton's Batman returns thirty years later in The Flash, which is filed under The DC Extended Universe.",
 films:[
 {i:"batman-1989",t:"Batman",y:1989,e:2,lo:17,d:"The film that proved Gotham could be built rather than found. Gothic, purple, and deeply strange about its own hero.",b:["e"]},
 {i:"batman-returns-1992",t:"Batman Returns",y:1992,e:2,lo:18,d:"Burton at his least supervised. Snow, sewers, and three broken people in animal suits.",b:[]},
 {i:"batman-forever-1995",t:"Batman Forever",y:1995,e:3,lo:2,d:"The lights come on and Robin arrives. Louder, brighter, and only half as odd as what came before it.",b:[],o:1},
 {i:"batman-and-robin-1997",t:"Batman & Robin",y:1997,e:3,lo:3,d:"Ice puns and neon. Famous for how badly it landed, and still the same continuity as the two that opened it.",b:[],o:1}]},

{n:"14",name:"The New Scooby-Doo Movies",
 note:"Two 1972 episodes of The New Scooby-Doo Movies, stitched into a feature. The other Scooby crossover in the catalogue is filed with The Brave and the Bold, whose continuity it belongs to.",
 films:[
 {i:"scooby-doo-meets-batman-2002",t:"Scooby-Doo Meets Batman",y:2002,e:3,lo:15,d:"Two 1972 episodes of The New Scooby-Doo Movies stitched into a feature. Batman and Robin play it completely straight, which is the joke and also why it works.",o:1}]},

{n:"15",name:"The LEGO Movieverse",
 note:"The LEGO feature line \u2014 three theatrical films, plus the shorts made for one of their home releases. Will Arnett's Batman debuts as a supporting joke and gets promoted to leading man. Confirmed separate from the direct-to-video LEGO DC line.",
 films:[
 {i:"the-lego-movie-2014",t:"The LEGO Movie",y:2014,e:0,out:"flat",d:"Where this Batman is introduced. Not his film, but it sets up everything the next one takes apart.",o:1},
 {i:"the-lego-batman-movie-2017",t:"The LEGO Batman Movie",y:2017,e:3,lo:4,d:"The sharpest Batman parody ever made, and quietly one of the most sincere films about him. Works even if you skip the other two.",b:["e"]},
 {i:"the-lego-batman-movie-shorts-2017",t:"The LEGO Batman Movie",sub:"4 bonus shorts",y:2017,e:3,lo:5,d:"Four shorts made for the home release. \u201cCooking with Alfred\u201d is the reason to bother; it is also the one that shows the household after Dick moves in.",b:["s"],o:1},
 {i:"the-lego-movie-2-the-second-part-2019",t:"The LEGO Movie 2: The Second Part",y:2019,e:0,out:"flat",d:"Arnett's Batman gets a subplot of his own here.",o:1}]},

{n:"16",name:"The Filmation Years",
 note:"Batman\u2019s first animated appearances, made on the back of the Adam West show. Stiff, cheap and charming, and historically the start of everything.",
 films:[
 {i:"the-adventures-of-batman-complete-series-1968",t:"The Adventures of Batman",sub:"Complete series",y:1968,ep:17,k:"tv",e:3,lo:14,d:"Batman\u2019s first solo cartoon, recut from The Batman/Superman Hour. Two 6-minute stories per episode, Olan Soule as Batman and Casey Kasem as Robin.",o:1},
 {i:"the-new-adventures-of-batman-complete-series-1977",t:"The New Adventures of Batman",sub:"Complete series",y:1977,ep:16,k:"tv",e:3,lo:16,d:"Adam West and Burt Ward return to voice their roles, joined by Batgirl and the dimension-hopping imp Bat-Mite.",o:1}]},

{n:"17",name:"Teen Titans",
 note:"The 2003 series and the film that closes it. Robin is Dick Grayson and Batman stays off screen \u2014 shaping him from a distance, which is most of what the show is about.",
 films:[
 {i:"teen-titans-complete-series-2003",t:"Teen Titans",sub:"Complete series",y:2003,ep:65,k:"tv",e:3,lo:25,d:"Anime-influenced, surprisingly serious, and built around Robin\u2019s obsession with Slade. Five seasons to 2006.",o:1},
 {i:"teen-titans-trouble-in-tokyo-2006",t:"Teen Titans: Trouble in Tokyo",y:2006,e:3,lo:26,d:"Closes the 2003 series. Robin follows a case to Tokyo and spends the film failing not to be Batman.",o:1}]},

{n:"18",name:"Teen Titans Go!",
 note:"The 2013 comedy reboot, which shares character names with the 2003 series and nothing else. The crossover film puts both casts on one screen, which is the only reason it can be filed anywhere at all.",
 films:[
 {i:"teen-titans-go-all-seasons-2013",t:"Teen Titans Go!",sub:"All seasons",y:2013,ep:447,k:"tv",e:3,lo:27,d:"The comedy reboot, still running \u2014 four hundred and forty-seven eleven-minute episodes and counting. Batman turns up as a recurring punchline. Listed as one entry; nobody is ticking off four hundred of anything.",o:1},
 {i:"teen-titans-go-vs-teen-titans-2019",t:"Teen Titans Go! vs. Teen Titans",y:2019,e:0,out:"many",d:"The two casts meet. Mostly a joke at the reboot\u2019s expense, but the only place both versions share a screen.",o:1}]},

{n:"19",name:"DC Super Hero Girls",
 note:"Lauren Faust\u2019s Metropolis, where the heroes are teenagers with homework. An ensemble of six with Batgirl among them, and Bruce Wayne turns up often enough to matter.",
 films:[
 {i:"dc-super-hero-girls-complete-series-2019",t:"DC Super Hero Girls",sub:"Complete series",y:2019,ep:78,k:"tv",e:3,lo:17,d:"Seventy-eight episodes of the DC bench aged down to sixteen and written with real affection. The 2015 web series of the same name has no Batman in it and is not this.",o:1},
 {i:"teen-titans-go-dc-super-hero-girls-mayhem-in-the-multiverse-2022",t:"Mayhem in the Multiverse",sub:"with Teen Titans Go!",y:2022,e:3,lo:18,d:"A direct-to-video crossover, exactly as chaotic as that pairing sounds.",o:1}]},

{n:"20",name:"The Columbia Serials",bag:1,fmt:"live",
 note:"Two chapter serials, and the first time anyone put Batman on a screen. One made during the war and steeped in it, the other four years after. Cheap, strange, and the origin of two things the character never gave back: the Batcave, and an Alfred who looks like Alfred. \u2014 no order between these; start anywhere.",
 films:[
 {i:"batman-1943",t:"Batman",sub:"15 chapters",y:1943,e:3,lo:7,d:"Lewis Wilson under the first cowl ever filmed, fifteen chapters of it, in a 1943 that is very much on screen. Historically enormous; watch it knowing what it is.",b:[]},
 {i:"batman-and-robin-1949",t:"Batman and Robin",sub:"15 chapters",y:1949,e:3,lo:8,d:"Columbia\u2019s second run, six years on and cheaper for it. Robert Lowery in the cowl and a Gotham held together with stock footage.",b:[],o:1}]},

{n:"21",name:"Batman '66",fmt:"live",
 note:"Adam West\u2019s Gotham, entire: the series, the film shot between its first two seasons, the seven-minute pitch that gave the world Batgirl, two NBC specials that dragged it into 1979, and two animated films made fifty years later with the surviving cast. Batman vs. Two-Face was West\u2019s final performance as Batman.",
 films:[
 {i:"batman-complete-series-1966",t:"Batman",sub:"Complete series",y:1966,ep:120,k:"tv",e:3,lo:9,d:"One hundred and twenty episodes of primary colour and deadpan. The show that made Batman a household name, and then made him very hard to take seriously for twenty years \u2014 and it is still funnier than most of what came after.",b:["e"],o:1},
 {i:"batman-1966",t:"Batman",y:1966,e:3,lo:10,d:"Bright, square-jawed, and completely committed to the joke. A shark, a bomb nobody can put down, and the rarest thing in the catalogue: a Batman visibly having fun.",b:["e"],o:1},
 {i:"batgirl-1967",t:"Batgirl",sub:"Presentation film",y:1967,e:3,lo:11,d:"Seven and a half minutes made to sell ABC on Batgirl. West and Ward against Killer Moth, and Yvonne Craig arriving fully formed.",b:["s"],o:1},
 {i:"return-of-the-caped-crusaders-2016",t:"Return of the Caped Crusaders",fmt:"anim",y:2016,e:3,lo:12,d:"A pitch-perfect revival of the camp \u2014 both parodying the show and completely sincere about it."},
 {i:"batman-vs-two-face-2017",t:"Batman vs. Two-Face",fmt:"anim",y:2017,e:3,lo:13,d:"William Shatner as Two-Face, a role the 1966 series never got to make."},
 {i:"legends-of-the-superheroes-1979",t:"Legends of the Superheroes",sub:"2 specials",y:1979,e:6,lo:5,d:"Two NBC specials from the far side of the 1970s \u2014 a challenge, then a celebrity roast. West and Ward back in costume, with a laugh track over everything.",o:1}]},

{n:"22",name:"Batman Unlimited",
 note:"Three films and thirty-three web shorts, built around a Mattel toyline. Aimed young, brisk, and strictly for completionists.",
 films:[
 {i:"batman-unlimited-animal-instincts-2015",t:"Batman Unlimited: Animal Instincts",y:2015,e:4,lo:8,d:"Animal-themed rogues take Gotham.",o:1},
 {i:"batman-unlimited-monster-mayhem-2015",t:"Batman Unlimited: Monster Mayhem",y:2015,e:4,lo:9,d:"The Joker recruits the classic monsters.",o:1},
 {i:"batman-unlimited-shorts-2015",t:"Batman Unlimited",sub:"33 shorts",y:2015,e:4,lo:10,d:"Thirty-three web shorts running alongside the films \u2014 twenty-two in 2015 and eleven more the year after. Two or three minutes each, built to sell toys, and complete stories anyway.",b:["s"],o:1},
 {i:"batman-unlimited-mechs-vs-mutants-2016",t:"Batman Unlimited: Mechs vs. Mutants",y:2016,e:4,lo:11,d:"Giant robots, as promised.",o:1}]},

{n:"23",name:"Batwheels",
 note:"Preschool CG about the Bat-vehicles gaining sentience. Ethan Hawke voices Batman. Included for completeness \u2014 it is genuinely for small children.",
 films:[
 {i:"batwheels-season-1-2022",t:"Batwheels",sub:"Season 1",y:2022,ep:37,k:"tv",e:4,lo:14,d:"The Batcomputer brings the vehicles to life while Batman is captured.",o:1},
 {i:"batwheels-season-2-2024",t:"Batwheels",sub:"Season 2",y:2024,ep:37,k:"tv",e:4,lo:15,d:"More of the same, with Nightwing\u2019s bike added to the garage.",o:1},
 {i:"batwheels-season-3-2025",t:"Batwheels",sub:"Season 3",y:2025,ep:19,k:"tv",e:4,lo:16,d:"Nineteen episodes released in four batches across seven months, finishing in July 2026.",o:1}]},

{n:"24",name:"Titans",fmt:"live",
 note:"Dick Grayson out from under the shadow and not coping. Bruce Wayne recurs on screen from the second season \u2014 Iain Glen \u2014 but the cowl is kept almost entirely out of shot, on purpose.",
 films:[
 {i:"titans-complete-series-2018",t:"Titans",sub:"Complete series",y:2018,ep:49,k:"tv",e:4,lo:13,d:"Forty-nine episodes across four seasons, opening with a Robin who has had enough. Bleak where the animated Titans was bright, and it knows the comparison is being made.",b:["m"],o:1}]},

{n:"25",name:"Arkhamverse",
 note:"The Arkham games\u2019 continuity, and the only screen entry it has. It sits between Origins and Asylum, and it is a Suicide Squad film with Batman in it rather than a Batman film with the Squad in it.",
 films:[
 {i:"batman-assault-on-arkham-2014",t:"Batman: Assault on Arkham",y:2014,e:4,lo:3,d:"Set in the Arkham games' world and secretly one of the best Suicide Squad films. Batman is the antagonist for most of it.",b:["m"]}]},

{n:"26",name:"Knightfall Trilogy",
 note:"The current release. Three films adapting the 1993 saga \u2014 Bane breaks the Bat, a replacement takes the cowl, Bruce fights to take it back. Anson Mount as Batman.",
 films:[
 {i:"batman-knightfall-part-1-2026",t:"Batman: Knightfall \u2014 Part 1",y:2026,e:5,lo:1,d:"Bane empties Arkham onto Gotham's streets and lets exhaustion do the rest. Digital 25 August 2026, disc 8 September.",b:["m","u"]},
 {i:"knightfall-part-2-knightquest-2026",t:"Knightfall \u2014 Part 2: Knightquest",y:2026,e:5,lo:2,d:"Jean-Paul Valley wears the cowl, and Gotham finds out what a Batman without restraint looks like. Late 2026.",b:["m","u"]},
 {i:"knightfall-part-3-knightsend-2027",t:"Knightfall \u2014 Part 3: KnightsEnd",y:2027,e:5,lo:3,d:"Bruce comes back for what is his. Early 2027.",b:["m","u"]}]},

{n:"27",name:"Standalone Justice League Films",bag:1,
 note:"League films belonging to no continuity. Doom is a Batman story wearing a Justice League jacket \u2014 the plot is his own contingency plans turned against the team \u2014 and Crisis on Two Earths is built around his opposite number; in the rest he ranges from lead to one of the crowd. \u2014 no order between these; start anywhere.",
 films:[
 {i:"justice-league-the-new-frontier-2008",t:"Justice League: The New Frontier",y:2008,e:7,lo:1,d:"Darwyn Cooke's 1950s DC. Batman starts as a paranoid urban legend and grows into something else. Jeremy Sisto in the cowl."},
 {i:"justice-league-crisis-on-two-earths-2010",t:"Justice League: Crisis on Two Earths",y:2010,e:7,lo:21,d:"A parallel Earth where the League are criminals. The villain is Owlman \u2014 Batman's counterpart, and the best thing in it."},
 {i:"justice-league-doom-2012",t:"Justice League: Doom",y:2012,e:7,lo:22,d:"Vandal Savage steals Batman's files on how to kill every one of his friends, then uses them. Conroy's Batman, and one of the strongest of the whole line.",b:["e"]},
 {i:"jla-adventures-trapped-in-time-2014",t:"JLA Adventures: Trapped in Time",y:2014,e:6,lo:11,d:"A retro-styled all-ages one-off. Minor, but it exists.",o:1},
 {i:"justice-league-gods-and-monsters-2015",t:"Justice League: Gods and Monsters",y:2015,e:0,out:"who",d:"A Timm-created alternate universe where Batman is Kirk Langstrom, a vampire. Radically different and worth it for that alone.",b:["m"]},
 {i:"justice-league-gods-and-monsters-chronicles-2015",t:"Justice League: Gods and Monsters Chronicles",sub:"3 shorts",y:2015,e:0,out:"who",d:"Three shorts made alongside the feature and set in the same broken world. Bruce Timm again, and sharper in five minutes than most things manage in ninety.",b:["s"],o:1},
 {i:"justice-league-vs-the-fatal-five-2019",t:"Justice League vs. the Fatal Five",y:2019,e:7,lo:14,d:"Made in the DCAU house style with Conroy and several returning voices. Whether it is actually in that continuity is argued endlessly.",o:1}]},

{n:"28",name:"LEGO Batman: DC Super Heroes",
 note:"One film, adapting the LEGO Batman 2 video game, and connected to nothing on either side of it. Its own cast and its own Robin \u2014 Tim Drake, where the direct-to-video line that came after uses Damian.",
 films:[
 {i:"lego-batman-dc-super-heroes-unite-2013",t:"LEGO Batman: DC Super Heroes Unite",y:2013,e:6,lo:12,d:"Adapted from the LEGO Batman 2 video game, with Troy Baker as Batman and Tim Drake in the car."}]},

{n:"29",name:"Batman in Supporting Roles",bag:1,
 note:"Films where Batman is a supporting player, a punchline, or a guest in someone else's comedy. Included for completeness. \u2014 no order between these; start anywhere.",
 films:[
 {i:"dc-super-heroes-vs-eagle-talon-2017",t:"DC Super Heroes vs. Eagle Talon",y:2017,e:7,lo:31,d:"A Japanese comedy crossover where a low-budget villain org investigates what is wrong with Batman, and keeps breaking the fourth wall about the licensing fee.",o:1},
 {i:"teen-titans-go-to-the-movies-2018",t:"Teen Titans Go! To the Movies",y:2018,e:6,lo:19,d:"Robin wants a movie; Batman gets mocked throughout.",o:1},
 {i:"dc-league-of-super-pets-2022",t:"DC League of Super-Pets",y:2022,e:7,lo:32,d:"Keanu Reeves voices a deadpan Batman opposite Ace the Bat-Hound.",o:1}]},

{n:"30",name:"Super Friends",
 note:"Hanna-Barbera\u2019s Saturday-morning Justice League, retitled almost every year across thirteen years. Batman is a core member throughout. Its creators considered all incarnations one show.",
 films:[
 {i:"super-friends-1973-1973",t:"Super Friends",sub:"1973",y:1973,ep:16,k:"tv",e:6,lo:1,d:"The original hour-long run, with Wendy, Marvin and Wonder Dog in tow.",o:1},
 {i:"the-all-new-super-friends-hour-1977-1977",t:"The All-New Super Friends Hour",sub:"1977",y:1977,ep:15,k:"tv",e:6,lo:2,d:"The Wonder Twins arrive and the format splits into segments.",o:1},
 {i:"challenge-of-the-super-friends-1978-1978",t:"Challenge of the Super Friends",sub:"1978",y:1978,ep:16,k:"tv",e:6,lo:3,d:"The best-remembered season: the Legion of Doom and their swamp headquarters.",b:["e"],o:1},
 {i:"the-world-s-greatest-superfriends-1979-1979",t:"The World\u2019s Greatest SuperFriends",sub:"1979",y:1979,ep:8,k:"tv",e:6,lo:4,d:"Back to hour-long stories for a short run.",o:1},
 {i:"super-friends-1980-1980",t:"Super Friends",sub:"1980",y:1980,ep:8,k:"tv",e:6,lo:6,d:"Shorter format, expanded hero roster.",o:1},
 {i:"super-friends-1981-1981",t:"Super Friends",sub:"1981",y:1981,ep:6,k:"tv",e:6,lo:7,d:"A six-episode season.",o:1},
 {i:"super-friends-1983-1983",t:"Super Friends",sub:"1983",y:1983,ep:8,k:"tv",e:6,lo:8,d:"Often called the lost episodes \u2014 some went unaired in the US for years.",o:1},
 {i:"the-legendary-super-powers-show-1984-1984",t:"The Legendary Super Powers Show",sub:"1984",y:1984,ep:8,k:"tv",e:6,lo:9,d:"Toyline tie-in era. Darkseid becomes the recurring threat.",o:1},
 {i:"the-super-powers-team-galactic-guardians-198-1985",t:"The Super Powers Team: Galactic Guardians",sub:"1985",y:1985,ep:8,k:"tv",e:6,lo:10,d:"The final season, and the one that finally animates Batman\u2019s origin.",o:1}]},

{n:"31",name:"The Brave and the Bold (2008)",
 note:"Diedrich Bader\u2019s Batman in a bright silver-age world, teaming up with a different obscure hero every week. Wildly different in tone from everything around it, and beloved for exactly that.",
 films:[
 {i:"batman-the-brave-and-the-bold-season-1-2008",t:"Batman: The Brave and the Bold",sub:"Season 1",y:2008,ep:26,k:"tv",e:6,lo:15,d:"Team-ups with Blue Beetle, Aquaman, Plastic Man and dozens more. Aquaman alone is worth it.",b:["e"],o:1},
 {i:"batman-the-brave-and-the-bold-season-2-2010",t:"Batman: The Brave and the Bold",sub:"Season 2",y:2010,ep:26,k:"tv",e:6,lo:16,d:"Includes the musical episode \u2018Mayhem of the Music Meister\u2019 with Neil Patrick Harris.",o:1},
 {i:"batman-the-brave-and-the-bold-season-3-2011",t:"Batman: The Brave and the Bold",sub:"Season 3",y:2011,ep:13,k:"tv",e:6,lo:17,d:"The final run, ending with a fourth-wall-breaking farewell.",o:1},
 {i:"scooby-doo-and-batman-the-brave-and-the-bold-2018",t:"Scooby-Doo and Batman: The Brave and the Bold",y:2018,e:6,lo:18,d:"Bader\u2019s Batman meets Mystery Inc. Which implies things about both franchises best left alone."}]},

{n:"32",name:"Robot Chicken DC Comics",
 note:"Three licensed stop-motion specials, made with DC\u2019s blessing and none of its dignity. Batman is in all of it and none of it counts.",
 films:[
 {i:"robot-chicken-dc-comics-special-2012",t:"Robot Chicken DC Comics Special",y:2012,e:6,lo:13,d:"Twenty-two minutes of the DC universe played entirely for the joke, with Batman as the punchline more often than not.",b:["m","s"],o:1},
 {i:"robot-chicken-dc-comics-special-ii-2014",t:"Robot Chicken DC Comics Special II",sub:"Villains in Paradise",y:2014,e:6,lo:14,d:"The rogues take a holiday. Meaner than the first and funnier for it.",b:["m","s"],o:1},
 {i:"robot-chicken-dc-comics-special-iii-2015",t:"Robot Chicken DC Comics Special III",sub:"Magical Friendship",y:2015,e:0,out:"many",d:"The last of the three, and the one that finally lets Batman sing.",b:["m","s"],o:1}]},

{n:"33",name:"Superman/Batman Duology",
 note:"A two-film continuity of its own, adapting the first two arcs of Jeph Loeb's Superman/Batman run. Conroy and Tim Daly return, but this is not the DCAU.",
 films:[
 {i:"superman-batman-public-enemies-2009",t:"Superman/Batman: Public Enemies",y:2009,e:7,lo:19,d:"Lex Luthor is president and has put a bounty on Superman's head. Loud, blunt, very fun."},
 {i:"superman-batman-apocalypse-2010",t:"Superman/Batman: Apocalypse",y:2010,e:7,lo:20,d:"Supergirl arrives on Earth and Darkseid wants her. Batman plays the sceptic."}]},

{n:"34",name:"DC Animated Movie Universe",
 note:"Sixteen films running 2013\u20132020, Jason O'Mara as Batman, Damian Wayne as the spine. Four are Batman-led; the rest carry the plot between them.",
 films:[
 {i:"justice-league-the-flashpoint-paradox-2013",t:"Justice League: The Flashpoint Paradox",y:2013,e:7,lo:2,d:"The reset that starts the whole timeline.",o:1},
 {i:"justice-league-war-2014",t:"Justice League: War",y:2014,e:7,lo:3,d:"The team forms against Darkseid.",o:1},
 {i:"son-of-batman-2014",t:"Son of Batman",y:2014,e:8,lo:1,d:"Damian Wayne arrives \u2014 assassin-raised, ten years old, furious. Start here for the Batman thread."},
 {i:"justice-league-throne-of-atlantis-2015",t:"Justice League: Throne of Atlantis",y:2015,e:8,lo:2,d:"Aquaman's introduction.",o:1},
 {i:"batman-vs-robin-2015",t:"Batman vs. Robin",y:2015,e:8,lo:3,d:"Damian tests the no-kill rule while the Court of Owls closes in on Gotham."},
 {i:"batman-bad-blood-2016",t:"Batman: Bad Blood",y:2016,e:8,lo:4,d:"Bruce goes missing. Dick takes the cowl, Batwoman and Batwing arrive, the family assembles."},
 {i:"justice-league-vs-teen-titans-2016",t:"Justice League vs. Teen Titans",y:2016,e:8,lo:5,d:"Damian joins the Titans.",o:1},
 {i:"justice-league-dark-2017",t:"Justice League Dark",y:2017,e:8,lo:6,d:"Batman assembles the occult team under Constantine. More Batman in it than you would expect.",b:["m"],o:1},
 {i:"teen-titans-the-judas-contract-2017",t:"Teen Titans: The Judas Contract",y:2017,e:8,lo:7,d:"Deathstroke and Terra.",o:1},
 {i:"suicide-squad-hell-to-pay-2018",t:"Suicide Squad: Hell to Pay",y:2018,e:8,lo:8,d:"Task Force X side story.",b:["m"],o:1},
 {i:"the-death-of-superman-2018",t:"The Death of Superman",y:2018,e:8,lo:9,d:"Doomsday arrives.",o:1},
 {i:"reign-of-the-supermen-2019",t:"Reign of the Supermen",y:2019,e:8,lo:10,d:"The aftermath of Superman's death.",o:1},
 {i:"constantine-city-of-demons-2018",t:"Constantine: City of Demons",y:2018,e:8,lo:11,d:"Constantine solo, and no Batman \u2014 a link in the run rather than a stop on it.",o:1},
 {i:"batman-hush-2019",t:"Batman: Hush",y:2019,e:8,lo:12,d:"A loose take on the Loeb and Lee epic. A bandaged stranger who knows everything Bruce knows."},
 {i:"wonder-woman-bloodlines-2019",t:"Wonder Woman: Bloodlines",y:2019,e:8,lo:13,d:"Diana's origin, late in the run. No Batman in it.",o:1},
 {i:"justice-league-dark-apokolips-war-2020",t:"Justice League Dark: Apokolips War",y:2020,e:8,lo:14,d:"The finale, and it earns its reputation for being brutal.",b:["m"],o:1}]},

{n:"35",name:"LEGO DC Direct-to-Video",bag:1,
 note:"Nine LEGO films sharing a style rather than a story \u2014 no order between these; start anywhere. A separate line that shares nothing with the theatrical movies. Troy Baker voices most of them. Three are Batman's \u2014 Be-Leaguered, Gotham City Breakout and Family Matters; the rest are League films he turns up in.",
 films:[
 {i:"lego-dc-comics-batman-be-leaguered-2014",t:"LEGO DC Comics: Batman Be-Leaguered",y:2014,e:7,lo:25,d:"A 22-minute special where Batman refuses to join the League. Slight, but Batman-centred.",b:["s"]},
 {i:"justice-league-vs-bizarro-league-2015",t:"Justice League vs. Bizarro League",y:2015,e:7,lo:26,d:"Bizarro gets his own world.",o:1},
 {i:"justice-league-attack-of-the-legion-of-doom-2015",t:"Justice League: Attack of the Legion of Doom",y:2015,e:7,lo:27,d:"Cyborg joins; the Legion forms.",o:1},
 {i:"justice-league-cosmic-clash-2016",t:"Justice League: Cosmic Clash",y:2016,e:7,lo:28,d:"Brainiac scatters the League through time.",o:1},
 {i:"justice-league-gotham-city-breakout-2016",t:"Justice League: Gotham City Breakout",y:2016,e:8,lo:15,d:"Batgirl and Nightwing force Batman to take a holiday while the League cover Gotham. The most Batman-forward of the line."},
 {i:"lego-dc-comics-super-heroes-the-flash-2018",t:"LEGO DC Comics Super Heroes: The Flash",y:2018,e:7,lo:29,d:"Barry stuck in a time loop.",o:1},
 {i:"aquaman-rage-of-atlantis-2018",t:"Aquaman: Rage of Atlantis",y:2018,e:8,lo:16,d:"Aquaman's turn.",o:1},
 {i:"lego-dc-batman-family-matters-2019",t:"LEGO DC Batman: Family Matters",y:2019,e:8,lo:17,d:"Someone is picking off the Bat-family. A whodunit in bricks."},
 {i:"lego-dc-shazam-magic-and-monsters-2020",t:"LEGO DC Shazam!: Magic and Monsters",y:2020,e:7,lo:30,d:"The last of the line.",o:1}]},

{n:"36",name:"Young Justice",
 note:"The sidekicks\u2019 show, and one of the most densely plotted things DC animation has produced. Batman is the League\u2019s strategist and Dick Grayson\u2019s arc runs the whole series.",
 films:[
 {i:"young-justice-season-1-2010",t:"Young Justice",sub:"Season 1",y:2010,ep:26,k:"tv",e:7,lo:15,d:"The covert team forms. Robin, Aqualad, Kid Flash, Superboy, Miss Martian, Artemis.",b:["e"],o:1},
 {i:"young-justice-season-2-invasion-2012",t:"Young Justice",sub:"Season 2: Invasion",y:2012,ep:20,k:"tv",e:7,lo:16,d:"A five-year time skip. Dick is Nightwing and running the team.",o:1},
 {i:"young-justice-season-3-outsiders-2019",t:"Young Justice",sub:"Season 3: Outsiders",y:2019,ep:26,k:"tv",e:7,lo:17,d:"Revived after seven years off the air, and darker for it.",o:1},
 {i:"young-justice-season-4-phantoms-2021",t:"Young Justice",sub:"Season 4: Phantoms",y:2021,ep:26,k:"tv",e:7,lo:18,d:"The final season to date, running into 2022.",o:1}]},

{n:"37",name:"Justice League Action",
 note:"Eleven-minute episodes at a relentless pace, with Kevin Conroy back as Batman alongside Mark Hamill\u2019s Joker. A greatest-hits reunion in miniature.",
 films:[
 {i:"justice-league-action-complete-series-2016",t:"Justice League Action",sub:"Complete series",y:2016,ep:52,k:"tv",e:7,lo:23,d:"Conroy, Hamill and a rotating cast of DC heroes in bite-sized adventures. Ran to 2018.",o:1},
 {i:"justice-league-action-shorts-2017",t:"Justice League Action Shorts",sub:"22 shorts",y:2017,e:7,lo:24,d:"Twenty-two shorts under three minutes each, made by the same crew as the series. At least six are Batman\u2019s.",b:["s"],o:1}]},

{n:"38",name:"The DC Extended Universe",fmt:"live",
 note:"Batman as a supporting character in somebody else's universe. Ben Affleck for most of it \u2014 but Birds of Prey has no Batman in it at all, and The Flash brings Michael Keaton's back thirty years on.",
 films:[
 {i:"batman-v-superman-dawn-of-justice-2016",t:"Batman v Superman: Dawn of Justice",y:2016,e:7,lo:44,d:"Twenty years on the roof and furious about it. Batman as the one who has already lost too much to be reasonable.",b:[]},
 {i:"suicide-squad-2016",t:"Suicide Squad",y:2016,e:7,lo:45,d:"Task Force X, assembled badly. Batman is in three sequences, and one of them is the reason Harley Quinn is in this universe at all.",b:["m"],o:1},
 {i:"birds-of-prey-2020",t:"Birds of Prey",sub:"and the Fantabulous Emancipation of One Harley Quinn",y:2020,e:7,lo:46,d:"Harley after the break-up, narrating her own film badly out of order. No Batman anywhere in it, and a great deal of Gotham.",b:["m"],o:1},
 {i:"justice-league-2017",t:"Justice League",y:2017,e:7,lo:47,d:"Seven of them, finally. Two versions exist: the theatrical cut and Zack Snyder's four-hour restoration from 2021.",b:[]},
 {i:"zack-snyders-justice-league-2021",t:"Zack Snyder\u2019s Justice League",y:2021,e:7,lo:48,d:"The four-hour cut, finished and restored. The same story with twice as much of it, and a markedly different film for it.",o:1},
 {i:"the-flash-2023",t:"The Flash",y:2023,e:0,out:"many",d:"The multiverse cracks and a second Batman walks in  \u2014  Keaton's, thirty years older. Belongs to no single life.",b:[],o:1}]},

{n:"39",name:"Ninjaverse",
 note:"Batman and his rogues thrown into feudal Japan, animated by Kamikaze Douga. Watch it in Japanese with subtitles if you can \u2014 the dub flattens it.",
 films:[
 {i:"batman-ninja-2018",t:"Batman Ninja",y:2018,e:8,lo:19,d:"Gorilla Grodd's time displacement drops the whole cast into the Sengoku period. It gets much stranger than that."},
 {i:"batman-ninja-vs-yakuza-league-2025",t:"Batman Ninja vs. Yakuza League",y:2025,e:8,lo:20,d:"Japan is floating above Gotham and the Justice League have evil counterparts. Continuity is not the point."}]},

{n:"40",name:"Harley Quinn\u2019s Gotham",
 note:"An adult, profane satire of the whole mythos. Batman is a recurring foil rather than the lead, and the show is sharper about him than most straight adaptations.",
 films:[
 {i:"harley-quinn-season-1-2019",t:"Harley Quinn",sub:"Season 1",y:2019,ep:13,k:"tv",e:8,lo:22,d:"Harley leaves the Joker and builds her own crew. Diedrich Bader plays Batman again, very differently.",b:["m"],o:1},
 {i:"harley-quinn-season-2-2020",t:"Harley Quinn",sub:"Season 2",y:2020,ep:13,k:"tv",e:8,lo:23,d:"Gotham falls apart and the Injustice League moves in.",b:["m"],o:1},
 {i:"harley-quinn-season-3-2022",t:"Harley Quinn",sub:"Season 3",y:2022,ep:10,k:"tv",e:8,lo:24,d:"Harley and Ivy together, and the season that stops treating Gotham as a backdrop.",b:["m"],o:1},
 {i:"harley-quinn-valentines-special-2023",t:"Harley Quinn",sub:"Valentine\u2019s Day special",y:2023,e:0,out:"none",d:"A forty-five minute special between seasons three and four \u2014 filed by Max as the eleventh episode of season three, and twice the length of one. Batman gets the holiday off.",b:["m"],o:1},
 {i:"harley-quinn-season-4-2023",t:"Harley Quinn",sub:"Season 4",y:2023,ep:10,k:"tv",e:8,lo:25,d:"Harley tries heroism; Ivy runs the Legion of Doom.",b:["m"],o:1},
 {i:"kite-man-hell-yeah-2024",t:"Kite Man: Hell Yeah!",y:2024,ep:10,k:"tv",e:8,lo:26,d:"Kite Man buys a bar and Bane becomes a regular. Same Gotham, same writers, and it sets up the fifth season of Harley Quinn.",b:["m"],o:1},
 {i:"harley-quinn-season-5-2024",t:"Harley Quinn",sub:"Season 5",y:2025,ep:10,k:"tv",e:8,lo:27,d:"The most recent run.",b:["m"],o:1}]},

{n:"41",name:"Merry Little Universe",
 note:"A gentler Damian Wayne, and the start of its own small continuity \u2014 the Bat-Fam series carries it on.",
 films:[
 {i:"merry-little-batman-2023",t:"Merry Little Batman",y:2023,e:8,lo:28,d:"Damian, left home alone at Christmas, decides he is Batman now. Warm, funny, and gorgeously animated.",b:["e"]},
 {i:"bat-fam-season-1-2025",t:"Bat-Fam",sub:"Season 1",y:2025,ep:10,k:"tv",e:8,lo:29,d:"The series continuation, with Luke Wilson still voicing Bruce \u2014 a household of reformed villains and a very small Damian.",o:1}]},

{n:"42",name:"Batwoman",fmt:"live",
 note:"Kate Kane takes the cape after Batman disappears, and then the show hands it on again.",
 films:[
 {i:"batwoman-complete-series-2019",t:"Batwoman",sub:"Complete series",y:2019,ep:51,k:"tv",e:11,lo:2,d:"Fifty-one episodes of a Gotham running without its Batman. Its Crisis on Infinite Earths hour puts Kevin Conroy on screen as an older Bruce, which is the single most remarkable thing in the series for this catalogue.",o:1}]},

{n:"43",name:"Single-Season Gotham Shows",bag:1,fmt:"live",
 note:"Two single-season network shows built on a Batman who is already gone. Neither got a second year; both are the only television of their kind. \u2014 no order between these; start anywhere.",
 films:[
 {i:"birds-of-prey-complete-series-2002",t:"Birds of Prey",sub:"Complete series",y:2002,ep:13,k:"tv",e:11,lo:1,d:"Thirteen episodes of a Gotham after Batman left it. Huntress, Oracle and a telepath, on a flashback that costs Barbara Gordon everything.",o:1},
 {i:"gotham-knights-complete-series-2023",t:"Gotham Knights",sub:"Complete series",y:2023,ep:13,k:"tv",e:11,lo:3,d:"Bruce Wayne is murdered in the first hour and his adopted son is blamed for it. Thirteen episodes of the city working out what it does next.",o:1}]},

{n:"44",name:"The DCU",
 note:"James Gunn\u2019s rebooted continuity, shared with the live-action films. Batman is a single passing appearance so far \u2014 the group is here because this is where the rest of it will land.",
 films:[
 {i:"creature-commandos-season-1-2024",t:"Creature Commandos",sub:"Season 1",y:2024,ep:7,k:"tv",e:0,out:"tbd",d:"The first thing made in Gunn\u2019s DCU. Batman is a lightning-lit silhouette over a skylight in one flashback and never speaks \u2014 which is the only reason it is here, and all this continuity has shown of him.",b:["m"],o:1},
 {i:"clayface-2026",t:"Clayface",fmt:"live",y:2026,e:0,out:"tbd",d:"A horror film inside the DC Universe, about a body that will not stay one shape. Gotham with no Batman in it yet \u2014 the part is still uncast.",b:["u","m"],o:1}]}];

 {k:6,  name:"The League years",     note:"Batman as one of a team \u2014 a shared headquarters, joint missions \u2014 and still a partner in the car."},

 {k:8,  name:"The Damian years",     note:"A son raised by assassins, learning the rule."},
 {k:9,  name:"The last years",       note:"Retired, and back out anyway."},
 {k:10, name:"Beyond",               note:"An old man in a chair, and a kid in a new suit."},

    PATH.forEach(function(g, gi){
      out.push({key:"c"+gi, tag:eraTag(g), name:g.name, note:g.note,
                films:groupFilms("c" + gi)});

  } else if(S.mode === "life"){
    ERAS.forEach(function(era, i){
      var fs = groupFilms("e" + era.k);
      fs.sort(function(a,b){
        return ((a.lo || 9999) - (b.lo || 9999)) || (a.gi - b.gi) || (a.ix - b.ix);
      });
      out.push({key:"e"+era.k, tag:(era.k === 0 ? "\u2014" : String(i+1)),
                name:era.name, note:era.note, films:fs});

    DECADES.forEach(function(dec, i){

      fs.sort(function(a,b){ return (a.y - b.y) || a.t.localeCompare(b.t); });

function exportCode(){
  var w = [], k = [], pos = [], orphan = [], inW = {}, inK = {};
  FILMS.forEach(function(f){
    if(S.watched[f.id]){ w.push(idHash(f.id)); pos.push(String(clampRating(S.rated[f.id]))); inW[f.id] = 1; }
    if(S.skipped[f.id]){ k.push(idHash(f.id)); inK[f.id] = 1; }
  });
  Object.keys(S.watched).forEach(function(id){
    if(inW[id] || !S.watched[id]) return;
    w.push(idHash(id)); pos.push(String(clampRating(S.rated[id]))); inW[id] = 1;
  });
  Object.keys(S.skipped).forEach(function(id){
    if(inK[id] || !S.skipped[id]) return;
    k.push(idHash(id)); inK[id] = 1;
  });
  Object.keys(S.rated).forEach(function(id){
    if(inW[id]) return;
    var n = clampRating(S.rated[id]);
    if(n) orphan.push(idHash(id) + n);
  });
  while(pos.length && pos[pos.length - 1] === "0") pos.pop();
  return "NW3W" + w.join("") + "S" + k.join("") + "R" + pos.join("") +
         "O" + orphan.join("") + (S.path ? "P" + PATHCODE[S.path] : "");

function importCode(raw){
  var code = String(raw || "").trim().replace(/\s+/g, "");
  var hit = code.search(/NW\d+[A-Z]/);

  if(!/^NW\d+(?:[A-Z][0-9a-z]*)+$/.test(code)) return null;

  var body = code.replace(/^NW\d+/, "");
  while((sm = sre.exec(body))){ if(!(sm[1] in seg)) seg[sm[1]] = sm[2]; }
  var ver = parseInt((code.match(/^NW(\d+)/) || [0,"1"])[1], 10) || 1;
  var W = seg.W || "", K = seg.S || "", R = seg.R || "", O = seg.O || "";
  var map = {}, i, id, n, order = [];
  FILMS.forEach(function(f){ map[idHash(f.id)] = f.id; });
  var res = {watched:{}, skipped:{}, rated:{}, found:0, unknown:0,
             path:CODEPATH[(seg.P || "").charAt(0)] || ""};
  for(i = 0; i + 5 <= W.length; i += 5){
    id = map[W.substr(i,5)];
    order.push(id || null);
    if(id){ res.watched[id] = 1; res.found++; } else res.unknown++;
  }
  for(i = 0; i + 5 <= K.length; i += 5){
    id = map[K.substr(i,5)];
    if(id){ res.skipped[id] = 1; res.found++; } else res.unknown++;
  }
  if(ver >= 3){
    for(i = 0; i < R.length && i < order.length; i++){
      n = clampRating(parseInt(R.charAt(i), 36));
      if(n && order[i]) res.rated[order[i]] = n;
    }
    for(i = 0; i + 6 <= O.length; i += 6){
      id = map[O.substr(i,5)];
      n = clampRating(parseInt(O.charAt(i+5), 10));
      if(id && n){ res.rated[id] = n; if(!res.watched[id]) res.found++; }
      else if(!id) res.unknown++;
    }
  } else {
    for(i = 0; i + 6 <= R.length; i += 6){
      id = map[R.substr(i,5)];
      n = clampRating(parseInt(R.charAt(i+5), 10));
      if(id && n){ res.rated[id] = n; if(!res.watched[id]) res.found++; }
      else if(!id) res.unknown++;
    }
  }
  return res;
}

function applyImport(res){

function donut(groups, title, sub){
  var C = 263.89;
  var total = 0, done = 0;
  groups.forEach(function(g){ total += g.films.length; done += g.films.filter(isDone).length; });
  if(!total) return "";
  var acc = 0, segs = "";
  groups.forEach(function(g){
    var span = g.films.length / total;
    var vis = Math.max(span - 0.005, 0.002);
    var frac = g.films.filter(isDone).length / g.films.length;
    var col = (g.key === "e0") ? "var(--steel)" : "var(--signal)";
    var off = (-acc * C).toFixed(2);
    segs += '<g data-seg="'+g.key+'">'+
      '<circle cx="50" cy="50" r="42" fill="none" stroke="var(--line2)" stroke-width="11" '+
      'stroke-dasharray="'+(vis*C).toFixed(2)+' '+(C - vis*C).toFixed(2)+'" stroke-dashoffset="'+off+'"></circle>'+
      (frac > 0 ? '<circle cx="50" cy="50" r="42" fill="none" stroke="'+col+'" stroke-width="11" '+
      'stroke-dasharray="'+(vis*frac*C).toFixed(2)+' '+(C - vis*frac*C).toFixed(2)+'" stroke-dashoffset="'+off+'"></circle>' : '')+
      '</g>';
    acc += span;
  });
  var pct = Math.round(done / total * 100);
  return '<div class="pie"><p class="pietitle">'+title+'</p>'+
    '<svg viewBox="0 0 100 100" role="img" aria-label="'+title+', '+pct+' percent complete '+
      '(tap a slice with a pointer; the same jumps are buttons in the list below)">'+
    '<g transform="rotate(-90 50 50)">'+segs+'</g>'+
    '<text class="pcent" x="50" y="52" text-anchor="middle">'+pct+'%</text>'+
    '<text class="plab" x="50" y="62" text-anchor="middle">'+done+' / '+total+'</text></svg>'+
    '<p class="piesub">'+sub+'</p></div>';
}

  if(ae && ae.tagName === "BUTTON" && v.contains(ae) && ae.dataset){
    focus = {}; ["act","id","tf","gk","path","format","theme","scope","filter","n"].forEach(function(k){
      if(ae.dataset[k] !== undefined) focus[k] = ae.dataset[k];
    });
    if(!Object.keys(focus).length) focus = null;
  }
  v.innerHTML = S.tab === "home" ? viewHome()
              : S.tab === "next" ? viewNext()
              : S.tab === "watch" ? viewWatch() : viewStats();
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(b){
    if(b.dataset.tab === S.tab) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });
  if(focus){
    var btns = v.querySelectorAll("button"), bi, cand, k2, hit;
    for(bi = 0; bi < btns.length; bi++){
      cand = btns[bi]; hit = true;
      for(k2 in focus){ if(cand.dataset[k2] !== focus[k2]){ hit = false; break; } }
      if(hit){ try{ cand.focus({preventScroll:true}); }catch(e){ cand.focus(); } break; }
    }
  }
  var qi = document.getElementById("q");
  if(qi && qWasFocused){
    qi.focus();
    var pos = (qSel === null || qSel === undefined) ? qi.value.length : Math.min(qSel, qi.value.length);
    qi.setSelectionRange(pos, pos);
  }
  var maxY = Math.max(0, document.documentElement.scrollHeight - window.innerHeight);
  window.scrollTo(0, Math.min(keep, maxY));
}

function calmScroll(){
  try{
    return (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches)
      ? "auto" : "smooth";
  }catch(e){ return "auto"; }
}
function goToGroup(jk){
  S.tab = "watch"; S.filter = "all"; S.q = "";
  S.mode = (jk.charAt(0) === "e") ? "life" : (jk.charAt(0) === "d") ? "release" : "continuity";
  S.groupOpen = {};
  buildGroups().forEach(function(g){ S.groupOpen[g.key] = (g.key === jk); });
  persist();
  window.scrollTo(0,0); render();
  var target = document.querySelector('.ghead[data-gk="'+jk+'"]');
  if(target && target.scrollIntoView){
    try{ target.scrollIntoView({block:"start", behavior:calmScroll()}); }
    catch(e){ target.scrollIntoView(); }
  }
}

window.addEventListener("storage", function(e){
  if(!e || e.key !== KEY || !e.newValue) return;
  var o; try{ o = JSON.parse(e.newValue); }catch(err){ return; }
  var moved = 0, k;
  for(k in (o.watched || {})){ if(!S.watched[k]){ S.watched[k] = 1; moved++; } }
  for(k in (o.skipped || {})){ if(!S.watched[k] && !S.skipped[k]){ S.skipped[k] = 1; moved++; } }
  for(k in (o.rated || {})){ if(!S.rated[k]){ var rv = clampRating(o.rated[k]); if(rv){ S.rated[k] = rv; moved++; } } }
  if(Array.isArray(o.log)){
    o.log.forEach(function(en){
      if(en && en.id && isFinite(en.ts) && !S.log.some(function(x){ return x.id === en.id; })){
        S.log.push({id:String(en.id), ts:Number(en.ts)}); moved++;
      }
    });
    S.log.sort(function(a,b){ return a.ts - b.ts; });
  }
  if(moved) render();
});

document.getElementById("tabs").addEventListener("click", function(e){
  var b = e.target.closest("button[data-tab]");
  if(!b) return;
  if(b.dataset.tab === "watch" && S.path){ S.mode = S.path; revealHero(); }
  S.tab = b.dataset.tab; window.scrollTo(0,0); render();
});

document.getElementById("topBtn").addEventListener("click", function(){
  try{ window.scrollTo({top:0, behavior:calmScroll()}); }
  catch(e){ window.scrollTo(0, 0); }
});
document.getElementById("ringBtn").addEventListener("click", function(){
  S.tab = "stats"; window.scrollTo(0,0); render();
});

document.getElementById("markBtn").addEventListener("click", function(){
  S.tab = "home"; window.scrollTo(0,0); render();
});

document.getElementById("view").addEventListener("click", function(e){
  var seg = e.target.closest ? e.target.closest("g[data-seg]") : null;
  if(seg){ goToGroup(seg.getAttribute("data-seg")); return; }
  var b = e.target.closest("button");
  if(!b) return;
  if(b.dataset.act === "searchall"){ S.scope = S.scopePref = "all"; S.filter = "all"; persist(); render(); toast("Series added"); return; }
  if(b.dataset.format){
    S.format = b.dataset.format; S.groupOpen = {}; persist(); render();
    return;
  }
  if(b.dataset.scope){
    S.scope = S.scopePref = b.dataset.scope; S.groupOpen = {}; persist(); render();
    toast(S.scope === "all" ? "Series added" : "Films only");
    return;
  }
  if(b.dataset.path){
    if(!isPath(b.dataset.path)) return;
    var first = !S.path;
    S.path = S.mode = b.dataset.path; S.groupOpen = {}; persist(); render();
    window.scrollTo(0,0);
    toast(first ? pathName(S.path) + " it is" : "Path: " + pathName(S.path));
    return;
  }
  if(b.dataset.theme){
    S.theme = (b.dataset.theme === "darker") ? "darker" : "dark";
    persist(); render();
    return;
  }
  if(b.dataset.filter){ S.filter = b.dataset.filter; render(); return; }
  var act = b.dataset.act, id = b.dataset.id;
  if(act === "mypath"){ S.mode = S.path; S.groupOpen = {}; persist(); window.scrollTo(0,0); render(); }
  else if(act === "resume"){ S.tab = "next"; window.scrollTo(0,0); render(); }
  else if(act === "tier"){
    S.tab = "watch"; S.filter = b.dataset.tf; S.q = ""; S.groupOpen = {};
    persist(); window.scrollTo(0,0); render();
  }
  else if(act === "jump"){
    goToGroup(b.dataset.gk);
  }
  else if(act === "watched"){ var w = !!S.watched[id]; toggleWatched(id); toast(w ? "Unmarked" : "Logged"); }
  else if(act === "skip"){ var k = !!S.skipped[id]; toggleSkip(id); toast(k ? "Back in the queue" : "Skipped"); }
  else if(act === "rate"){ rate(id, parseInt(b.dataset.n,10)); }
  else if(act === "peek"){ S.open[id] = !S.open[id]; render(); }
  else if(act === "takelink"){
    var pend = S.pending; S.pending = null;
    if(pend){ applyImport(pend); toast("Restored " + pend.found + " from your backup"); }
    clearPendingHash(); render();
  }
  else if(act === "droplink"){ S.pending = null; clearPendingHash(); render(); toast("Left as it was"); }
  else if(act === "expand"){ S.open[id] = !S.open[id]; render(); }
  else if(act === "group"){ var gk = b.dataset.gk; S.groupOpen[gk] = (S.groupOpen[gk] === false); persist(); render(); }
  else if(act === "allgroups"){ setAllGroups(!anyOpen()); persist(); render(); window.scrollTo(0,0); }
  else if(act === "mkcode"){ S.code = exportCode(); render(); toast("Code ready"); }
  else if(act === "copylink"){
    var lk = restoreLink(S.code);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(lk).then(function(){ toast("Link copied"); },
                                            function(){ toast("Could not copy \u2014 use Copy code"); });
    } else {
      toast("Could not copy \u2014 use Copy code");
    }
  }
  else if(act === "copy"){
    var box = document.getElementById("codebox");
    if(box){
      box.focus(); box.select();
      var done = false;
      try{ done = document.execCommand("copy"); }catch(e){}
      if(!done && navigator.clipboard){
        navigator.clipboard.writeText(S.code).then(function(){ toast("Copied"); },
                                                   function(){ toast("Select and copy"); });
        return;
      }
      toast(done ? "Copied" : "Select and copy");
    }
  }
  else if(act === "dl"){
    toast(download("night-watcher-backup.txt", S.code + "\n") ? "Downloaded" : "Download unavailable");
  }
  else if(act === "restore"){
    var ta = document.getElementById("restorebox");
    var res = doRestore(ta ? ta.value : "");
    if(!res){ toast("That doesn\u2019t look like a backup"); return; }
    toast("Restored " + res.found + (res.unknown ? " \u00b7 " + res.unknown + " kept for a newer version" : ""));
  }
  else if(act === "dljson"){
    toast(download("night-watcher-full.json", exportJSON(), "application/json")
      ? "Full backup downloaded" : "Download unavailable");
  }
  else if(act === "pickfile"){
    var fi = document.getElementById("restorefile");
    if(fi) fi.click();
  }
  else if(act === "reset"){
    if(!S.confirmReset){
      S.confirmReset = true; render();
      setTimeout(function(){ if(S.confirmReset){ S.confirmReset = false; if(S.tab === "stats") render(); } }, 4000);
      return;
    }
    S.confirmReset = false;
    S.watched = {}; S.skipped = {}; S.rated = {}; S.log = []; S.code = "";
    persist(); render(); toast("Progress cleared");
  }
});

document.getElementById("view").addEventListener("change", function(e){
  if(e.target.id !== "restorefile" || !e.target.files || !e.target.files[0]) return;
  var rd = new FileReader();
  rd.onload = function(){
    var res = doRestore(rd.result);
    toast(res ? "Restored " + res.found + " from file" : "That file isn\u2019t a backup");
  };
  rd.readAsText(e.target.files[0]);
});

var qTimer = null;
document.getElementById("view").addEventListener("input", function(e){
  if(e.target.id !== "q") return;
  var v = e.target.value;
  clearTimeout(qTimer);
  qTimer = setTimeout(function(){ S.q = v; render(); }, 180);
});

restore(function(){
  try{ routeHash(); }catch(e){}
  render();
});

function clearPendingHash(){
  if(location.hash.indexOf("#nw=") === 0 && history.replaceState){
    history.replaceState(null, "", location.pathname + location.search);
  }
}
function routeHash(){
  var h = location.hash || "";
  if(h.indexOf("#nw=") === 0){
    var res = importCode(decodeURIComponent(h.slice(4)));
    if(res && (res.found || res.unknown || isPath(res.path))){ S.pending = res; S.tab = "home"; }
    else if(history.replaceState) history.replaceState(null, "", location.pathname + location.search);
  } else if(h.length > 1){
    h.slice(1).toLowerCase().split(/[-+]/).forEach(function(tok){
      if(tok === "life"){ S.tab = "watch"; S.mode = "life"; revealHero(); }
      else if(tok === "release"){ S.tab = "watch"; S.mode = "release"; revealHero(); }
      else if(tok === "universes" || tok === "path"){ S.tab = "watch"; S.mode = "continuity"; revealHero(); }
      else if(tok === "progress"){ S.tab = "stats"; }
      else if(tok === "next"){ S.tab = "next"; }
      else if(tok === "series"){ S.scope = "all"; }
      else if(tok === "movies"){ S.scope = "movies"; }
    });
  }
}
window.addEventListener("hashchange", function(){
  try{ routeHash(); }catch(e){}
  render();
});

if("serviceWorker" in navigator &&
   (location.protocol === "https:" || location.hostname === "localhost")){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
