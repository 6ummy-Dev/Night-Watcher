<style>
/* The page says alley, so the page is an alley: two walls in perspective,
   ten faces a side, each face wearing a form from the app's own ROOFS table
   (setback, zig2, block, zig3, twin, spire) with its crown carried along the
   perspective slope. The right wall is the left one mirrored. Generated once
   and committed — it carries no data, so it never regenerates.

   The bat hangs at the vanishing point, dim, with the walls closing over its
   edges — the mark stays on the page (section 115 counts four copies of the
   glyph and they must agree) and it reads as something seen down the street
   rather than a watermark behind the type.

   --wall-b is the lightest area fill in the picture and --scrim is what sits
   over it where the text is: section 118 does the arithmetic on those two and
   holds h1 and p to AA. Change either and the guard recomputes. */
:root{--ink:#08090F;--wall-a:#0B0F1A;--wall-b:#0E1420;--line2:#33405C;
  --bone:#E7E9F0;--dust:#93A0B8;--signal:#FFCF1F;--win:#151D2C;--scrim:.84;}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--ink);color:var(--bone);font-family:ui-monospace,Menlo,Consolas,monospace;
  text-align:center;padding:24px;position:relative;}
.alley{position:fixed;inset:0;pointer-events:none;overflow:hidden;}
.far{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(64vw,470px);height:min(48vh,350px);
  background:radial-gradient(ellipse at 50% 62%,rgba(255,207,31,.09),rgba(255,207,31,.025) 46%,transparent 74%);}
.bat{position:absolute;left:50%;top:50%;transform:translate(-50%,-52%);
  width:min(30vw,250px);height:auto;opacity:.08;}
.wall{position:absolute;top:0;height:100%;width:min(34vw,470px);}
.wall.l{left:0;}
.wall.r{right:0;transform:scaleX(-1);}
.wall .a{fill:var(--wall-a);}
.wall .b{fill:var(--wall-b);}
.wall .c{stroke:var(--line2);stroke-width:1;stroke-opacity:.65;}
.wall .s{stroke:var(--line2);stroke-width:1;stroke-opacity:.45;}
.wall .e{stroke:var(--line2);stroke-width:1.3;stroke-opacity:.8;}
.wall .g{fill:none;stroke:var(--line2);stroke-width:1.4;stroke-opacity:.55;}
.wall .w{fill:var(--win);opacity:.45;}
.wall .l{fill:var(--signal);opacity:.55;}
.scrim{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse 60% 50% at 50% 50%,rgba(8,9,15,var(--scrim)) 0%,rgba(8,9,15,.6) 56%,rgba(8,9,15,.18) 100%);}
main{max-width:420px;position:relative;}
h1{font-size:17px;letter-spacing:.09em;text-transform:uppercase;margin:0 0 12px;}
p{color:var(--dust);font-size:14px;line-height:1.6;margin:0 0 24px;}
a{display:inline-block;background:var(--signal);color:var(--ink);text-decoration:none;font-weight:600;
  padding:14px 24px;border-radius:0;font-size:12px;letter-spacing:.07em;text-indent:.07em;
  text-transform:uppercase;}
@media (max-width:560px){
  .wall{width:22vw;}
  .scrim{background:radial-gradient(ellipse 70% 44% at 50% 50%,rgba(8,9,15,.94) 0%,rgba(8,9,15,.74) 52%,rgba(8,9,15,.24) 100%);}
}
@media (prefers-contrast:more){.alley,.scrim{display:none;}}
</style>
