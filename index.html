<style>
:root{
  --ink:#08090F; --sunk:#0C111C; --card:#141B2C; --card2:#1B2438;
  --line:#252E42; --line2:#33405C;
  --bone:#E7E9F0; --dust:#93A0B8; --dim:#78849E;
  --signal:#FFCF1F; --steel:#5B84C4; --crimson:#C43A30; --moss:#7FA98B;
  --deco:"Limelight","Big Shoulders Display",serif;
  --disp:"Anton","Haettenschweiler","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --tab-h:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--ink);color:var(--bone);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior:none;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:4px;}
#app{display:flex;flex-direction:column;min-height:100%;}
header{position:sticky;top:0;z-index:30;background:rgba(10,12,17,.9);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;}
.hrow{display:flex;align-items:center;gap:14px;max-width:760px;margin:0 auto;}
.mark{width:46px;flex:none;padding:0;color:var(--signal);display:flex;justify-content:center;align-items:center;}
.mark svg{display:block;width:32px;height:auto;}
.wordmark{flex:1;min-width:0;text-align:center;}
.wordmark h1{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:23px;line-height:.95;margin:0;}
.wordmark p{font-family:var(--mono);font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);margin:4px 0 0;}
main{flex:1;padding:18px 18px calc(var(--tab-h) + env(safe-area-inset-bottom) + 28px);max-width:760px;margin:0 auto;width:100%;}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:rgba(14,17,25,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
#tabs button{flex:1;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);}
#tabs button[aria-selected="true"]{color:var(--signal);}
.hero{border:1px solid var(--line);border-radius:16px;background:linear-gradient(175deg,var(--card2),var(--card) 60%);padding:22px 20px 20px;}
.hero h2{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:clamp(28px,7.5vw,42px);line-height:.94;margin:0;}
.empty{text-align:center;padding:60px 20px;color:var(--dim);}
.empty .big{font-family:var(--disp);font-weight:700;text-transform:uppercase;font-size:26px;color:var(--dust);margin-bottom:8px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="hrow">
      <button class="mark" id="markBtn" aria-label="Home">
        <svg viewBox="8 16 84 70" aria-hidden="true"><g fill="currentColor" transform="translate(0,5)">
          <path d="M50 36 C 44 25, 29 21, 12 30 C 21 34, 25 41, 24 50 C 31 45, 37 47, 39 55 C 43 50, 47 51, 49 58 L 50 61 L 51 58 C 53 51, 57 50, 61 55 C 63 47, 69 45, 76 50 C 75 41, 79 34, 88 30 C 71 21, 56 25, 50 36 Z"/>
          <path d="M42 32 L38 17 L49 29 Z"/><path d="M58 32 L62 17 L51 29 Z"/>
          <ellipse cx="50" cy="42" rx="10" ry="11"/>
          <path d="M50 51 C 45 60, 45 69, 50 78 C 55 69, 55 60, 50 51 Z"/>
        </g></svg>
      </button>
      <div class="wordmark"><h1>Night Watcher</h1><p id="hsub">Restoring...</p></div>
    </div>
  </header>
  <main id="view">
    <div class="empty">
      <div class="big">Restoring the full app</div>
      <p>The complete index.html is being put back. Refresh in a minute.</p>
    </div>
  </main>
  <nav id="tabs">
    <button data-tab="home" aria-selected="true"><span class="ic">&#8962;</span>Home</button>
  </nav>
</div>
</body>
</html>
