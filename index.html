<style>
:root{
  --ink:#0A0C11; --sunk:#0E1119; --card:#161C29; --card2:#1D2534;
  --line:#28303F; --line2:#333D4F;
  --bone:#E9E3D5; --dust:#8B94A7; --dim:#5C6678;
  --signal:#E3A72C; --crimson:#B03A3A; --steel:#6E9BC4; --moss:#7FA98B;
  --disp:"Big Shoulders Display","Haettenschweiler","Arial Narrow",Impact,sans-serif;
  --body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --tab-h:58px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{background:var(--ink);color:var(--bone);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior:none;}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px;border-radius:4px;}

#app{display:flex;flex-direction:column;min-height:100%;}
header{position:sticky;top:0;z-index:30;background:rgba(10,12,17,.9);-webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 12px) 18px 12px;}
.hrow{display:flex;align-items:center;gap:14px;max-width:760px;margin:0 auto;}
.wordmark{flex:1;min-width:0;}
.wordmark h1{font-family:var(--disp);font-weight:800;text-transform:uppercase;font-size:23px;line-height:.95;margin:0;}
.wordmark p{font-family:var(--mono);font-size:9.5px;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);margin:4px 0 0;}
.ring{width:46px;height:46px;flex:none;position:relative;padding:0;border:0;background:none;cursor:pointer;}
.ring:active{opacity:.7;}
.pies{display:flex;gap:10px;margin-bottom:18px;}
.pie{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;background:var(--sunk);padding:13px 8px 11px;}
.pietitle{font-family:var(--mono);font-size:8.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dust);margin:0 0 9px;text-align:center;}
.pie svg{width:100%;max-width:148px;height:auto;display:block;margin:0 auto;}
.pie svg g[data-seg]{cursor:pointer;}
.piesub{font-family:var(--mono);font-size:8.5px;color:var(--dim);margin:9px 0 0;letter-spacing:.05em;text-align:center;line-height:1.5;}
.pcent{font-family:var(--disp);font-size:19px;fill:var(--bone);}
.plab{font-family:var(--mono);font-size:6px;fill:var(--dim);letter-spacing:.14em;}
.ring svg{transform:rotate(-90deg);display:block;}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--mono);font-size:11px;font-weight:600;}
main{flex:1;padding:18px 18px calc(var(--tab-h) + env(safe-area-inset-bottom) + 28px);max-width:760px;margin:0 auto;width:100%;}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:rgba(14,17,25,.94);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);}
#tabs button{flex:1;height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);transition:color .15s;}
#tabs button .ic{font-size:17px;line-height:1;}
#tabs button[aria-selected="true"]{color:var(--signal);}

.modes{display:flex;gap:0;border:1px solid var(--line2);border-radius:10px;overflow:hidden;margin-bottom:10px;}
.modes button{flex:1;padding:11px 6px;font-family:var(--mono);font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dust);border-right:1px solid var(--line2);min-height:42px;}
.modes button:last-child{border-right:0;}

.film{border-top:1px solid var(--line);}

.tbar i{display:block;height:100%;}

.tchev{color:var(--dim);font-size:12px;flex:none;}
.segs{display:flex;gap:3px;flex:1;}
.segs i{flex:1;height:8px;border-radius:2px;background:var(--line2);}

.recent{border-top:1px solid var(--line);}

.toast{position:fixed;left:50%;transform:translate(-50%,80px);bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px);background:var(--bone);color:var(--ink);border-radius:100px;padding:11px 20px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;z-index:60;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden;}
.toast.show{opacity:1;transform:translate(-50%,0);}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}

/* ---------- Canon skin: Dark Deco ---------- */

.ikick{font-family:var(--mono);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--signal);margin:0 0 10px;}

}

.gnum{border-color:rgba(255,207,31,.4);}
.ucard.full{border-color:rgba(255,207,31,.55);}

 {k:2020, name:"The 2020s",       note:"The Tomorrowverse, the reset, and Knightfall."}
];

var BADGE = {e:"ESSENTIAL", m:"MATURE", u:"NOT OUT YET", o:"OPTIONAL", s:"SHORT", c:"INTERACTIVE", k:"CORE"};
var MODENOTE = {
 continuity:"Grouped by universe, each in its own story order. The safest way through \u2014 nothing spoils anything ahead of it.",
 life:"One composite life, stitched from every continuity. These are different Bruces from different realities, so this is an interpretation, not a canon \u2014 but it is as chronological as the material allows. Films with no place in a single lifetime are collected at the end.",
 release:"Straight release order, 1993 to 2028. The only ordering that is objectively complete \u2014 it just jumps between universes constantly."
};

function slug(t){ return t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,44); }

var FILMS = [];
PATH.forEach(function(g, gi){
  g.films.forEach(function(f, fx){
    FILMS.push({id:slug(f.t+(f.sub?" "+f.sub:""))+"-"+f.y, gi:gi, ix:fx, gn:g.n, gname:g.name,
                where:g.where, t:f.t, sub:f.sub||"", ep:f.ep||0, tv:(f.k==="tv"),
                y:f.y, d:f.d, e:(f.e||0), b:f.b||[], o:!!f.o});
  });
});

var S = {tab:"home", scope:"movies", mode:"continuity", filter:"all", q:"",
         watched:{}, skipped:{}, rated:{}, open:{}, groupOpen:{}, log:[]};
var KEY = "batwatch-v3";
var canSave = true;

/* Storage adapter: window.storage inside Claude artifacts; localStorage on the
   open web (GitHub Pages etc.); memory-only if neither is available. */
var store = (function(){
  if (typeof window.storage === "object" && window.storage &&
      typeof window.storage.get === "function") {
    return {
      get: function(k){
        return Promise.resolve(window.storage.get(k)).then(function(r){ return r ? r.value : null; });
      },
      set: function(k, v){ return Promise.resolve(window.storage.set(k, v)); }
    };
  }
  try {
    var t = "__nw_probe__";
    window.localStorage.setItem(t, "1");
    window.localStorage.removeItem(t);
    return {
      get: function(k){ return Promise.resolve(window.localStorage.getItem(k)); },
      set: function(k, v){ window.localStorage.setItem(k, v); return Promise.resolve(); }
    };
  } catch(e){ return null; }
})();
if(!store) canSave = false;

function persist(){
  if(!canSave || !store) return;
  var payload = JSON.stringify({watched:S.watched, skipped:S.skipped, rated:S.rated,
                                mode:S.mode, scope:S.scope, log:S.log});
  try{
    var p = store.set(KEY, payload);
    if(p && p.catch) p.catch(function(){ canSave = false; });
  }catch(e){ canSave = false; }
}
function restore(done){
  var finish = function(raw){
    if(raw){
      try{
        var o = JSON.parse(raw);
        S.watched = o.watched || {}; S.skipped = o.skipped || {};
        S.rated = o.rated || {};
        S.log = Array.isArray(o.log) ? o.log : [];
        if(o.mode) S.mode = o.mode;
        if(o.scope) S.scope = o.scope;
      }catch(e){}
    }
    done();
  };
  if(!store){ finish(null); return; }
  try{
    store.get(KEY).then(finish, function(){ finish(null); });
  }catch(e){ canSave = false; finish(null); }
}

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

/* ---- ordering ---- */
function visible(f){ return S.scope === "all" || !f.tv; }

function buildGroups(){
  var out = [];
  if(S.mode === "continuity"){
    PATH.forEach(function(g, gi){
      out.push({key:"c"+gi, tag:g.n, name:g.name, note:g.note, where:g.where,
                films:FILMS.filter(function(f){ return f.gi === gi && visible(f); })});
    });
  } else if(S.mode === "life"){
    ERAS.forEach(function(era, i){
      var fs = FILMS.filter(function(f){ return f.e === era.k && visible(f); });
      fs.sort(function(a,b){ return (a.gi - b.gi) || (a.ix - b.ix); });
      out.push({key:"e"+era.k, tag:(era.k === 0 ? "\u2014" : String(i+1)),
                name:era.name, note:era.note, where:"", films:fs});
    });
  } else {
    DECADES.forEach(function(dec, i){
      var fs = FILMS.filter(function(f){ return visible(f) && f.y >= dec.k && f.y < dec.k + 10; });
      fs.sort(function(a,b){ return (a.y - b.y) || a.t.localeCompare(b.t); });
      out.push({key:"d"+dec.k, tag:String(i+1), name:dec.name, note:dec.note, where:"", films:fs});
    });
  }
  return out.filter(function(g){ return g.films.length; });
}
function pool(){
  var p = [];
  buildGroups().forEach(function(g){ p = p.concat(g.films); });
  return p;
}
function isDone(f){ return !!S.watched[f.id]; }
function isSkip(f){ return !!S.skipped[f.id]; }
function counts(){
  var p = pool(), done = 0, skip = 0;
  p.forEach(function(f){ if(isDone(f)) done++; else if(isSkip(f)) skip++; });
  return {total:p.length, done:done, skip:skip, left:p.length - done - skip};
}
function upNext(){
  var p = pool(), i;
  for(i=0;i<p.length;i++){ if(!isDone(p[i]) && !isSkip(p[i])) return p[i]; }
  for(i=0;i<p.length;i++){ if(!isDone(p[i])) return p[i]; }
  return null;
}
function metaOf(f, withUniverse){
  var bits = [];
  if(f.sub) bits.push(f.sub);
  bits.push(String(f.y));
  if(f.ep) bits.push(f.ep + (f.ep === 1 ? " episode" : " episodes"));
  if(withUniverse) bits.push(f.gname);
  return bits.join(" \u00b7 ");
}
function badges(f){
  var tier = f.b.indexOf("e") >= 0 ? "e" : (f.o ? "o" : "k");
  var out = ['<span class="bd '+tier+'">'+BADGE[tier]+'</span>'];
  f.b.forEach(function(k){
    if(k === "e") return;
    out.push('<span class="bd '+k+'">'+BADGE[k]+'</span>');
  });
  return '<span class="badges">'+out.join("")+'</span>';
}
function watchLinks(f){
  var qt = encodeURIComponent(f.t);
  var qy = encodeURIComponent(f.t + " " + f.y);
  return '<a class="lnk" href="https://www.justwatch.com/us/search?q='+qt+
           '" target="_blank" rel="noopener">Streaming now \u2197</a>'+
         '<a class="lnk" href="https://www.amazon.com/s?k='+qy+
           '&amp;i=instant-video" target="_blank" rel="noopener">Rent on Prime \u2197</a>'+
         '<a class="lnk" href="https://tv.apple.com/search?term='+qt+
           '" target="_blank" rel="noopener">Apple TV \u2197</a>';
}
var toastT;
function toast(msg){
  var el = document.getElementById("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(function(){ el.classList.remove("show"); }, 1700);
}

function markWatched(id){
  if(S.watched[id]) return;
  S.watched[id] = 1; delete S.skipped[id];
  S.log.push({id:id, ts:Date.now()});
}
function unmarkWatched(id){
  delete S.watched[id];
  S.log = S.log.filter(function(e){ return e.id !== id; });
}
function toggleWatched(id){
  if(S.watched[id]) unmarkWatched(id);
  else markWatched(id);
  persist(); render();
}
function toggleSkip(id){
  if(S.skipped[id]) delete S.skipped[id];
  else { S.skipped[id] = 1; unmarkWatched(id); }
  persist(); render();
}
function rate(id, n){
  if(S.rated[id] === n) delete S.rated[id]; else S.rated[id] = n;
  markWatched(id);
  persist(); render();
}

  var fresh = (c.done === 0);
  var html = "";

      '<p class="blurb">Gotham sleeps. All 95 films logged — including every side story.</p></div>';
  }

  var nFilm = FILMS.filter(function(f){ return !f.tv; }).length;

  html += '<div class="scope">'+
    '<button data-scope="movies" aria-pressed="'+(S.scope==="movies")+'">Movies</button>'+

    '<p class="scopenote">'+(S.scope==="movies"
      ? nFilm+' films. Switch on the series to add '+nTv+' seasons of television \u2014 every show from 1968 to now.'
      : nFilm+' films and '+nTv+' seasons of television, woven into the same orders.')+'</p>';

  var segs = "";
  for(var i = 0; i < ess.length; i++){ segs += '<i class="'+(i < essDone ? "on" : "")+'"></i>'; }
  html += '<div class="tiers">'+
    '<button class="trow" data-act="tier" data-tf="ess">'+
      '<span class="tlab" style="color:var(--signal)">Essentials</span>'+
      '<span class="segs">'+segs+'</span>'+
      '<span class="tcount">'+essDone+'/'+ess.length+'</span><span class="tchev">\u203A</span></button>'+
    '<button class="trow" data-act="tier" data-tf="core">'+
      '<span class="tlab" style="color:var(--dust)">Core route</span>'+
      '<span class="tbar"><i style="width:'+(coreFs.length ? Math.round(coreDone/coreFs.length*100) : 0)+'%;background:var(--dust)"></i></span>'+
      '<span class="tcount">'+coreDone+'/'+coreFs.length+'</span><span class="tchev">\u203A</span></button>'+
    '<button class="trow" data-act="tier" data-tf="opt">'+

  var f = upNext(), c = counts();

function chipSet(){
  var base = [["all","All"],["left","To watch"],["done","Watched"]];
  var tiers = {core:"Core route", ess:"Essentials", opt:"Optional"};
  if(tiers[S.filter]) base.splice(1, 0, [S.filter, tiers[S.filter]]);
  return base;
}
function viewWatch(){
  var q = S.q.toLowerCase();
  var html = '<div class="modes">'+
    [['continuity','By universe'],['life',"Bruce's life"],['release','Release order']].map(function(m){
      return '<button data-mode="'+m[0]+'" aria-pressed="'+(S.mode===m[0])+'">'+m[1]+'</button>';
    }).join("")+'</div>'+
    '<p class="modenote">'+MODENOTE[S.mode]+'</p>'+
    '<input class="search" id="q" type="search" placeholder="Search films" value="'+esc(S.q)+'">'+
    '<div class="chips">'+
    chipSet().map(function(p){
      return '<button class="chip" data-filter="'+p[0]+'" aria-pressed="'+(S.filter===p[0])+'">'+p[1]+'</button>';
    }).join("")+'</div>';

  var any = false;
  buildGroups().forEach(function(g){
    var rows = "", shown = 0, gdone = 0, gtot = g.films.length;
    g.films.forEach(function(f){
      if(isDone(f)) gdone++;
      if(S.filter === "core" && f.o) return;
      if(S.filter === "opt" && !f.o) return;
      if(S.filter === "left" && (isDone(f) || isSkip(f))) return;
      if(S.filter === "done" && !isDone(f)) return;
      if(S.filter === "ess" && f.b.indexOf("e") < 0) return;
      if(q && f.t.toLowerCase().indexOf(q) < 0 && f.d.toLowerCase().indexOf(q) < 0) return;
      shown++;
      var cls = "film" + (isDone(f)?" done":"") + (isSkip(f)?" skip":"") + (S.open[f.id]?" open":"");
      var meta = metaOf(f, S.mode !== "continuity");
      var stars = "", s;
      for(s=1;s<=5;s++){
        stars += '<button data-act="rate" data-id="'+f.id+'" data-n="'+s+'" class="'+
                 ((S.rated[f.id]||0) >= s ? "on":"")+'" aria-label="Rate '+s+'">\u2605</button>';
      }
      rows += '<div class="'+cls+'"><div class="frow">'+
        '<button class="tick" data-act="watched" data-id="'+f.id+'" aria-label="Mark watched"></button>'+
        '<button class="fmain" data-act="expand" data-id="'+f.id+'">'+
          '<div class="ftitle">'+esc(f.t)+'</div><div class="fmeta">'+esc(meta)+'</div>'+badges(f)+
        '</button></div>'+
        '<div class="fdetail"><p>'+esc(f.d)+'</p><div class="acts">'+
          '<button class="act'+(isDone(f)?" primary":"")+'" data-act="watched" data-id="'+f.id+'">'+
            (isDone(f)?"Watched":"Mark watched")+'</button>'+
          '<button class="act" data-act="skip" data-id="'+f.id+'">'+(isSkip(f)?"Unskip":"Skip")+'</button>'+
          '<div class="stars">'+stars+'</div>'+
        '</div><div class="linkrow">'+watchLinks(f)+'</div></div></div>';
    });
    if(!shown) return;
    any = true;
    var pct = gtot ? Math.round(gdone/gtot*100) : 0;
    var isOpen = S.groupOpen[g.key] !== false;
    var sub = gdone + " of " + gtot + (g.where ? " \u00b7 " + g.where : "");
    html += '<div class="group'+(isOpen?" open":"")+'">'+
      '<button class="ghead" data-act="group" data-gk="'+g.key+'">'+

      (g.where ? '<p class="gwhere">Where to watch \u2014 <b>'+esc(g.where)+'</b></p>' : '')+
      rows+'</div></div>';
  });
  if(!any) html += '<div class="empty"><div class="big">Nothing here</div><p>No films match that filter.</p></div>';
  return html;
}

function donut(groups, title, sub){
  var C = 263.89;
  var total = 0, done = 0;
  groups.forEach(function(g){ total += g.films.length; done += g.films.filter(isDone).length; });
  if(!total) return "";
  var acc = 0, segs = "";
  groups.forEach(function(g){
    var span = g.films.length / total;
    var vis = Math.max(span - 0.005, 0.002);
    var frac = g.films.filter(isDone).length / g.films.length;
    var col = (g.key === "e0") ? "var(--steel)" : "var(--signal)";
    var off = (-acc * C).toFixed(2);
    segs += '<g data-seg="'+g.key+'">'+
      '<circle cx="50" cy="50" r="42" fill="none" stroke="var(--line2)" stroke-width="11" '+
      'stroke-dasharray="'+(vis*C).toFixed(2)+' '+(C - vis*C).toFixed(2)+'" stroke-dashoffset="'+off+'"></circle>'+
      (frac > 0 ? '<circle cx="50" cy="50" r="42" fill="none" stroke="'+col+'" stroke-width="11" '+
      'stroke-dasharray="'+(vis*frac*C).toFixed(2)+' '+(C - vis*frac*C).toFixed(2)+'" stroke-dashoffset="'+off+'"></circle>' : '')+
      '</g>';
    acc += span;
  });
  var pct = Math.round(done / total * 100);
  return '<div class="pie"><p class="pietitle">'+title+'</p>'+
    '<svg viewBox="0 0 100 100" role="img" aria-label="'+title+', '+pct+' percent complete">'+
    '<g transform="rotate(-90 50 50)">'+segs+'</g>'+
    '<text class="pcent" x="50" y="52" text-anchor="middle">'+pct+'%</text>'+
    '<text class="plab" x="50" y="62" text-anchor="middle">'+done+' / '+total+'</text></svg>'+
    '<p class="piesub">'+sub+'</p></div>';
}

      '<span><i style="color:var(--moss)">Interactive</i></span>'+
      '<span><i>Short</i> \u2014 under 30 min</span></div>';

  html += '<p class="qhead" style="margin:26px 0 0">By universe</p>';
  PATH.forEach(function(g, gi){
    var fs = FILMS.filter(function(f){ return f.gi === gi && visible(f); });
    if(!fs.length) return;
    var d = fs.filter(isDone).length;
    html += '<div class="srow"><span class="sn">'+esc(g.name)+'</span>'+
      '<span class="sb"><i style="width:'+Math.round(d/fs.length*100)+'%"></i></span>'+
      '<span class="sc">'+d+'/'+fs.length+'</span></div>';
  });

  html += '<p class="qhead" style="margin:26px 0 0">By era of Bruce\u2019s life</p>';
  ERAS.forEach(function(era){
    var fs = FILMS.filter(function(f){ return f.e === era.k && visible(f); });
    if(!fs.length) return;
    var d = fs.filter(isDone).length;
    var col = era.k === 0 ? "var(--steel)" : "var(--signal)";
    html += '<div class="srow"><span class="sn">'+esc(era.name)+'</span>'+
      '<span class="sb"><i style="width:'+Math.round(d/fs.length*100)+'%;background:'+col+'"></i></span>'+
      '<span class="sc">'+d+'/'+fs.length+'</span></div>';
  });

  var rated = FILMS.filter(function(f){ return S.rated[f.id]; })
                   .sort(function(a,b){ return S.rated[b.id]-S.rated[a.id]; });
  if(rated.length){
    html += '<p class="qhead" style="margin:28px 0 4px">Your ratings</p>';
    rated.forEach(function(f){
      html += '<div class="srow"><span class="sn">'+esc(f.t)+'</span>'+
        '<span class="sc" style="width:auto;color:var(--signal)">'+
        new Array(S.rated[f.id]+1).join("\u2605")+'</span></div>';
    });
  }
  html += '<button class="danger" data-act="reset">Clear all progress</button>';
  html += '<p class="note">'+(canSave
    ? "Progress saves automatically on this device and follows you across all three orderings."
    : "Saving is unavailable here, so progress lasts for this session only.")+
    ' Streaming rows rotate monthly, so the "Streaming now" link on each film checks live availability. Knightfall and Dynamic Duo dates are as announced and can move.</p>';
  return html;
}

function render(){
  var c = counts(), pct = c.total ? c.done / c.total : 0;
  document.getElementById("ringArc").setAttribute("stroke-dashoffset", (119.4 * (1 - pct)).toFixed(1));
  document.getElementById("ringPct").textContent = Math.round(pct*100) + "%";
  document.getElementById("hsub").textContent =
    c.done + " of " + c.total + " logged \u00b7 " + buildGroups().length + " continuities";
  var v = document.getElementById("view"), keep = v.scrollTop;
  var qPrev = document.getElementById("q");
  var qSel = qPrev ? qPrev.selectionStart : null;
  v.innerHTML = S.tab === "home" ? viewHome()
              : S.tab === "next" ? viewNext()
              : S.tab === "watch" ? viewWatch() : viewStats();
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(b){
    b.setAttribute("aria-selected", b.dataset.tab === S.tab);
  });
  var qi = document.getElementById("q");
  if(qi && S.q){
    qi.focus();
    var pos = (qSel === null || qSel === undefined) ? qi.value.length : Math.min(qSel, qi.value.length);
    qi.setSelectionRange(pos, pos);
  }
  v.scrollTop = keep;
}

function goToGroup(jk){
  S.tab = "watch"; S.filter = "all"; S.q = "";
  S.mode = (jk.charAt(0) === "e") ? "life" : "continuity";
  S.groupOpen = {};
  buildGroups().forEach(function(g){ S.groupOpen[g.key] = (g.key === jk); });
  window.scrollTo(0,0); persist(); render();
}

document.getElementById("tabs").addEventListener("click", function(e){
  var b = e.target.closest("button[data-tab]");
  if(!b) return;
  S.tab = b.dataset.tab; window.scrollTo(0,0); render();
});

document.getElementById("ringBtn").addEventListener("click", function(){
  S.tab = "stats"; window.scrollTo(0,0); render();
});

document.getElementById("view").addEventListener("click", function(e){
  var seg = e.target.closest ? e.target.closest("g[data-seg]") : null;
  if(seg){ goToGroup(seg.getAttribute("data-seg")); return; }
  var b = e.target.closest("button");
  if(!b) return;
  if(b.dataset.scope){
    S.scope = b.dataset.scope; S.groupOpen = {}; persist(); render();
    toast(S.scope === "all" ? "Series added" : "Films only");
    return;
  }
  if(b.dataset.mode){ S.mode = b.dataset.mode; S.groupOpen = {}; persist(); render(); return; }
  if(b.dataset.filter){ S.filter = b.dataset.filter; render(); return; }
  var act = b.dataset.act, id = b.dataset.id;
  if(act === "resume"){ S.tab = "next"; window.scrollTo(0,0); render(); }
  else if(act === "tier"){
    S.tab = "watch"; S.filter = b.dataset.tf; S.q = ""; S.groupOpen = {};
    window.scrollTo(0,0); render();
  }
  else if(act === "jump"){
    goToGroup(b.dataset.gk);
  }
  else if(act === "watched"){ var w = !!S.watched[id]; toggleWatched(id); toast(w ? "Unmarked" : "Logged"); }
  else if(act === "skip"){ var k = !!S.skipped[id]; toggleSkip(id); toast(k ? "Back in the queue" : "Skipped"); }
  else if(act === "rate"){ rate(id, parseInt(b.dataset.n,10)); }
  else if(act === "expand"){ S.open[id] = !S.open[id]; render(); }
  else if(act === "group"){ var gk = b.dataset.gk; S.groupOpen[gk] = (S.groupOpen[gk] === false); render(); }
  else if(act === "reset"){ S.watched = {}; S.skipped = {}; S.rated = {}; S.log = []; persist(); render(); toast("Progress cleared"); }
});

document.getElementById("view").addEventListener("input", function(e){
  if(e.target.id !== "q") return;
  S.q = e.target.value; render();
});

restore(render);
</script>
